openapi: 3.1.0
info:
  title: Gennety Public API (mobile surface)
  version: 1.0.0
  description: |
    Contract for the native mobile client (Gennety-iOS). Covers the JWT-authed
    `/v1/*` surface the MVP client consumes. Source of truth for shapes is the
    route code in `apps/bot/src/public/` — this spec MUST be updated in the
    same commit as any change to those routes (see AGENTS.md documentation
    impact check). The Swift client is generated from this file
    (`swift-openapi-generator` in the Gennety-iOS repo).

    Endpoints authed with Telegram `initData` HMAC (calendar, tickets,
    feedback, telegram-onboarding) are intentionally NOT here — they are Mini
    App-only. Mobile variants will be added as they are built.

    `/v1/venue-change/*` used to be in that list. Since 2026-09-12 the board
    takes EITHER rail — `tma <initData>` or a JWT bearer — so the seven
    endpoints the native client needs are specified here. The three that stay
    out are Telegram-shaped rather than unbuilt: `stars-invoice` mints a
    Telegram Stars invoice link (iOS pays through StoreKit instead, see
    `/v1/venue-change/appstore/transaction`), `pay-decline` is the twin of an
    inline chat button, and `photo` takes initData in its query because an
    `<img>` sends no headers — the native client is served signed `photoUrl` /
    `thumbnailUrl` links on the board payloads instead.

    `/v1/radar/*` (Type Radar) joined them on 2026-09-14: the same routes the
    Mini App calls take either rail, so one deck, one chip set and one
    preference vector serve both clients. The only rail-dependent behaviour is
    the Telegram chat continuation after a submit, which runs for `tma` only.
  contact:
    name: Gennety Dating

servers:
  - url: https://dating-api.gennety.com
    description: Production

tags:
  - name: system
  - name: auth
  - name: me
  - name: onboarding
  - name: chat
  - name: inbox
  - name: matches
  - name: countdown
  - name: music
    description: >-
      Spotify tracks pinned to a profile, catalogue search, and the one-time
      top-tracks import. Display-only — never a matching or AI input.
  - name: radar
    description: >-
      Type Radar: a short visual calibration of appearance preference over a
      deck of prepared portraits (never real users). Feeds the soft `V_type`
      matching multiplier; nobody else ever sees the answers.

security:
  - bearerAuth: []

paths:
  /v1/ping:
    get:
      tags: [system]
      operationId: ping
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                required: [ok, now]
                properties:
                  ok: { type: boolean, const: true }
                  now: { type: string, format: date-time }

  /v1/app/config:
    get:
      tags: [system]
      operationId: getAppConfig
      summary: Pre-auth mobile bootstrap — forced-update kill switch + feature flags
      description: |
        Unauthenticated by design: the client must learn "update required"
        before it can log in. `minSupportedIosVersion` null → no forced update.
      security: []
      responses:
        "200":
          description: Client bootstrap payload
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppConfig" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/otp/request:
    post:
      tags: [auth]
      operationId: requestEmailOtp
      summary: Send a one-time code to a university email (student track)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: Email provider failure
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyEmailOtp
      summary: Verify the emailed code and mint tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, otp]
              properties:
                email: { type: string, format: email }
                otp:
                  type: string
                  pattern: "^\\d{4,8}$"
      responses:
        "200":
          description: Tokens + serialized user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Code mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/phone/request:
    post:
      tags: [auth]
      operationId: requestPhoneCode
      summary: Send a verification code to a phone (general track)
      description: |
        Provider fork is server-side — Twilio SMS by default
        (`PHONE_CODE_PRIMARY_PROVIDER`), Telegram Gateway as an optional
        secondary rail; `channel: "sms"` always forces Twilio. The client
        only reads `deliveredVia` for the status line. 404 while
        `PHONE_AUTH_ENABLED` is off.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: E.164 (lenient — spaces/dashes tolerated, `+` optional)
                channel:
                  type: string
                  enum: [sms]
                  description: Force the SMS rail, skipping Telegram Gateway
      responses:
        "200":
          description: Code sent
          content:
            application/json:
              schema:
                type: object
                required: [ok, deliveredVia, expiresAt, resendAvailableAt]
                properties:
                  ok: { type: boolean, const: true }
                  deliveredVia:
                    type: string
                    enum: [telegram, sms]
                  expiresAt: { type: string, format: date-time }
                  resendAvailableAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Phone rail disabled (`PHONE_AUTH_ENABLED` off)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Cooldown (carries `resendAvailableAt`), daily cap, or rate limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: No delivery rail available
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/phone/verify:
    post:
      tags: [auth]
      operationId: verifyPhoneCode
      summary: Verify the phone code and mint tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code:
                  type: string
                  pattern: "^\\d{4,8}$"
      responses:
        "200":
          description: Tokens + serialized user (created on first verify)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400":
          description: Invalid payload, expired, exhausted, or no pending code
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: Code mismatch
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Phone rail disabled (`PHONE_AUTH_ENABLED` off)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: Verification provider unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/telegram:
    post:
      tags: [auth]
      operationId: loginWithTelegram
      summary: Exchange a Telegram OIDC ID token for our session
      security: []
      description: |
        "Continue with Telegram". The client runs Telegram's official iOS Login
        SDK, which hands control to the installed Telegram app and returns a
        signed OpenID Connect ID token; this endpoint verifies that token
        against Telegram's published keys (RS256, issuer
        `https://oauth.telegram.org`, audience = our bot's Client ID) and mints
        our own access/refresh pair.

        No client secret is involved anywhere: we verify an already-issued ID
        token and never exchange an authorization code.

        Account resolution is what makes the bot and the app one product. The
        token's subject IS `User.telegramId`, so someone who has been talking to
        the bot lands in their existing profile. Failing that, a **verified**
        `phone_number` claim matches the same human's app account (`User.phone`
        is the cross-rail login key). Otherwise a new account is created.

        The number is trusted only when `phone_number_verified` is true, and it
        satisfies the general track's contact gate — a Telegram login therefore
        costs no SMS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idToken]
              properties:
                idToken:
                  type: string
                  description: The ID token returned by the Telegram Login SDK.
      responses:
        "200":
          description: Tokens + serialized user (created on first login)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokens" }
        "400":
          description: Missing `idToken`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            Signature, issuer, audience, expiry or subject is not acceptable.
            Terminal — retrying the same token cannot help.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `code: "account_conflict"` — the verified number belongs to one
            account and this Telegram identity to another. Both are real; the
            merge is a support decision, so the client points the user at
            @gennetysupport rather than choosing for them.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string }
                  code: { type: string, enum: [account_conflict] }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: |
            Telegram's key set could not be reached. **Retryable** — this is our
            outage, not a bad login, and the client must say so.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Telegram login not configured (`TELEGRAM_LOGIN_CLIENT_ID` empty)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshTokens
      summary: Rotate the refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        "200":
          description: Fresh token pair (no user payload)
          content:
            application/json:
              schema:
                type: object
                required: [accessToken, refreshToken, expiresIn]
                properties:
                  accessToken: { type: string }
                  refreshToken: { type: string }
                  expiresIn: { type: integer, description: Access TTL in seconds }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid or expired refresh token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign this device out
      description: |
        Stops every push this account sends to devices — the push token and
        all Live Activity tokens are cleared — and revokes the refresh session
        named by `refreshToken`. Without `refreshToken`, every refresh session
        of the account is revoked. The bearer access token stays valid until
        its short TTL runs out; it can no longer be renewed.

        Call it before discarding tokens locally. Signing out only on the
        device used to leave the server pushing the account's notifications
        to a phone the next account then signed in on. A token that is not
        the caller's own is ignored, and repeating the call still answers
        `ok`. Presenting a signed-out refresh token to `/v1/auth/refresh`
        afterwards is treated as token reuse (every session is revoked).
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: The refresh token this device holds.
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me:
    get:
      tags: [me]
      operationId: getMe
      summary: Current user + profile
      responses:
        "200":
          description: User with optional profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [me]
      operationId: patchMe
      summary: Edit the mutable profile slice
      description: |
        Editable: `major` (user); `hobbies`, `partnerPreferences`,
        `psychologicalSummary`, `ageRangeMin`, `ageRangeMax` (profile, nested
        under `profile`). Fixed identity fields are silently ignored.

        **Clearing a text field: send an empty string, not `null`.** The patch is
        built on key presence, and a generated Swift client cannot express
        `null` — a nullable collapses to `Optional` and the synthesised encoder
        uses `encodeIfPresent`, so `nil` removes the KEY rather than sending
        `null`. An emptied field therefore looked to the server like "not
        mentioned" and the old text survived a cheerful 200. `""` (or any
        whitespace-only string) is the sentinel for "clear this", and the server
        stores `null`. `null` itself still works for callers that can send it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                major: { type: [string, "null"], maxLength: 120 }
                profile:
                  type: object
                  properties:
                    hobbies:
                      type: [array, "null"]
                      maxItems: 10
                      items: { type: string, maxLength: 50 }
                    partnerPreferences: { type: [string, "null"] }
                    psychologicalSummary: { type: [string, "null"] }
                    ageRangeMin: { type: [integer, "null"] }
                    ageRangeMax: { type: [integer, "null"] }
      responses:
        "200":
          description: Updated user + profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [me]
      operationId: deleteAccount
      summary: GDPR account deletion (storage erasure + relational cascade)
      description: |
        Payment records and the safety history filed against the account are
        kept (payment rows with a null owner; moderation state as keyed
        hashes) — see the privacy policy. While a refund connected to the
        account is still being processed, deletion is refused with 409
        `refund-in-progress` and nothing is erased; the same request succeeds
        once the refund has gone through.
      responses:
        "204": { description: Account deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            `error: "refund-in-progress"` — a refund on this account is still
            in flight. Nothing was deleted; retry later. `message` carries an
            English explanation for logs, not for display.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Storage cleanup unavailable — account preserved, retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/status:
    patch:
      tags: [me]
      operationId: setMatchmakingStatus
      summary: Pause/resume matching (the "Сегодня" gesture)
      description: |
        Allowed transitions: active→paused, paused→active, frozen→active
        (silent reactivation on app return). Same-state requests are
        idempotent. onboarding/suspended/banned/pending_investigation → 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [active, paused]
      responses:
        "200":
          description: Updated user + profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Transition not allowed from the current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/freeze:
    post:
      tags: [me]
      operationId: freezeAccount
      summary: Soft-delete alternative — leave the pool, keep everything
      description: |
        Telegram Settings parity: cancels in-flight matches (partner is
        notified/compensated), keeps profile/verification/embedding intact,
        flips to `frozen`. Reactivate via PATCH /v1/me/status {active}.
        Idempotent when already frozen.
      responses:
        "200":
          description: Updated user + profile (status frozen)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Freeze not allowed from the current status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/home-location:
    post:
      tags: [me]
      operationId: setHomeLocation
      summary: Persist the canonical dating city (matching eligibility gate)
      description: |
        The city must be one of `AppConfig.supportedCities` — anything else is
        rejected with `city-not-supported` (400), including a `waitlist` entry
        from `AppConfig.cityCatalog`. The resolved market's own name and
        coordinates are stored: the request only selects WHICH market. Also the
        endpoint an existing account uses to move to a launched city.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [homeCity, homeCountryCode, latitude, longitude]
              properties:
                homeCity: { type: string, maxLength: 120 }
                homeCountryCode:
                  type: string
                  pattern: "^[A-Za-z]{2,8}$"
                homeCityKey:
                  type: string
                  maxLength: 160
                  description: Optional — server derives `cc:city-slug` when absent
                homePlaceId: { type: [string, "null"], maxLength: 256 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                longitude: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Updated user + profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400":
          description: Invalid payload, or `city-not-supported` for an unlaunched city
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/referral:
    get:
      tags: [me]
      operationId: getReferral
      summary: Referral state — tickets earned, reward slots left, invite link
      description: >-
        Feature-flagged (`REFERRAL_FEATURE_ENABLED`; 404 when off). The program
        pays in Date Tickets only — never Premium, and no money values (decision
        2026-09-22): each invited friend who clears verification earns the
        referrer `ticketsPerFriend` tickets (for at most `rewardCap` friends)
        and the friend `inviteeTickets` tickets. Reading this also releases
        rewards the daily velocity cap was holding, once it allows.
      responses:
        "200":
          description: Tickets earned / pending, reward slots, invite link
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReferralState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "Referral feature disabled, or user not found" }

  /v1/me/referral/claim:
    post:
      tags: [me]
      operationId: claimReferral
      summary: Attribute this user to a referrer by code (first-touch, guarded)
      description: >-
        First-touch only — never overwrites an existing attribution. Rejects a
        self-referral and an unknown code. Both rewards (tickets for the
        referrer and for this user) are paid later, when THIS user clears
        verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: The referrer's invite code (their user id)
      responses:
        "200":
          description: Attribution applied
          content:
            application/json:
              schema:
                type: object
                required: [applied]
                properties:
                  applied: { type: boolean, enum: [true] }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Referral feature disabled }
        "409":
          description: Not applied (self-referral, unknown code, or already attributed)
          content:
            application/json:
              schema:
                type: object
                required: [applied]
                properties:
                  applied: { type: boolean, enum: [false] }
                  reason: { type: string }

  /v1/me/promo/claim-deferred:
    post:
      tags: [me]
      operationId: claimPromoDeferred
      summary: Attribute this new user to a promo code (iOS deferred deep link)
      description: >-
        Feature-flagged (`PROMO_FEATURE_ENABLED`; 404 when off). First-launch
        resolves the effective promo code from a coarse device-fingerprint
        match against a recent promo landing-page touch, or — only while the
        `PROMO_MANUAL_ENTRY_ENABLED` seam is on — from a typed `code` (optional
        `GENNETY:` prefix), then first-touch attributes this user (never
        overwrites an existing attribution). The welcome gift itself is granted
        later at the wow screen via `/v1/me/promo/claim`. New accounts only:
        created within the last 24 hours and not yet through onboarding,
        otherwise 409 `promo-not-eligible`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: >-
                    Typed promo code (with or without the `GENNETY:` prefix).
                    Ignored unless `PROMO_MANUAL_ENTRY_ENABLED`; omit to rely on
                    fingerprint matching.
      responses:
        "200":
          description: Attribution result (attributed=false when no code resolved)
          content:
            application/json:
              schema:
                type: object
                required: [attributed]
                properties:
                  attributed: { type: boolean }
                  reason: { type: string }
                  code: { type: [string, "null"] }
                  tickets: { type: integer }
                  months: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Promo feature disabled }
        "409":
          description: >-
            Not a new account (older than 24 hours or past onboarding) — promo
            codes are for new users only. Body `{ error: "promo-not-eligible",
            attributed: false, reason: "not-eligible" }`.

  /v1/me/promo/claim:
    post:
      tags: [me]
      operationId: claimPromo
      summary: Grant the promo welcome gift (Date Ticket + Premium months)
      description: >-
        Feature-flagged (`PROMO_FEATURE_ENABLED`; 404 when off). Idempotent —
        grants the promo-attributed user their one-time Date Ticket + Premium
        months at the native wow screen. Twin of the Telegram
        `/v1/telegram-onboarding/promo-gift`. Applied=false when there is nothing
        to grant (not a promo user, code no longer redeemable, or already
        redeemed).
      responses:
        "200":
          description: Grant result
          content:
            application/json:
              schema:
                type: object
                required: [applied]
                properties:
                  applied: { type: boolean }
                  code: { type: [string, "null"] }
                  tickets: { type: integer }
                  months: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Promo feature disabled }

  /v1/me/preferences:
    patch:
      tags: [me]
      operationId: patchPreferences
      summary: Update match radius preference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchRadius]
              properties:
                matchRadius: { $ref: "#/components/schemas/MatchRadius" }
      responses:
        "200":
          description: Updated user + profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/theme:
    patch:
      tags: [me]
      operationId: patchTheme
      summary: Set the colour theme (Settings picker)
      description: |
        Takes both halves of the answer: `mode` is what the person picked and
        `theme` is the colour it resolves to right now. They are equal for an
        explicit pick and differ only under `system`, where the phone decides
        and the client re-sends `theme` whenever the appearance flips.

        Both are stored because they answer different questions: `mode` decides
        which radio the app checks, `theme` decides what the Telegram PNG cards
        are painted in. Sending `mode` alone would leave an app that follows a
        light phone receiving dark cards — the split this route closes.

        Stamps `themeChosenAt`, so the Mini App onboarding does not ask again
        someone who has already answered on iOS.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode, theme]
              properties:
                mode: { $ref: "#/components/schemas/ThemeMode" }
                theme: { $ref: "#/components/schemas/Theme" }
      responses:
        "200":
          description: Updated user + profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/language:
    patch:
      tags: [me]
      operationId: patchLanguage
      summary: Set the account language (Settings picker)
      description: |
        Closes release-plan defect S6. The app has had a language picker since
        2026-09-04 and applies it instantly and locally, but until this route
        the choice went nowhere: `User.language` was written once, during
        onboarding. Anyone who switched kept receiving pushes, interview
        questions and rendered Telegram cards in the language they registered
        in — the interface said one thing and everything arriving from outside
        said another.

        Only the codes in `Language` are accepted; near-misses such as `ru-RU`
        or `EN` are refused rather than normalised, because a value no renderer
        recognises would break all three surfaces at once.

        Writing this also clears the account's cached date/match card PNGs, so
        the next card is rendered in the new language instead of being served
        from a cache painted in the old one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language: { $ref: "#/components/schemas/Language" }
      responses:
        "200":
          description: Updated user + profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/push-token:
    post:
      tags: [me]
      operationId: registerPushToken
      summary: Register the device push token
      description: |
        One token per user row; silent overwrite on re-registration.
        The native iOS client sends `platform: "apns"` (delivery is direct
        APNs; the legacy default remains `expo` for wire-compat only).

        A token names a device, so registering it takes it away from any
        other account still holding it: the account previously signed in on
        this phone stops receiving pushes here. `POST /v1/auth/logout`
        releases it explicitly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
                platform:
                  type: string
                  maxLength: 16
                  default: expo
                  examples: [apns]
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/rhythm:
    get:
      tags: [me]
      operationId: getOwnRhythm
      summary: The owner's own life rhythm (Tempo Sync) for the "Твой темп" card
      description: |
        Tempo Sync (decision journal 2026-09-24, variant B). Returns the two
        coarse tags the iOS client last derived from Apple Health, with the
        coverage and dates — or `profile: null` when there is none, or it has
        not been refreshed for 35 days (treated as absent everywhere).

        The whole path answers 404 while `features.tempoSync` is false.
      responses:
        "200":
          description: The owner's profile, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    description: Null (or absent) when there is no fresh profile.
                    $ref: "#/components/schemas/OwnRhythm"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    put:
      tags: [me]
      operationId: putOwnRhythm
      summary: Replace the life rhythm with a fresh on-device reduction
      description: |
        The body is the ENTIRE contract between the phone and the server:
        two tags and how many days of step data they rest on. Everything is
        computed on the device from 28 days of Apple Health steps; no raw
        number ever leaves it. Strict — an unknown field, a string where a
        number belongs, coverage under 10 days or an unknown consent version is
        a 400, never silently dropped.

        Send only when the device found at least 10 days with data. Below that
        send nothing: the person stays on the base algorithm, exactly like
        someone who declined Health access (iOS does not say which it was).

        The first successful PUT under a consent version records the consent
        time; re-syncs keep it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RhythmUpload" }
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [ok, profile]
                properties:
                  ok: { type: boolean, const: true }
                  profile: { $ref: "#/components/schemas/OwnRhythm" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
    delete:
      tags: [me]
      operationId: deleteOwnRhythm
      summary: Forget the life rhythm now ("Отключить")
      description: >-
        Idempotent: 204 whether or not a profile existed. The client should also
        stop syncing; revoking Health access itself happens in iOS Settings.
      responses:
        "204": { description: Forgotten }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/me/live-activity-token:
    post:
      tags: [me]
      operationId: registerLiveActivityToken
      summary: Register an ActivityKit push token (start or update)
      description: |
        One registration per (user, activityType, kind) — re-registration
        upserts in place. The same token held by another account is
        removed from it first (the token names this install). The server uses `update` tokens to drive the
        "match decision", "date day" and "venue change" Live Activities via APNs.

        `venue_change` (2026-09-22): register the push-to-start token of the
        `VenueChangeActivity` attributes type as `kind: start` (no matchId), and
        each started card's update token as `kind: update` WITH its `matchId`.
        The server pushes an update only into a token registered for that match
        after the card was push-started, so re-register whenever ActivityKit
        hands out a new update token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [activityType, kind, token]
              properties:
                activityType:
                  type: string
                  enum: [match_decision, date_day, venue_change]
                kind:
                  type: string
                  enum: [start, update]
                token: { type: string, maxLength: 200 }
                matchId: { type: string }
      responses:
        "200":
          description: Registered
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/live-activity-token/{activityType}/{kind}:
    delete:
      tags: [me]
      operationId: deleteLiveActivityToken
      summary: Drop a registration when the activity ends locally
      parameters:
        - name: activityType
          in: path
          required: true
          schema:
            type: string
            enum: [match_decision, date_day, venue_change]
        - name: kind
          in: path
          required: true
          schema:
            type: string
            enum: [start, update]
      responses:
        "204": { description: Deleted (idempotent) }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/blocks:
    get:
      tags: [me]
      operationId: listBlockedUsers
      summary: People this user has blocked
      description: |
        Newest first. Shows only who the caller blocked — the reverse direction
        is not readable by anybody. A first name and a date is everything
        returned: enough to recognise a mistake and undo it, no more.
      responses:
        "200":
          description: Blocked list
          content:
            application/json:
              schema:
                type: object
                required: [blocks]
                properties:
                  blocks:
                    type: array
                    items:
                      type: object
                      required: [userId, firstName, blockedAt]
                      properties:
                        userId: { type: string, format: uuid }
                        firstName: { type: [string, "null"] }
                        blockedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/blocks/{userId}:
    delete:
      tags: [me]
      operationId: unblockUser
      summary: Lift a block
      description: |
        Removes the record only. The cancelled date is not restored and the two
        are still kept apart by the lifetime pair ban — this exists for a block
        filed by mistake.
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Block lifted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such block
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/tickets/history:
    get:
      tags: [me]
      operationId: getTicketHistory
      summary: Wallet movements, newest first
      description: |
        The account behind the balance: every credit and every spend, in the
        order they happened. The wallet is shared with the Telegram bot, so a
        ticket can arrive or leave while the app was never open — this route is
        the only way the native tab can explain the number it shows.

        **No money is returned, by design.** The ledger stores what Apple
        charged in the buyer's storefront currency with no currency beside it,
        so a euro purchase is indistinguishable from a dollar one; printing a
        symbol in front of it would be a guess. The only place this product
        shows a price is StoreKit's own `displayPrice`. Telegram Stars are left
        out from the other side: they cannot be spent or bought on this screen.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: before
          in: query
          description: |
            Ledger row id to page from, exclusive. A row id and not a
            timestamp: `createdAt` ties are real (settling both slots of a gate
            writes two rows in one transaction), and a timestamp cursor would
            either skip a row or repeat one.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: One page of movements
          content:
            application/json:
              schema:
                type: object
                required: [entries, hasMore]
                properties:
                  entries:
                    type: array
                    items: { $ref: "#/components/schemas/TicketHistoryEntry" }
                  hasMore:
                    type: boolean
                    description: Older movements exist after this page
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Ticket feature disabled, or unknown `before` cursor
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/verification:
    get:
      tags: [me]
      operationId: getVerificationStatus
      summary: Read-only verification status
      responses:
        "200":
          description: Current status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { $ref: "#/components/schemas/VerificationStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/verification/consent:
    post:
      tags: [me]
      operationId: recordBiometricConsent
      summary: Record explicit consent to biometric processing
      description: |
        GDPR Art. 9(2)(a) requires an **explicit** act of consent for biometric
        processing specifically — the general Terms tick at sign-up is not one,
        and neither is tapping a button labelled "Verify".

        Call this when the user confirms on a dedicated consent screen that
        states what is captured, who processes it (AWS, in the EU), how long the
        reference still is kept (90 days), and what declining means (they are
        not matched). `native-init` answers `409` until this has succeeded.

        Idempotent: the first consent's timestamp is preserved on repeat calls,
        and only the recorded document version is refreshed.
      responses:
        "200":
          description: Consent recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503":
          description: Consent could not be recorded — do NOT start the check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/verification/native-init:
    get:
      tags: [me]
      operationId: getNativeVerificationConfig
      summary: Mint an AWS Face Liveness session for the native client
      description: |
        Returns the session id, region, and short-lived AWS credentials that
        `FaceLivenessDetectorView(sessionID:region:credentialsProvider:)`
        needs to stream its selfie video straight to Rekognition. The video
        never passes through our server. Flips verificationStatus to
        `pending` — with one exception, below.

        An already-verified user is refused with `409`, because re-running
        would burn a check for no decision. The exception is a verified user
        whose reference selfie the 90-day retention scrub removed: they are
        admitted, because that is the only way to satisfy the
        `409 reference_expired` a photo upload answers with. Such a user keeps
        `verified` for the whole check — matching admits `verified` only, so a
        downgrade would drop them out of the pool over a photo edit.

        **The session expires 3 minutes after this call**, taking its
        reference image with it. Present the detector immediately and report
        the result to `native-event` in the same sitting; a stale session
        cannot be resumed, only replaced by a new one.

        Credentials are clamped server-side to
        `rekognition:StartFaceLivenessSession` and last ~15 minutes. Only the
        face-match pipeline can write `verified`/`rejected`.

        Replaces the Persona Inquiry SDK config. The hosted-flow endpoint
        `GET /v1/me/verification/url` was removed with the provider.
      responses:
        "200":
          description: Liveness session + scoped credentials
          content:
            application/json:
              schema:
                type: object
                required: [sessionId, region, credentials, language]
                properties:
                  sessionId:
                    type: string
                    format: uuid
                    description: Single-use. A new check needs a new session.
                  region:
                    type: string
                    example: eu-central-1
                    description: Must match the region the detector streams to.
                  credentials: { $ref: "#/components/schemas/LivenessCredentials" }
                  language: { $ref: "#/components/schemas/Language" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Different situations, told apart by `code` — never by the
            human-readable `error` string:

            - `already_verified` — no session is minted; the client shows a
              "you're verified" state.
            - `consent_required` — the user has not yet passed through
              `POST /v1/me/verification/consent`. Show the consent screen,
              record the consent, then retry this call once.
            - `photos_required` — the profile has no photos, so a passing check
              would have nothing to be compared against. Send the user to add
              photos (at least `minPhotos`), then offer the check again.
              `message` carries the ask in the user's language. Checked before
              consent, so nobody reads the biometric disclosure for a check
              that cannot run yet.
            - `onboarding_incomplete` — a first check for an account that has
              not finished registration (onboarding, or the track contact).
              The app only offers verification after onboarding, so this is a
              server-side backstop rather than a screen to design for.

            A client that treats every `409` as "verified" leaves the user
            tapping a button that silently does nothing, which is exactly what
            happened before `code` existed.
          content:
            application/json:
              schema:
                type: object
                required: [error, code]
                properties:
                  error: { type: string }
                  code:
                    type: string
                    enum: [already_verified, consent_required, photos_required, onboarding_incomplete]
                  message:
                    type: string
                    description: |
                      `photos_required` only. The ask, localized to the user's
                      `User.language`.
                  minPhotos:
                    type: integer
                    description: "`photos_required` only. The profile photo floor (`MIN_PHOTOS`)."
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: Liveness not configured, or the provider is unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/verification/native-event:
    post:
      tags: [me]
      operationId: reportNativeVerificationEvent
      summary: Report the terminal event from the native liveness detector
      description: |
        `complete` reads AWS's verdict **inside this request** — the session
        dies 3 minutes after `native-init`, so there is no later chance — and
        starts the face-match pipeline on a pass. `cancel`/`error` are logged
        only.

        The `outcome` tells the client what to show next: `processing` means
        the check passed and face-matching is running (the terminal result
        arrives by push, or poll `GET /v1/me/verification`); `retry` means
        liveness could not be confirmed. `retry` is NOT a rejection and
        changes no verification state — mint a new session and try again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [complete, cancel, error]
                sessionId:
                  type: string
                  maxLength: 64
                  description: Required when `kind` is `complete`.
                message: { type: string, maxLength: 512 }
      responses:
        "200":
          description: Acknowledged
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  outcome:
                    type: string
                    enum: [processing, retry]
                    description: Present only when kind is `complete`.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Could not read the verdict — the check can be re-run
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/feedback/pending:
    get:
      tags: [me]
      operationId: getPendingFeedback
      summary: The date this caller still owes post-date feedback on
      description: |
        PRODUCT_SPEC §Phase 4.3. Exists because there is no other way for the
        app to learn a form is waiting: `/v1/matches/current` deliberately
        excludes `completed` (`ACTIVE_MATCH_STATUSES`), so the moment the date
        closes out the match disappears from every surface the client polls.
        In Telegram the T+24h DM carries the link and no discovery is needed;
        the app has no such carrier, which is why this endpoint is the native
        half of the feature rather than a convenience.

        Gated on `feedbackPromptedAt` — the same one-shot marker the lifecycle
        tick writes — not on `completed` alone. Asking earlier would surface
        the form minutes after the date, while one of them may still be at the
        table.

        `pending` is **null** when nothing is owed. That is the ordinary state
        of this endpoint, so it is not an error and a polling client must not
        have to treat the common case as one.
      responses:
        "200":
          description: The pending form, or null
          content:
            application/json:
              schema:
                type: object
                description: |
                  `pending` is OPTIONAL rather than a nullable union, and that
                  is load-bearing: `oneOf: [$ref, "null"]` is the shape
                  swift-openapi-generator drops in silence (see
                  `SerializedUser.gender`). The server still sends an explicit
                  `null` when nothing is owed; an optional property decodes
                  that to absent, so the wire is unchanged and the property
                  actually exists in the generated client.
                properties:
                  pending: { $ref: "#/components/schemas/PendingFeedback" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/feedback/post-date:
    post:
      tags: [me]
      operationId: submitPostDateFeedback
      summary: Submit post-date feedback (chemistry, second date, notes)
      description: |
        The JWT twin of the Mini App's `POST /v1/feedback/post-date`. Both call
        `services/post-date-feedback.ts`, so the two surfaces cannot disagree
        about what counts as an answer — which matters more here than usual,
        because this form is the only place the product learns whether a date
        worked, and two implementations would quietly build two datasets.

        The structured answers are composed into the single text blob the LLM
        analyst reads; no new columns are written for them.

        **The form is answered once per side.** A second submission is refused
        with 409 `already-submitted` and the first answer stays: it has already
        been analysed into matching, and re-running that analysis would count
        its dealbreakers twice. A story the person told the concierge, or a
        Telegram voice note, recorded before the form does NOT close it — the
        chemistry score and the second-date answer come only from here — so the
        form is accepted on top of either and the earlier text is kept.

        Unlike the Mini App twin this sends **no thank-you DM**: that surface
        can assume a bot chat exists because the request was signed by one,
        this one cannot, and a message nobody receives is not a confirmation.
        The 200 is the confirmation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, chemistry, wantsSecondDate]
              properties:
                matchId: { type: string, format: uuid }
                chemistry:
                  type: integer
                  minimum: 1
                  maximum: 10
                  description: |
                    Refused rather than clamped when out of range. A 0 or an 11
                    is a client bug, and rounding one into the dataset is worse
                    than a 400.
                wantsSecondDate:
                  type: string
                  enum: [yes, maybe, no]
                text:
                  type: string
                  maxLength: 1000
                  description: |
                    Optional. An empty comment is a legitimate answer — the
                    slider and the segment already carry signal.
                venueFit:
                  type: string
                  enum: [yes, partly, no]
                  description: |
                    Did the venue match the vibe the pair asked for. OPTIONAL
                    rather than nullable: `enum: [..., null]` makes
                    swift-openapi-generator emit a fourth case spelled `""`,
                    which serialises to a value the server rejects — a foot-gun
                    sitting in `allCases` of an enum a client will iterate to
                    build chips. Omitting the property says the same thing to
                    `normaliseFeedback`, which coerces anything unrecognised to
                    `null`. Same family as the `oneOf: [$ref, "null"]` trap; see
                    `SerializedUser.gender`.
                venueFitReasons:
                  type: array
                  maxItems: 3
                  items:
                    type: string
                    enum: [wrong_vibe, too_loud, too_expensive, route_unfair, accessibility, closed_or_unavailable]
                language:
                  type: string
                  enum: [en, ru, uk, de, pl]
                  description: |
                    Optional hint. Falls back to `User.language`, because the
                    analyst prompt is language-agnostic and a comment in one
                    language under a header in another reads to it as two
                    voices.
      responses:
        "200":
          description: Recorded. Carries whatever is still pending afterwards.
          content:
            application/json:
              schema:
                type: object
                description: |
                  `pending` is OPTIONAL rather than a nullable union, and that
                  is load-bearing: `oneOf: [$ref, "null"]` is the shape
                  swift-openapi-generator drops in silence (see
                  `SerializedUser.gender`). The server still sends an explicit
                  `null` when nothing is owed; an optional property decodes
                  that to absent, so the wire is unchanged and the property
                  actually exists in the generated client.
                properties:
                  pending: { $ref: "#/components/schemas/PendingFeedback" }
        "400":
          description: |
            `bad-chemistry`, `bad-second-date`, or `empty-text` (nothing at all
            was said, which the analyst cannot use).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: The caller is not on this match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `wrong-state` — the date has not been closed out yet. Deliberately
            not a 404: the match exists and the caller is on it, and a 404
            would send the client looking for a routing bug that is not there.

            `already-submitted` — this side has already answered the form. The
            first answer is kept; there is nothing to retry. `GET
            /v1/me/feedback/pending` reports it as `submitted: true`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/profiler:
    get:
      tags: [me]
      operationId: getProfilerBatch
      summary: The Profiler question to show now (opens a due batch)
      description: |
        PRODUCT_SPEC §Phase 1b. The Profiler asks short questions after
        onboarding whose answers fuel the pre-date icebreakers and wingman
        hints — never matching. Telegram PUSHES each batch from the worker;
        the app PULLS it here. Same bank, same rows, same skip/return rules:
        `services/profiler-native.ts` shares every non-delivery step with the
        Telegram path.

        What this returns, in order:
        - `{}` when the caller is not eligible (not `active`, onboarding not
          `completed`, or no gender).
        - **The live question, if there is one — whichever surface opened it.**
          This is the resume: close the app mid-batch and the same question is
          waiting next time. For an app-only account nothing ever expires it
          (the worker does not serve `platform = mobile`); for a `both`
          account the worker's 6 h stall sweep still records an unanswered
          question as an implicit skip, exactly as in Telegram.
        - Otherwise, when a batch is due — the next window has passed (after
          onboarding: the ~10 min entry delay), or the Profiler was never
          armed at all, in which case the caller is asked straight away —
          and the caller is not mid
          date-negotiation (`proposed` / `negotiating` / `negotiating_venue`),
          a batch is opened atomically and its first question returned. Batch
          size is 3, or 2 in rush mode (a drop is imminent). Local quiet hours
          do NOT apply here: they exist so a push never lands at 3 am, and a
          person who opened the app is already looking at it.
        - `{}` otherwise. That is the ordinary state, not an error.

        The text is in `User.language` (English fallback). Poll it when the
        Today screen appears; it is cheap and writes nothing when nothing is
        due.
      responses:
        "200":
          description: The current question, or `{}` when nothing is pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilerBatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/profiler/answer:
    post:
      tags: [me]
      operationId: answerProfilerQuestion
      summary: Answer, skip, or refuse the live Profiler question
      description: |
        Resolves the caller's live question with the same compare-and-set the
        Telegram chat uses, so exactly one reply — from either surface — ever
        counts.

        - `skip: true` is the Skip button: the question returns once later in
          this cycle, then steps aside until the next one. Any `text` sent with
          it is ignored.
        - A text that is a refusal ("later", "не хочу", "skip"…, matched on the
          whole utterance) is recorded as a skip, NOT as an answer, and pauses
          the rest of the batch to the caller's next local window →
          `outcome: paused`.
        - Anything else is stored as the answer (trimmed, capped at 1000
          characters), exactly as a Telegram answer is. Text only — the humour
          question's meme reading is a Telegram-only extra.

        Then the batch advances: `next` carries the following question;
        `done` means the batch is over (or nothing is left this cycle, or a
        date negotiation started meanwhile) and the next one opens at the
        caller's next local morning/evening window. Nothing is sent to
        Telegram; answering does not trigger anything new.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilerAnswerRequest" }
      responses:
        "200":
          description: Recorded; what the batch does next
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilerAnswerResult" }
        "400":
          description: |
            `missing_question_id`, or `empty_answer` — neither a non-empty
            `text` nor `skip: true`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            `question_not_active` — `questionId` is not the caller's live
            question: already answered in Telegram, reclaimed by the stall
            sweep, or a double tap. Nothing was recorded; re-read
            `GET /v1/me/profiler`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/music:
    get:
      tags: [music]
      operationId: getMyMusic
      summary: The caller's pinned tracks, in display order
      description: |
        Up to three Spotify tracks (decision 2026-09-11). 404 while
        `PROFILE_MUSIC_ENABLED` is off — which is also how a client learns to
        hide the section. Display-only: the tracks never feed matching or any
        AI (Spotify Developer Policy).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTracksResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Feature disabled }
    put:
      tags: [music]
      operationId: setMyMusic
      summary: Replace the pinned tracks
      description: |
        Spotify track ids only, in display order; `[]` clears the set. The
        server resolves every id to Spotify's own metadata before saving — a
        client cannot put a title or a cover of its choosing on a profile —
        and saves nothing unless every id resolves.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackIds]
              properties:
                trackIds:
                  type: array
                  maxItems: 3
                  uniqueItems: true
                  items: { type: string, pattern: "^[0-9A-Za-z]{22}$" }
      responses:
        "200":
          description: Saved — the set as it now stands
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTracksResponse" }
        "400":
          description: "`invalid_track_ids`, `too_many_tracks` or `duplicate_tracks`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Feature disabled }
        "422":
          description: "`track_not_found` — Spotify does not serve one of the ids; nothing was saved"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: "`upstream_unavailable` — Spotify did not answer; nothing was saved"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: |
            `rate_limited` (Spotify's app-wide quota — deliberately not our 429,
            which would read as "you, slow down") or `not_configured`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/music/search:
    get:
      tags: [music]
      operationId: searchMusic
      summary: Search Spotify's catalogue for tracks
      description: |
        Runs server-side on the app's Client Credentials token — no Spotify
        login. At most 10 results (Spotify's development-mode cap). 404 while
        `PROFILE_MUSIC_ENABLED` is off.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
      responses:
        "200":
          description: Matching tracks, in Spotify's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTracksResponse" }
        "400":
          description: "`bad_query` — under 2 or over 100 characters after trimming"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Feature disabled }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`upstream_unavailable` — Spotify did not answer"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: "`rate_limited` (Spotify's app-wide quota) or `not_configured`"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/integrations/spotify/authorize:
    post:
      tags: [music]
      operationId: startSpotifyImport
      summary: Begin the one-time Spotify top-tracks import
      description: |
        Returns Spotify's authorize URL (scope `user-top-read` only, PKCE).
        Open it in `ASWebAuthenticationSession` with the callback scheme
        `gennety`. Spotify sends the browser to our callback, which exchanges
        the code, reads the top tracks once, keeps no Spotify token, and ends
        in `gennety://spotify-import?status=<status>`:

        - `ok` — fetch `GET /v1/integrations/spotify/top-tracks`
        - `cancelled` — the person pressed Cancel on Spotify's page
        - `empty` — no listening history yet
        - `not_allowed` — the account is not on the development-mode
          allow-list (Spotify's 403); offer search
        - `expired` — the attempt went stale or was replayed; start again
        - `failed` — anything else

        404 unless both `PROFILE_MUSIC_ENABLED` and `SPOTIFY_TOP_TRACKS_ENABLED`
        are on (`AppConfig.features.spotifyTopTracks`).
      responses:
        "200":
          description: Spotify's authorize URL
          content:
            application/json:
              schema:
                type: object
                required: [authorizeUrl]
                properties:
                  authorizeUrl: { type: string, format: uri }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Feature disabled }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`not_configured` — Spotify credentials or redirect URI missing"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/integrations/spotify/top-tracks:
    get:
      tags: [music]
      operationId: getSpotifyTopTracks
      summary: The candidates from a just-finished import
      description: |
        Up to 15 of the caller's Spotify top tracks (about the last six
        months), held for 15 minutes after the import and dropped as soon as
        the caller saves with `PUT /v1/me/music`.
      responses:
        "200":
          description: Candidates, Spotify's order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MusicTracksResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: "`no_import` — nothing fresh to show (or the feature is off)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/voice-prompt:
    get:
      tags: [me]
      operationId: getMyVoicePrompt
      summary: The caller's own voice prompt, if they recorded one
      description: |
        404 while `VOICE_PROMPT_ENABLED` is off — which is also how a client
        learns to hide the step, rather than shipping a screen that saves
        nothing.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  voicePrompt:
                    $ref: "#/components/schemas/MyVoicePrompt"
        "404": { description: Feature disabled }
    post:
      tags: [me]
      operationId: setMyVoicePrompt
      summary: Commit a recording as the caller's voice prompt
      description: |
        Replaces whatever was there — there is no history and nothing to
        reconcile. Validation is safety-only (no identity gate, no voice
        printing): the clip is transcribed, the transcript is moderated, and
        it is refused if it hands out a way to contact the speaker off-platform.

        `durationSec` is only a first filter. The duration stored and returned
        is the one transcription measured (falling back to the sent value,
        clamped into range, when no measurement comes back), and the length
        bounds are enforced on that — a clip may be refused `voice_too_long`
        whatever it claimed. Rate limit: `VOICE_PROMPT_UPLOADS_PER_HOUR` (10)
        commits per user per hour.

        Two transports, one pipeline. **Preferred:** PUT the file to the
        `uploadUrl` from `/upload-url`, then commit `{uploadPath, durationSec}`
        naming the `uploadPath` that came with it. **Fallback** (when
        `/upload-url` answered `uploadUrl: null`): commit `{audio, durationSec,
        mimeType}` with the bytes in base64. Exactly one of `uploadPath` /
        `audio` is expected; `uploadPath` wins when both are sent.

        A refused signed upload is removed from storage, except on
        `processing_unavailable`, where the same `uploadPath` may be committed
        again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [durationSec]
              properties:
                uploadPath:
                  type: string
                  description: The `uploadPath` a `/upload-url` answer carried, after the PUT succeeded.
                audio:
                  type: string
                  description: base64 audio bytes, at most `VOICE_PROMPT_MAX_FILE_SIZE_BYTES` (fallback transport)
                durationSec: { type: integer, minimum: 1 }
                mimeType:
                  type: string
                  description: Fallback transport only; a signed upload's type follows its key.
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  voicePrompt:
                    $ref: "#/components/schemas/MyVoicePrompt"
        "400": { description: "Malformed request, or an upload over `maxBytes` (`voice_too_long`)" }
        "403":
          description: "`upload-not-owned` — `uploadPath` is not a key minted for the caller"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            `upload-missing` — nothing is stored under `uploadPath` (the PUT
            failed or never ran). Retry the PUT with the recording the client
            still holds; nothing about the clip was judged.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: |
            The request is well-formed and the CONTENT is refused. `error`
            carries the reason (`voice_too_short`, `voice_too_long`,
            `unsafe_content`, `audio_contact_info`, `processing_unavailable`)
            and `retryable` says whether re-recording is the fix or whether the
            same clip is worth sending again.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  retryable: { type: boolean }
        "404": { description: Feature disabled }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: Storage unavailable }
    delete:
      tags: [me]
      operationId: deleteMyVoicePrompt
      summary: Remove the voice prompt
      description: |
        Also re-embeds: a deleted recording must stop influencing matching, or
        it becomes a ghost the user cannot see or clear.
      responses:
        "200": { description: Removed }
        "404": { description: Feature disabled }

  /v1/me/voice-prompt/upload-url:
    post:
      tags: [me]
      operationId: getVoicePromptUploadUrl
      summary: A signed upload for a voice prompt, plus its bounds
      description: |
        `uploadUrl` is a one-shot Supabase signed PUT (valid ~2 h): send the
        raw file as the body with `Content-Type` set to the `contentType`
        requested here, then commit `uploadPath` to `POST /v1/me/voice-prompt`.
        The bytes never pass through the API server.

        Both are null when storage cannot sign right now; the client then
        commits the bytes as base64 instead. The bounds are the recorder's
        own: stop at `maxDurationSec` (30), refuse to submit under
        `minDurationSec` (3). Rate limit: three mints per allowed commit per
        user per hour.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contentType]
              properties:
                contentType:
                  type: string
                  description: "`audio/mp4` for the native AAC-LC `.m4a` recording"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [maxBytes, minDurationSec, maxDurationSec]
                properties:
                  uploadUrl:
                    type: [string, "null"]
                    description: Signed PUT URL; null means commit the bytes as base64.
                  uploadPath:
                    type: [string, "null"]
                    description: The key to name in the commit; null exactly when `uploadUrl` is.
                  maxBytes: { type: integer }
                  minDurationSec: { type: integer }
                  maxDurationSec: { type: integer }
        "400": { description: Not an audio content type }
        "404": { description: Feature disabled }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/me/photos:
    get:
      tags: [me]
      operationId: listPhotos
      summary: Ordered profile photo paths + signed render URLs (10-min TTL)
      responses:
        "200":
          description: Photo list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotosResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [me]
      operationId: uploadPhoto
      summary: Upload one profile photo (multipart field `photo`, ≤8 MB; profile max 10)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "201":
          description: Accepted and committed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoUploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: |
            Photo limit reached, duplicate, or `code: "reference_expired"`.

            `reference_expired` is not a verdict on this photo: the 90-day
            retention scrub removed the verification selfie the server matches
            faces against, and AWS cannot re-issue it. Retrying the upload
            achieves nothing — send the user through `native-init` +
            `native-event` once more, then re-upload the SAME bytes rather
            than asking them to pick the photo again. Note the new reference
            is stored when the face-match pipeline finishes, not when
            `native-event` answers `processing`, so allow a short bounded
            retry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: File too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Validation rejection (no face, obscured, identity mismatch, unsafe)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRejection" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: Storage/vision unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Validation temporarily unavailable — retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/photos/{index}:
    delete:
      tags: [me]
      operationId: deletePhoto
      summary: Remove a photo by array index
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Remaining photos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotosResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Active users cannot drop below the minimum photo count
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/me/video:
    post:
      tags: [me]
      operationId: uploadProfileVideo
      summary: Upload the profile video (replaces any previous one)
      description: |
        Multipart with two parts, in this order: `video` (ISO-BMFF `.mp4`,
        H.264 or HEVC, 3–60 s, ≤ 50 MB) and `thumb` (the client-made
        first-frame poster, JPEG/PNG ≤ 5 MB).

        Checked server-side exactly like a video sent to the bot: every
        sampled frame and the audio transcript are moderated; there is no
        face or identity gate (the video is display-only). The `thumb`
        poster is shown to partners before playback, so it passes the same
        content-safety check as a profile photo, first: an unsafe poster
        refuses the whole upload with `unsafe_content`, and a moderation
        outage with a retryable `processing_unavailable`. Duration is
        measured here, not trusted from the client. Errors use the
        `{ error, code, retryable }` body — switch on `code`.

        The one-time `video_bonus` ticket is granted on the first accepted
        video (`bonusGranted`). Returns 404 before auth while the server's
        kill switch is off (see `PhotosResponse.videoEnabled`).
        Rate limit: 6 uploads per hour.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [video, thumb]
              properties:
                video: { type: string, format: binary }
                thumb: { type: string, format: binary }
      responses:
        "201":
          description: Accepted, stored and attached to the profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileVideoUploadResponse" }
        "400":
          description: "`invalid_media` — a part is missing, or not a video / not an image"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRejection" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No profile yet, or the feature is switched off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: "`video_too_large` (> 50 MB) or `video_too_long` (> 60 s)"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRejection" }
        "422":
          description: "`unsafe_content`, `video_too_short` (< 3 s), or another validation refusal"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRejection" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`storage_unavailable` — retry"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRejection" }
        "503":
          description: "`processing_unavailable` — validation temporarily unavailable, retry"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoRejection" }
    delete:
      tags: [me]
      operationId: deleteProfileVideo
      summary: Remove the profile video (idempotent)
      description: |
        Removes the video whichever surface recorded it; the profile falls
        back to photos only. Not an error when there is no video. The
        one-time ticket bonus is not reversed.
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed:
                    type: boolean
                    description: False when there was no video to remove
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The feature is switched off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/onboarding/consent:
    post:
      tags: [onboarding]
      operationId: recordConsent
      summary: Record ToS acceptance (+ optional research opt-in)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [termsAccepted]
              properties:
                termsAccepted: { type: boolean, const: true }
                researchOptIn: { type: boolean, default: false }
                language:
                  $ref: "#/components/schemas/Language"
                  description: >
                    From the system locale (no picker). Advances onboarding to
                    the conversational interview once terms + language + a
                    verified contact rail are all set.
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { $ref: "#/components/schemas/SerializedUser" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/onboarding/interview:
    get:
      tags: [onboarding]
      operationId: getInterviewState
      summary: Resume the server-owned conversational onboarding
      responses:
        "200":
          description: Current interview state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewState" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/onboarding/interview/answer:
    post:
      tags: [onboarding]
      operationId: answerInterview
      summary: Send a text answer to the onboarding collector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  maxLength: 32000
                  description: >-
                    Ordinary interview answers are limited to 4,000 characters.
                    When the server-owned current question is `context_dump`, the
                    complete AI-memory JSON response may use up to 32,000.
      responses:
        "200":
          description: Next interview state (with the agent's reply as `question`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Terms not accepted or language not selected yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/onboarding/interview/voice:
    post:
      tags: [onboarding]
      operationId: answerInterviewVoice
      summary: Send a voice answer (multipart field `file`, transcribed server-side)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Next interview state; `acknowledgement` carries the transcript
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Terms not accepted or language not selected yet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Transcription failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/onboarding/interview/voice-prompt:
    post:
      tags: [onboarding]
      operationId: finishInterviewVoicePrompt
      summary: Leave the voice-prompt step (`uiHint.control = voice_record`), kept or skipped
      description: |
        Call after the recording is committed (`POST /v1/me/voice-prompt`), or
        instead of recording when the user taps Skip. The server decides which
        exit it was from whether a recording is saved — the client does not say
        — marks the step, and resumes the collector, which normally finalizes
        onboarding. The response is the next interview state, exactly like an
        answer's.

        Without this call a native account stays on the voice question: the
        commit route does not advance onboarding by itself.

        Idempotent: when the collector is no longer on the voice question it
        changes nothing and returns the current state. 404 while
        `VOICE_PROMPT_ENABLED` is off (the step is then never asked).
      responses:
        "200":
          description: Next interview state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InterviewState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: Feature disabled }
        "409":
          description: Onboarding already complete, terms not accepted or language not selected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/chat/upload:
    post:
      tags: [chat]
      operationId: uploadChatImage
      summary: Upload a chat image (multipart field `image`, ≤8 MB)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Opaque storage path + signed render URL (5-min TTL)
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl, signedUrl]
                properties:
                  imageUrl: { type: string }
                  signedUrl: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: File too large
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: Storage unavailable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/chat/message:
    post:
      tags: [chat]
      operationId: sendChatMessage
      summary: Send a chat turn (text and/or previously uploaded image)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string, maxLength: 4000 }
                imageUrl:
                  type: string
                  description: >-
                    Path returned by /v1/chat/upload; must be owned by the
                    caller. One photo — the field older builds send. With
                    `imageUrls` it is the first of them.
                imageUrls:
                  type: array
                  maxItems: 10
                  items: { type: string }
                  description: >-
                    Several photos in ONE turn, in the order the person picked
                    them (album parity with Telegram, up to 10). Every path
                    must be owned by the caller — one foreign path refuses the
                    whole turn. The agent sees all of them and answers once.
                context:
                  $ref: "#/components/schemas/ChatContextRef"
                  description: >-
                    The inbox item the person opened the chat from ("Обсудить с
                    агентом"). A reference only — the server resolves the words
                    and grounds this turn and the follow-ups of the next six
                    hours on them. Omit for an ordinary message.
      responses:
        "200":
          description: Assistant reply
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { $ref: "#/components/schemas/ChatMessage" }
                  uiHint:
                    $ref: "#/components/schemas/UiHint"
                    description: Always null for chat-agent turns today; contract slot for future hints
                  receipts:
                    type: array
                    items: { type: string }
                    description: >-
                      Code-owned confirmations of writes that ACTUALLY landed,
                      already localised to the account language. Absent when the
                      turn changed nothing. Render them after the reply, as
                      Telegram does: without them the only evidence of a profile
                      change is the model's own prose, which it is free to
                      phrase however it likes — including describing an edit
                      that silently failed.
                  action:
                    $ref: "#/components/schemas/AgentAction"
                    description: >-
                      A native affordance the agent asked for but cannot render
                      itself. Absent on an ordinary turn. Nothing here mutates
                      anything: every irreversible action stays behind a control
                      the person still has to tap.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Image not owned by caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >-
            `context` names an inbox item that does not exist or is not the
            caller's (the same answer for both)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Text too long
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/chat/voice:
    post:
      tags: [chat]
      operationId: sendChatVoice
      summary: Send a voice note as a chat turn
      description: |
        Twin of `/v1/assistant/voice`, and not duplication: the two surfaces keep
        their own loops and their own history stores, and share only Whisper and
        the tool set.

        The transcript comes back with the reply on purpose — the person has to
        see what the agent actually heard, otherwise a misheard sentence reads
        as their own mistake rather than the machine's.

        No image can ride along: a recording and an attachment are separate
        turns.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                contextKind:
                  type: string
                  description: >-
                    With `contextId`, the chat context of this turn — multipart
                    has no nested object, so `ChatContextRef` rides as two
                    fields. Only `inbox_item` today.
                contextId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Assistant reply plus what was heard
          content:
            application/json:
              schema:
                type: object
                required: [message, transcript]
                properties:
                  message: { $ref: "#/components/schemas/ChatMessage" }
                  transcript:
                    type: string
                    description: What Whisper heard; show it as the person's own message
                  uiHint: { $ref: "#/components/schemas/UiHint" }
                  receipts:
                    type: array
                    items: { type: string }
                  action: { $ref: "#/components/schemas/AgentAction" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Account not allowed to talk to the agent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Could not transcribe audio
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/chat/history:
    get:
      tags: [chat]
      operationId: getChatHistory
      summary: Oldest-first history page for hydrating and paging the chat view
      description: |
        Returns the newest `limit` messages, oldest-first within the page.
        Pass `before` to page backwards: the response then holds the messages
        immediately preceding that one, so the client prepends each page above
        what it already shows.

        `system` rows are never returned. The client drops them anyway, and
        `/v1/chat/topics` counts messages the same way — a slice that
        disagreed with the topic index would make its `depth` a page short.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: before
          in: query
          description: |
            Message id to page backwards from, exclusive. A message id and not
            a timestamp: `createdAt` ties are real (one turn writes the user
            row and the assistant row inside the same request), and a
            timestamp cursor would either skip a row or repeat one.
          schema: { type: string }
      responses:
        "200":
          description: Messages with fresh signed image URLs
          content:
            application/json:
              schema:
                type: object
                required: [messages, hasMore]
                properties:
                  messages:
                    type: array
                    items: { $ref: "#/components/schemas/ChatHistoryMessage" }
                  hasMore:
                    type: boolean
                    description: Older messages exist before this page
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown `before` cursor, or one belonging to another user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/chat/topics:
    get:
      tags: [chat]
      operationId: getChatTopics
      summary: Read-only index of past conversations, newest first
      description: |
        The chat agent holds ONE continuous conversation per user: there is no
        thread id, no per-thread context and no forking, and this route does
        not introduce any. A "topic" is a slice of that single transcript cut
        at a silence longer than six hours — the client uses it to page
        history back and scroll to a point in time, in the same room.

        Titles are the user's own opening line after the silence, not a
        generated summary: a model-written title would cost a call per topic
        and drift between renders.

        Nothing here can be sent to, renamed or deleted. The index looks back
        over at most the newest 2000 messages; `hasMore` reports when older
        conversation exists beyond that ceiling or beyond `limit`.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: Topics, newest first
          content:
            application/json:
              schema:
                type: object
                required: [topics, hasMore]
                properties:
                  topics:
                    type: array
                    items: { $ref: "#/components/schemas/ChatTopic" }
                  hasMore:
                    type: boolean
                    description: Older topics exist beyond the listed ones
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/inbox:
    get:
      tags: [inbox]
      operationId: getInbox
      summary: The bell's inbox, newest first, with the unread count
      description: |
        One row per thing that arrived for the person in the app: admin
        announcements, and the transactional pushes that carry news (match
        proposed, date scheduled, feedback due, …). Written whether or not the
        device has notifications on. `unreadCount` is what the bell's dot
        means and nothing else.

        `type` is a string on purpose — a new kind of row must not make an
        older build fail the whole page. Render unknown types generically.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: before
          in: query
          description: Row id to page backwards from, exclusive.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: A page of the inbox
          content:
            application/json:
              schema:
                type: object
                required: [items, unreadCount, hasMore]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/InboxItem" }
                  unreadCount: { type: integer, minimum: 0 }
                  hasMore: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Unknown `before` cursor, or one belonging to another user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/inbox/read:
    post:
      tags: [inbox]
      operationId: markInboxRead
      summary: Mark inbox rows read
      description: |
        Idempotent. Ids that are not the caller's simply match nothing — no
        per-id error, so the response cannot be used to probe for rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { type: string, format: uuid }
      responses:
        "200":
          description: The unread count after the write
          content:
            application/json:
              schema:
                type: object
                required: [unreadCount]
                properties:
                  unreadCount: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/inbox/{id}:
    get:
      tags: [inbox]
      operationId: getInboxItem
      summary: One inbox row with the announcement it carries
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The row, plus `announcement` when it is one
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxItemDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/pulse:
    get:
      tags: [inbox]
      operationId: getPulse
      summary: Live Pulse rows for the Today screen
      description: |
        Built from server state only. `processing` means a real job is running
        for this person with a deadline it settles by (`deadlineAt`) — the only
        state that may animate. `active` is something the person holds; `past`
        is what already happened. The client decides which rows its current
        scene shows and draws at most three.

        `kind` and `target.kind` are strings on purpose: an older build skips
        a row it does not know instead of failing the response.
      responses:
        "200":
          description: Candidate rows, running work first
          content:
            application/json:
              schema:
                type: object
                required: [rows, serverNow]
                properties:
                  rows:
                    type: array
                    maxItems: 6
                    items: { $ref: "#/components/schemas/PulseRow" }
                  serverNow: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/tickets/appstore/transaction:
    post:
      tags: [me]
      operationId: reportAppStoreTransaction
      summary: Report a StoreKit 2 consumable purchase for wallet credit
      description: |
        Send `transaction.jwsRepresentation` after a successful purchase.
        The server extracts the transactionId (decode only), verifies it
        authoritatively via the App Store Server API, and credits the ticket
        wallet exactly-once. Call `transaction.finish()` only after a 2xx —
        an unprocessed purchase must be re-reported on next launch.
        Idempotent: a duplicate report answers 200 with `credited: 0`.
        404 while tickets are feature-disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jws]
              properties:
                jws: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Credited (or already processed)
          content:
            application/json:
              schema:
                type: object
                required: [ok, credited, balance]
                properties:
                  ok: { type: boolean, const: true }
                  credited: { type: integer, description: 0 when already processed }
                  balance: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Ticket feature disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Transaction rejected (unknown/foreign/revoked/unknown product)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: App Store verification unavailable — keep the transaction unfinished and retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/premium/appstore/transaction:
    post:
      tags: [me]
      operationId: reportAppStorePremiumTransaction
      summary: Report a StoreKit 2 auto-renewable Premium subscription transaction
      description: |
        Send the subscription `transaction.jwsRepresentation` after a purchase
        or on app launch when a renewal is observed. The server extracts the
        transactionId (decode only), verifies it authoritatively via the App
        Store Server API, and activates/extends Gennety Premium to Apple's
        `expiresDate` exactly-once. Renewals also arrive via the App Store
        Server Notifications webhook, so this endpoint is idempotent. A refunded
        or revoked transaction ends the entitlement. 404 while Premium is
        feature-disabled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jws]
              properties:
                jws: { type: string, maxLength: 20000 }
      responses:
        "200":
          description: Activated, already processed, or revoked
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
                  active: { type: boolean }
                  premiumUntil:
                    type: [string, "null"]
                    format: date-time
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Premium feature disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Transaction rejected (unknown/foreign/not the premium product/no expiry)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: App Store verification unavailable — keep the transaction unfinished and retry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/client/events:
    post:
      tags: [me]
      operationId: postClientEvents
      summary: Client-only funnel events the server cannot observe
      description: |
        Batch sink for the native app's own funnel (iOS task 6.2). It carries
        ONLY what the server is blind to by construction: leaving an onboarding
        step before submitting, a denied system permission, the outcome of the
        native liveness check, a paywall or ticket gate shown without a
        purchase, a fatal client error. Anything that is an API call is already
        observed server-side, and duplicating it here would create a second
        source of truth.

        **Auth is optional.** Half of these events happen before an account
        exists, so requiring a token would drop exactly the part of the funnel
        this endpoint is for. Without a token the person is identified only by
        the anonymous `installId` (not IDFV, not an advertising id).

        **No PII and no free text, enforced on ingest**: `props` values must
        match `^[a-z0-9_]{1,32}$`, which cannot hold a name, a phone or a
        coordinate. Values are checked by SHAPE rather than against a list, so
        a newer client shipping a new enum case is not dropped until the server
        redeploys.

        **An unknown `type` is dropped and counted in `dropped`, never fails
        the batch** — client and server ship independently, and a shipped App
        Store build lives for months.

        `id` is a client-generated UUID and the idempotency key: redelivering a
        batch stores nothing twice. `at` is the DEVICE clock (a pre-auth batch
        has no server time in it), so the row also stores the server's own
        receive time; analysis that trusts `at` alone is misled by a skewed
        phone. Rows are erased after 90 days, and sooner for a signed-in person
        whose account is deleted. 404 while the sink is feature-disabled.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installId, events]
              properties:
                installId:
                  type: string
                  maxLength: 64
                  description: Anonymous per-install UUID generated by the client.
                app:
                  type: object
                  properties:
                    version: { type: string, maxLength: 32 }
                    build: { type: string, maxLength: 32 }
                    os: { type: string, maxLength: 32 }
                    locale: { type: string, maxLength: 32 }
                events:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    required: [id, type, at]
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Client-generated; the idempotency key.
                      type:
                        type: string
                        enum:
                          - onboarding_step_left
                          - permission_prompted
                          - permission_denied
                          - liveness_finished
                          - paywall_shown
                          - paywall_dismissed
                          - ticket_gate_shown
                          - ticket_gate_dismissed
                          - fatal_client_error
                      at:
                        type: string
                        format: date-time
                        description: Device clock at the moment of the event.
                      props:
                        type: object
                        description: |
                          At most one key, fixed per type: `step`,
                          `permission`, `outcome`, `surface` or `domain`.
                          Values are closed client enums.
                        additionalProperties:
                          type: string
                          maxLength: 32
      responses:
        "200":
          description: Batch taken
          content:
            application/json:
              schema:
                type: object
                required: [ok, accepted, dropped]
                properties:
                  ok: { type: boolean, const: true }
                  accepted:
                    type: integer
                    description: Events we now hold, including ones already stored.
                  dropped:
                    type: integer
                    description: Events rejected as unknown or malformed.
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: Event sink feature-disabled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /v1/matches/current:
    get:
      tags: [matches]
      operationId: getCurrentMatch
      summary: Most relevant in-flight match (or null)
      responses:
        "200":
          description: Envelope with the match, `match` null/absent when nothing is open
          content:
            application/json:
              schema:
                type: object
                properties:
                  match: { $ref: "#/components/schemas/SerializedMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/matches/{id}/partner-photos:
    get:
      tags: [matches]
      operationId: getPartnerPhotos
      summary: Signed, short-lived URLs for the partner's photos (cinematic pitch)
      description: |
        The native pitch renders the partner full-screen; Telegram gets the
        same photos as a `protect_content` media group, which has no client
        equivalent here. Deliberately not a field on `SerializedMatch` —
        `/current` is polled, and these are needed once when the pitch opens.

        Entitlement is the existing product rule, not a new one: the caller
        must be a participant of a match that is still live. A cancelled or
        expired match returns 404, because after a decline the pair is banned
        for life and there is nothing left to show.

        URLs expire in 10 minutes and are bound to this caller. The bytes
        endpoint behind them re-checks entitlement on every request, so a URL
        minted before a cancellation stops working with the match.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Ordered URLs, one per partner photo (may be empty)
          content:
            application/json:
              schema:
                type: object
                required: [urls]
                properties:
                  urls:
                    type: array
                    items: { type: string, format: uri }
                  video:
                    $ref: "#/components/schemas/ProfileVideo"
                    description: |
                      The partner's profile video — present only when there is
                      something to play (`url` is never null here). Same
                      entitlement as the photos, but a Supabase signed URL
                      rather than the byte proxy: AVPlayer needs Range
                      requests. So, unlike the photos, a URL minted before a
                      cancellation keeps working for the rest of its 10
                      minutes.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No live match with this id for this caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/partner-voice-prompt:
    get:
      tags: [matches]
      operationId: getPartnerVoicePrompt
      summary: The partner's voice prompt with a FRESH signed audio URL
      description: |
        `SerializedMatch.partnerVoicePrompt` already carries the recording, but
        its `audioUrl` is minted with `/current` and lives 5 minutes — shorter
        than a pitch stays open. Ask here when that URL is refused (or older
        than its TTL), not on every tap.

        Same entitlement as `partner-photos`: participant of a live match.
        `voicePrompt` is absent when the partner recorded none; its `audioUrl`
        is null for a Telegram-recorded prompt (the bars still render, there is
        nothing to play). 404 also while `VOICE_PROMPT_ENABLED` is off.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  voicePrompt:
                    $ref: "#/components/schemas/PartnerVoicePrompt"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No live match with this id for this caller, or the feature is off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/calendar:
    get:
      tags: [matches]
      operationId: getMatchCalendar
      summary: Slot grid and both sides' marks
      description: |
        PRODUCT_SPEC §3.6. After mutual accept (and, when the §3.5b gate is
        enabled, after both tickets settle) the server writes a fixed grid of
        instants into the match; each side marks any subset as "I'm free".

        The JWT twin of the `initData`-authed `/v1/calendar/*` used by the
        Telegram Mini App. The mechanics behind both are the same functions —
        auto-lock on a single overlap, `overlapCandidates` on several, the
        first-mover notification — so the two surfaces cannot drift on the one
        question that matters here, which is when a date locks in.

        Poll this while the screen is open (~4s, like the Mini App) so the
        partner's marks land live.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: The grid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The calendar is closed for this match (cancelled, expired, or past
            the venue step). Deliberately not a 404 — the match exists and the
            caller is on it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Calendar not ready (bot API unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [matches]
      operationId: submitMatchCalendarSlots
      summary: Replace this side's availability
      description: |
        `slots` is the FULL set for this side, not a delta, so unmarking needs
        no second verb. Every entry must be one of `proposedTimes`; anything
        else is a 400 rather than silently dropped.

        The response is the new state, so no re-fetch is needed — at a 4s poll
        that round trip is the difference between a tap landing and a tap
        appearing to do nothing.

        Three outcomes, decided server-side:

        - **one shared slot** — the date locks immediately and `agreedTime` is
          set. Nothing is asked of either side.
        - **several shared slots** — `overlapCandidates` is returned and
          NOTHING is locked. The actor picks the final one and re-submits it
          alone. Initiator offers, responder decides: earliest-wins would
          quietly take the choice away from the person who was offered it.
        - **none** — the partner is told this side proposed times.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slots]
              properties:
                slots:
                  type: array
                  maxItems: 200
                  items: { type: string, format: date-time }
      responses:
        "200":
          description: Saved; the new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: |
            `prime-time-locked` — at least one submitted slot is in the Prime
            Time band and this pair has not opened it (`PrimeTimeState`).

            **A permitted verdict, not a failure**: the slot exists and the pair
            may have it, for a price. Nothing was saved — the whole submission
            is refused, not the offending entries — so re-submitting without the
            locked slots is the way forward.

            Documented after the fact: the server has answered this since
            2026-08-26, and a client reading the bare 402 by number would be
            reading a status the contract never promised.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The calendar is closed for this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Calendar not ready (bot API unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/chat:
    get:
      tags: [matches]
      operationId: getProxyChat
      summary: Anonymous pre-date chat — window state and messages
      description: |
        PRODUCT_SPEC §Phase 4 (Variant C). The narrow, deliberately-scoped
        exception to NO IN-APP CHAT: an already-matched, already-scheduled pair
        gets a text-only relay that opens at T-1h and auto-closes at T+2h, so
        they can find each other at the venue. It is not conversation, and it
        is not reopened general user-to-user chat.

        The JWT twin of the Telegram relay in `handlers/date/coordination.ts`.
        Both call the same `services/proxy-chat.ts`, so neither surface can
        drift on when the window is open, what is logged, or what the partner
        receives.

        **This read succeeds whether or not the window is open**, because the
        client has to render "the chat opens at 19:30" before it opens and
        "the chat has closed" after — a 409 there would leave it with nothing
        to say. `open` is the only thing that gates sending.

        Poll ~4s while the screen is open, like the calendar. Pass `since` with
        the id of the newest message already held to get only what is new;
        omit it for the whole window.

        404 while `COORDINATION_FEATURE_ENABLED` is off, matching the Mini App
        routes — the feature does not exist rather than being empty.
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - name: since
          in: query
          required: false
          schema: { type: string }
          description: |
            Id of the newest message the client already has; only newer ones
            are returned. An id this match does not carry is NOT an error —
            the whole window comes back, because the alternative is a client
            stuck with a cursor it can never advance.
      responses:
        "200":
          description: Window state and messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyChatState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such match, or the coordination feature is off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The match is not a scheduled date, so there is no window to
            describe. Deliberately not a 404 — the match exists and the caller
            is on it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      tags: [matches]
      operationId: sendProxyChatMessage
      summary: Relay one text message to the partner
      description: |
        Text only. Media is refused rather than stripped: the window exists to
        say "I'm by the window on the left", and a photo carries a face and
        EXIF the pair has not agreed to exchange — that is the leak this
        variant is scoped to avoid.

        Every relayed message is written to `proxy_messages` before delivery.
        That log is the justification for the carve-out to NO IN-APP CHAT, so
        it is not optional and not sampled.

        The response is the new state, so a send needs no follow-up read — at a
        4s poll that round trip is the difference between a message appearing
        instantly and appearing to be swallowed.

        Delivery follows the partner's own rail: a Telegram DM, an APNs push,
        or both for a `both`-platform account. A partner who cannot be reached
        does NOT fail the send — the message is logged and shown, and they see
        it when they open the chat.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body:
                  type: string
                  minLength: 1
                  maxLength: 1000
                  description: |
                    Trimmed server-side; empty after trimming is a 400. The
                    ceiling mirrors `PROXY_MAX_MESSAGE_LEN` and is served back
                    as `maxMessageLength` so the client never hard-codes it.
      responses:
        "200":
          description: Relayed; the new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyChatState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No such match, or the coordination feature is off
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: |
            The window is not open — it has not reached T-1h, it closed at
            T+2h, or this match is not a scheduled date. The client should
            re-read the state rather than retry the send.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/chat/messages/{messageId}/reaction:
    put:
      tags: [matches]
      operationId: reactToProxyChatMessage
      summary: Put one emoji on the partner's message, or take it off
      description: |
        The pre-date chat's only non-text act. A reaction is a WRITE rather
        than a client-side flourish for the same reason the delivery ticks
        stopped being a client guess: most pairs here are one app plus one
        Telegram, and a mark the other person never sees is decoration.

        **How the partner sees it.** If they wrote the line from Telegram, the
        bot sets a native Telegram reaction on *their own copy* of the message
        — the one they sent the bot, not the relayed copy in the reader's chat,
        which is a different message and the wrong address. If they wrote it
        from the app, they read it off this state on their next poll. Delivery
        is best-effort in both directions: a Telegram hiccup never fails the
        tap, because the row is already written.

        **PUT, not POST.** One message carries at most one reaction, so
        pressing ❤ twice must leave the state pressing it once left. A POST
        would suggest appending to a list this endpoint does not have.

        **`reaction: null` removes it** — pressing the emoji already on a
        message un-reacts, as it does in every chat app. Null is a value here,
        not an absent field; an absent field is a malformed body (400).

        **You cannot react to your own message** (403 `own-message`). A
        reaction is something the reader does; self-reacting would show authors
        marks they made themselves.

        **The window does not gate this.** Sending is time-boxed because the
        chat exists to find each other, but answering a line already said costs
        nobody anything — and refusing after T+2h would leave the last "I'm
        outside" unanswerable at the exact moment the pair is meeting. Reading
        is ungated for the same reason.
      parameters:
        - $ref: "#/components/parameters/MatchId"
        - name: messageId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: |
            `ProxyChatMessage.id`. Scoped to the match server-side, so an id
            belonging to another match is a 404 rather than someone else's
            message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reaction]
              properties:
                reaction:
                  type: [string, "null"]
                  description: |
                    One of `❤` `👍` `🔥` `🤣` `🙏`, or `null` to clear. The set
                    is closed to Telegram's own reaction vocabulary — see
                    `ProxyChatMessage.reaction` for why, including why `❤`
                    carries no variation selector and why there is no 😂.
                    Anything else is a 400 `bad-reaction`.

                    **Deliberately spelled out in prose rather than as an
                    `enum`,** and this is the same trap `InterviewState.reaction`
                    documents: `enum: [..., null]` makes swift-openapi-generator
                    emit a phantom `_empty_ = ""` case, so a client clearing a
                    reaction would send an empty string where the contract says
                    null. Caught here on the first regeneration. The response
                    side keeps its enum — it is not nullable, so it is safe —
                    and the server validates this field either way, so the
                    contract loses nothing but the landmine.
      responses:
        "200":
          description: Reaction applied or cleared; the new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProxyChatState" }
        "400":
          description: |
            `bad-reaction` — the body was malformed, or the emoji is outside
            the closed set. Malformed rather than forbidden: a client sending
            🍕 has a bug, not a missing permission.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: |
            `forbidden` — not a participant of this match. `own-message` — the
            caller wrote the message they are reacting to.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: |
            No such match, no such message in this match, or the coordination
            feature is off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: This match is not a scheduled date.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/ticket-gate:
    get:
      tags: [matches]
      operationId: getTicketGate
      summary: Date Ticket gate state for this side
      description: |
        PRODUCT_SPEC §3.5b. Between mutual accept and the Calendar sits an
        optional paid step; `SerializedMatch.ticketGate` says whether this side
        owes it, and this endpoint is the screen behind it.

        **The wallet is the only rail on iOS.** On Telegram the gate is charged
        directly in Stars, per scope. An App Store consumable is a fixed-price
        SKU, so a per-scope charge would need a product per scope and another
        per discount state, each created by hand in App Store Connect and
        impossible to re-price server-side. StoreKit therefore only credits the
        wallet (`POST /v1/tickets/appstore/transaction`), and the gate only
        spends from it — every gate action is expressible with the three
        consumables that already exist, and a settle that loses its race
        refunds a ticket rather than a dollar. The famine single-ticket
        discount is USD-only and does not apply here, the same way it never
        applied to Stars.

        Fetching this also fires the cover read-receipt when the caller is the
        covered side, which releases the Calendar the server held back for
        exactly that moment. `POST /seen` exists for clients that want to stamp
        it after the reveal animation instead.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Gate state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketGateState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Tickets disabled, or no such match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "503":
          description: Gate not ready (bot API unavailable)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/ticket-gate/use:
    post:
      tags: [matches]
      operationId: useTicketForGate
      summary: Spend wallet ticket(s) on this gate
      description: |
        Settles one or both slots from the caller's wallet balance and returns
        the new gate state (no re-fetch needed).

        `partner` and `both` are male-only; the rule is enforced here and
        surfaced as `canCoverPartner` so the client never encodes it. A `both`
        spend that only manages to claim one slot — because the partner paid in
        the meantime — refunds the surplus ticket instead of burning it.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: string
                  enum: [self, partner, both]
      responses:
        "200":
          description: Settled; the new state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketGateState" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant, or scope not allowed for this caller
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Tickets disabled, or no such match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Not enough tickets in the wallet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/ticket-gate/seen:
    post:
      tags: [matches]
      operationId: markTicketRevealSeen
      summary: Read-receipt for the "your match covered you" reveal
      description: |
        Idempotent. Stamps the receipt, tells the payer once that his gesture
        landed, and releases the covered side's Calendar. Safe to call even
        when the caller was not covered — it is then a no-op.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Receipted (or already was)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Tickets disabled, or no such match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/decision-intent:
    post:
      tags: [matches]
      operationId: classifyDecisionIntent
      summary: Classify a free-text answer to the pitch question
      description: |
        The кино-питч's conversational decision. Server-side keyword
        fast-path + LLM fallback (same logic as the Telegram surface).
        Text NEVER commits — show the guarded confirm card for `yes`/`no`,
        a no-rush nudge for `unsure`, treat `other` as ordinary chat; the
        commit stays POST /decision behind an explicit tap.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Classified intent
          content:
            application/json:
              schema:
                type: object
                required: [intent]
                properties:
                  intent:
                    type: string
                    enum: [yes, no, unsure, other]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Match not found, not a participant, already decided, or not proposed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/matches/{id}/decision:
    post:
      tags: [matches]
      operationId: submitMatchDecision
      summary: Accept or decline the proposed match (blind, irreversible)
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [accept, decline]
                reason:
                  type: string
                  maxLength: 1000
                  description: |
                    Optional free text explaining a `decline`. It is recorded as
                    rejection feedback and folded into the user's own
                    `negativeConstraints`, which the matcher reads directly — so
                    sending it is how the app tunes future matches. Ignored on
                    `accept`. A decline without one is still a decline.
      responses:
        "200":
          description: Reloaded match state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerializedMatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: Match not found or not actionable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/vibe-location:
    post:
      tags: [matches]
      operationId: submitVibeLocation
      summary: Submit the venue vibe + departure pin
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vibe, lat, lng]
              properties:
                vibe:
                  type: string
                  enum: [coffee, walk, drinks, study]
                lat: { type: number, minimum: -90, maximum: 90 }
                lng: { type: number, minimum: -180, maximum: 180 }
      responses:
        "200":
          description: Reloaded match state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerializedMatch" }
        "400":
          description: Invalid payload, or the departure pin is outside the caller's market
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VenueOriginOutsideMarket"
                  - $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: Match not in a negotiating state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/venue-intent:
    get:
      tags: [matches]
      operationId: getVenueIntent
      summary: Get this user's Venue Intent V2 draft or confirmation
      description: Never returns the partner's facets; only a submitted boolean.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Own intent, smart suggestions, and partner submission state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueIntentState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [matches]
      operationId: confirmVenueIntent
      summary: Confirm edited canonical chips and departure origin atomically
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VenueIntentConfirmation" }
      responses:
        "200":
          description: Confirmed state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueIntentState" }
        "400":
          description: Invalid payload, or the departure pin is outside the caller's market
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VenueOriginOutsideMarket"
                  - $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/matches/{id}/venue-intent/interpret:
    post:
      tags: [matches]
      operationId: interpretVenueIntent
      summary: Interpret free text once and persist a recoverable draft
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 500 }
                origin: { $ref: "#/components/schemas/VenueOrigin" }
      responses:
        "200":
          description: Canonical draft; empty chips mean manual confirmation is required
          content:
            application/json:
              schema:
                type: object
                required: [intent]
                properties:
                  intent: { $ref: "#/components/schemas/VenueIntentV2" }
        "400":
          description: Invalid payload, or the departure pin is outside the caller's market
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VenueOriginOutsideMarket"
                  - $ref: "#/components/schemas/Error"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/matches/{id}/safety-ack:
    post:
      tags: [matches]
      operationId: acknowledgeSafetyBrief
      summary: Acknowledge the pre-date safety brief
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Reloaded match state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SerializedMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/matches/{id}/vibe-telemetry:
    post:
      tags: [matches]
      operationId: submitDateVibe
      summary: One-tap read on how the evening went, from the Live Activity
      description: |
        Written by the native Live Activity's App Intent at T+2h (iOS §4.2,
        stage `vibe_check`), from the lock screen or the expanded Dynamic
        Island, without the app coming to the foreground.

        **Deliberately not `POST /v1/me/feedback/post-date`.** That one is the
        T+24h form: it refuses with 409 until the date is closed out, and it
        demands a 1-10 chemistry score and a second-date answer. Pointing a
        one-tap button at it would have meant either loosening its gate or
        inventing a number on the user's behalf, and that blob is the only
        thing the product learns whether a date worked from. This endpoint
        writes to the audit log (`match_events`) instead, with the exact rating
        in `metadata`, and changes nothing the form later says.

        **Answering twice succeeds.** The second call is almost always a retry
        of a request whose response was lost; only the first one writes.

        Recording an answer also takes that side's card down, with a short
        dismissal delay so the acknowledgement is visible before it goes.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: string
                  enum: [chemistry_great, nice_chat, no_vibe]
                  description: |
                    Three values rather than a scale. A scale already exists in
                    the T+24h form; repeating it on a surface where the user has
                    one second and one thumb would collect a random number, not
                    an answer.
      responses:
        "200":
          description: Recorded (or already recorded)
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        "400":
          description: |
            `bad-rating` — a value this server does not know. Refused rather
            than coerced: a rating guessed on the client's behalf is
            indistinguishable in the dataset from one the person gave.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            No such match, or the caller is not on it. 404 rather than 403 so
            the endpoint cannot be used to probe which match ids exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `wrong-state` — the date has not happened yet. A card that somehow
            asked early must not be able to write an answer about an evening
            that has not occurred.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/cancel:
    post:
      tags: [matches]
      operationId: cancelDate
      summary: Emergency-cancel a scheduled date
      description: |
        Irreversible: the pair is never re-matched (the lifetime pair ban of
        §3.2 filter 6 applies to any row that ever existed). Both sides' paid
        Date Tickets are returned to their wallets — including the canceller's,
        because the penalty for flaking is already Elo, and charging on top
        would make an honest cancellation more expensive than a silent no-show.

        `reason` is **mandatory and forwarded to the partner verbatim**. That is
        a product rule rather than a validation detail: the person it lands on
        is owed the actual sentence, not a system notice. The two-step
        confirmation lives in the client — the server does not enforce one,
        because a guard the caller can skip is not a guard, and the
        irreversible step is this request.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: Date cancelled
          content:
            application/json:
              schema:
                type: object
                required: [ok, ticketsRefunded]
                properties:
                  ok: { type: boolean }
                  ticketsRefunded:
                    type: integer
                    description: Tickets returned to THIS caller's wallet.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: |
            Not a scheduled date — already cancelled, or never got that far.
            409 rather than 404: the match exists and the caller is on it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Reason too long
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/report:
    post:
      tags: [matches]
      operationId: reportMatch
      summary: File a post-match report (LLM-triaged into tiers)
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category, message]
              properties:
                category:
                  type: string
                  enum: [tier1_disappointment, tier2_ghosting, tier3_safety]
                message: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "204": { description: Report recorded }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: Already reported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Message too long
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/matches/{id}/block:
    post:
      tags: [matches]
      operationId: blockMatchPartner
      summary: Block the partner of this match
      description: |
        App Store guideline 1.2. Independent of `/report`: reporting accuses,
        blocking only withdraws, and a user must be able to do the second
        without the first. The blocked person is never told — if a live date is
        cancelled they receive the ordinary cancellation notice.

        Idempotent: re-blocking answers 200 with the same body.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      responses:
        "200":
          description: Block recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok, dateCancelled]
                properties:
                  ok: { type: boolean }
                  dateCancelled:
                    type: boolean
                    description: |
                      True when this block cancelled a live match between the
                      two. Decides which sentence the client shows; tickets are
                      returned by the server either way.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/countdown:
    get:
      tags: [countdown]
      operationId: getCountdown
      summary: Next weekly drop + per-user weekly status
      responses:
        "200":
          description: Countdown snapshot
          content:
            application/json:
              schema:
                type: object
                required: [nextDropAt, serverNow, weeklyStatus, standbyCount, priorityBoosted, resolvedAt, searchersInCity]
                properties:
                  nextDropAt: { type: string, format: date-time }
                  serverNow:
                    type: string
                    format: date-time
                    description: Server clock for client skew correction
                  weeklyStatus:
                    type: string
                    enum: [matched, standby, pending]
                  standbyCount: { type: integer }
                  priorityBoosted: { type: boolean }
                  resolvedAt:
                    type: [string, "null"]
                    format: date-time
                  searchersInCity:
                    type: [integer, "null"]
                    description: >-
                      People currently searching in this user's city, or null
                      when there is nothing to show. The server owns the
                      visibility rule (SEARCHERS_COUNTER_MIN, default 250) so
                      the number can be tuned by a backend deploy rather than
                      an App Store release; null covers both "city below the
                      threshold" and "no city chosen" because the client
                      renders them identically. Never rounded or invented —
                      when a number is present it is the real count.
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/date/state:
    get:
      tags: [date]
      operationId: getDateState
      summary: Living Canvas state for the caller
      description: >
        Everything the map's bottom sheet draws, in one call. Answers for a user
        with no match at all (IDLE_EXPLORING), which is why it is its own
        endpoint rather than a field on /v1/matches/current.


        The state is DERIVED from MatchStatus plus the clock plus the bump
        session — it is never a stored column, so a client must not cache it
        across a boundary it cannot see (poll it, or re-fetch on resume).


        Blind-decision safe: the response never carries the partner's own
        accept/decline, and a caller who has answered a pitch resolves to
        LOGISTICS_SCHEDULING whatever the partner did.
      responses:
        "200":
          description: Canvas snapshot
          content:
            application/json:
              schema:
                type: object
                required: [state, serverNow, nextDropAt]
                properties:
                  state:
                    type: string
                    description: >
                      One of `IDLE_EXPLORING`, `DROP_PENDING_DECISION`,
                      `LOGISTICS_SCHEDULING`, `DATE_SCHEDULED`,
                      `DATE_RADAR_ACTIVE`, `DATE_BUMP_PENDING`,
                      `DATE_IN_PROGRESS`, `POST_DATE_FEEDBACK`.


                      **Deliberately a documented string, not an `enum`.** The
                      set is derived by a pure function, so a ninth state costs
                      no migration and can ship any deploy — while the native
                      client is an App Store build that cannot be rolled back,
                      and swift-openapi-generator turns an `enum` into a closed
                      Swift type whose decode THROWS on an unknown value. That
                      would take the canvas down for everyone who had not
                      updated. As a string, an unknown value reads as
                      `IDLE_EXPLORING` — the map the user sees most of the time.
                  serverNow:
                    type: string
                    format: date-time
                    description: Server clock for client skew correction
                  nextDropAt: { type: string, format: date-time }
                  timeZone:
                    type: [string, "null"]
                    description: >
                      The CALLER's own city zone. agreedTime is an instant and
                      the canvas draws it on a wall clock; the device's is wrong
                      for a traveller. Same field and same reason as
                      SerializedMatch.timeZone.
                  match:
                    $ref: "#/components/schemas/DateStateMatch"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/dates/{id}/bump:
    post:
      tags: [date]
      operationId: postDateBump
      summary: Record this side's Date Bump shake
      description: >
        One side's shake. The pair verifies when both shakes land within 10s of
        each other and both coordinates are inside 100m of the venue — the
        server re-checks all three, because a client-side verdict is a
        client-side ticket grant.


        `at` is the DEVICE's clock and is the only honest answer to "when was it
        shaken", so it is used — but it is clamped to the server's own clock
        beyond a minute of skew, so a wrong device date cannot bump outside its
        own date.


        `verified` is the state of the PAIR, not of this call: the partner's own
        shake also answers true. `deck` is returned only to the call that
        actually completed the pair.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                at:
                  type: string
                  format: date-time
                  description: When the device registered the shake. Omitted = now.
      responses:
        "200":
          description: Shake recorded
          content:
            application/json:
              schema:
                type: object
                required: [ok, verified]
                properties:
                  ok: { type: boolean, const: true }
                  verified: { type: boolean }
                  deck:
                    $ref: "#/components/schemas/BumpDeck"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            The caller is not on this match. 404 rather than 403 so the endpoint
            cannot be used to probe which match ids exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `wrong-state` (not a scheduled date, or no venue), `too-early`,
            `too-late`, or `too-far`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/dates/{id}/proximity:
    post:
      tags: [date]
      operationId: postDateProximity
      summary: Ping this side's position in the last 45 minutes before the date
      description: >
        Ping-and-read. You tell the server where you are; it tells you about
        your PARTNER — one word, and one wall-clock time if they are moving.


        **The response shape is the privacy boundary.** No coordinate, no
        distance, no address, no "500 m away": those are the same disclosure at
        different resolutions, and a person's exact position is never revealed
        to their match (PRODUCT_SPEC §6.3). The coordinates you send are used to
        compute an ETA and dropped — they are never stored and never logged.


        The window is T-45m to `agreedTime` itself and not a minute past it:
        once the date has begun, "your match is on the way" has stopped being
        information.
      parameters:
        - $ref: "#/components/parameters/MatchId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
                mode:
                  type: string
                  enum: [walking, transit]
                  description: >
                    How you are travelling. Omitted, or a value this server does
                    not know, falls back to a guess from the distance rather
                    than an error.
      responses:
        "200":
          description: Position recorded; the partner's masked status returned
          content:
            application/json:
              schema:
                type: object
                required: [ok, arrived, peer, bothArrived]
                properties:
                  ok: { type: boolean, const: true }
                  arrived:
                    type: boolean
                    description: Whether YOU are inside 50m of the venue.
                  peer:
                    type: string
                    description: >
                      Your partner's state: `unknown`, `en_route` or `arrived`.
                      `unknown` means their phone has not pinged recently — the
                      honest answer rather than a stale ETA, and also the value
                      a client reads an unrecognised one as (a documented string
                      rather than an `enum`, for the reason spelled out on
                      `/v1/date/state` → `state`).
                  peerEtaLocal:
                    type: string
                    description: >
                      Their arrival as `HH:mm` in the pair's own city. Present
                      only while they are en route.
                  bothArrived:
                    type: boolean
                    description: Both of you are at the venue — the one celebratory beat.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            The caller is not on this match. 404 rather than 403 so the endpoint
            cannot be used to probe which match ids exist.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `wrong-state` (not a scheduled date, or no venue), `too-early` (the
            radar has not opened), or `too-late` (the date has started).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/scratch:
    get:
      tags: [date]
      operationId: getScratchMap
      summary: The Dating Scratch Map — which parts of the city you have been in
      description: >
        Tiles, a percentage and the venues a verified Date Bump has recorded,
        plus the consent the whole feature runs under, so one call draws the
        screen.


        **Tiles, never coordinates.** A tile is geohash precision 6 — roughly
        1.2 km × 0.61 km — so this can say "they have been around Podil" and
        can never say which building. Every other geo value in the product is
        per-purpose and per-match; this is the first that accumulates, which is
        why the guarantee is the shape of what is stored rather than a rule at
        the call site.
      responses:
        "200":
          description: The caller's map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ScratchMap" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/scratch/ping:
    post:
      tags: [date]
      operationId: postScratchPing
      summary: Record one foreground position as a tile
      description: >
        The coordinates pick a tile and are then dropped — never stored, never
        logged, the same rule the Date Radar follows.


        Answers the CURRENT map on every call, including the common "you have
        not moved" case, so the client needs no second request to redraw. A
        ping that uncovers nothing performs no write at all: someone sitting in
        a café would otherwise write a row every few seconds for a set that
        never changes.


        Only ever called from the foreground, with the map open. There is no
        background-location entitlement in the iOS app and no such permission
        requested in the Mini App, which is what makes "nothing is recorded
        while you are not looking" structural rather than a promise.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lat, lng]
              properties:
                lat: { type: number }
                lng: { type: number }
      responses:
        "200":
          description: Position folded into a tile; the whole map returned
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScratchMap"
                  - type: object
                    required: [ok, uncovered]
                    properties:
                      ok: { type: boolean, const: true }
                      uncovered:
                        type: boolean
                        description: Whether this ping revealed new ground.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >
            `opted-out` (the toggle is off) or `outside-market` (a ping from a
            city that is not the caller's own — the map is "your Kyiv", and a
            week abroad would otherwise fill it with squares no percentage of
            Kyiv can describe). Neither is worth retrying; the client's job is
            to offer the toggle or say nothing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/scratch/opt-in:
    put:
      tags: [date]
      operationId: putScratchOptIn
      summary: Turn the Scratch Map's collection on or off
      description: >
        Off by default, and its own consent rather than a fold into
        `researchOptIn`: that one governs analytics use of data we already
        hold, this one authorises COLLECTING a new class of it, and a consent
        that authorises new collection is never inferred from a broader tick —
        the same rule `biometricConsentAt` follows.


        **Switching it off stops collection and keeps the map.** The tiles are
        the person's own; a toggle that silently deleted months of them would
        be a worse surprise than one that stops collecting. Erasure is account
        deletion, which reaches this row by cascade.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new setting, with the map unchanged
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ScratchMap"
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/frequent-places:
    get:
      tags: [me]
      operationId: getFrequentPlaces
      summary: The caller's frequently visited places, and the consent they run under
      description: >
        The places the caller's match sees (`hidden: false`, best first, at
        most three and at most two of one category), then the ones the caller
        hid (`hidden: true`), plus the opt-in — one call draws the profile
        section. `visits` is the number of distinct days with a visit in the
        last 180 days and is the owner's alone; the match receives a name and
        a category (`SerializedMatch.partnerFrequentPlaces`).


        A place qualifies at 5 visit days for cafés, coffee shops, restaurants
        and lounges, and at 3 for museums. A visit is a stay of at least 15
        minutes read from two foreground fixes, or a date the caller attended
        there. Only active catalog places ever appear. Switched off, the list
        is empty and nothing is read.
      responses:
        "200":
          description: The caller's places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequentPlaces" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/frequent-places/opt-in:
    put:
      tags: [me]
      operationId: putFrequentPlacesOptIn
      summary: Turn frequently visited places on or off
      description: >
        **On by default** (founder decision 2026-09-11). Off stops collection
        at once and removes the block from the profile and from the match; the
        visit days already stored are kept and age out after 180 days — the
        Scratch Map's rule that a toggle never silently deletes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        "200":
          description: The new setting and the list it leaves
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FrequentPlaces"
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/frequent-places/{placeId}/visibility:
    put:
      tags: [me]
      operationId: putFrequentPlaceVisibility
      summary: Hide one place from the block, or bring it back
      description: >
        Hiding stops the SHOWING, not the counting: the place keeps its visits
        and returns at the rank it earned when brought back, and meanwhile the
        next place takes its slot — for the owner and the match alike, at once.
      parameters:
        - name: placeId
          in: path
          required: true
          description: Google Place id, as `FrequentPlace.placeId` carries it.
          schema: { type: string, pattern: "^[A-Za-z0-9_-]{1,255}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hidden]
              properties:
                hidden: { type: boolean }
      responses:
        "200":
          description: The list after the change
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/FrequentPlaces"
                  - type: object
                    required: [ok]
                    properties:
                      ok: { type: boolean, const: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/frequent-places/fences:
    get:
      tags: [me]
      operationId: getFrequentPlaceFences
      summary: The caller's city as circles, for the client's pre-filter
      description: >
        A client sends a fix to `/v1/frequent-places/presence` only when it
        lies within `radiusM` plus the fix's own accuracy of some fence — the
        same reach the server calls "not away" — so a position leaves the phone
        only when the person is at one of our places. `policy` carries the
        client's numbers so none is compiled into an app build. `fences` is
        empty while the caller is opted out: there is then nothing to send.
        Safe to cache for a day.
      responses:
        "200":
          description: Fences and policy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FrequentPlaceFences" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/frequent-places/presence:
    post:
      tags: [me]
      operationId: postFrequentPlacePresence
      summary: One foreground fix at a place, or "I left"
      description: >
        Either a fix — `lat`, `lng`, `accuracyM` (iOS `horizontalAccuracy`)
        and `ageSeconds` (how old the fix is by the DEVICE's own clock, so a
        wrong device date can neither make a stale fix fresh nor stretch a
        stay) — or `{ "away": true }`, sent when a fix lands clear of every
        fence while a stay may be open. The away report carries no position.


        The server reads the fix against its catalog and drops it: coordinates
        are never stored or logged. A visit is written only when two fixes at
        least 15 minutes apart land on the same place with no departure in
        between. The answer is `{ ok: true }` either way, deliberately — a fix
        is not a receipt.


        Foreground only: there is no background-location entitlement in the
        iOS app. Called when the app becomes active and every
        `policy.probeIntervalSeconds` while it stays open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'A fix (all four numbers) or `{ "away": true }` alone.'
              properties:
                lat: { type: number }
                lng: { type: number }
                accuracyM: { type: number, minimum: 0 }
                ageSeconds: { type: number, minimum: 0 }
                away: { type: boolean }
      responses:
        "200":
          description: Accepted (whether or not it completed a visit)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: >
            `opted-out` — the caller switched the feature off. Not worth
            retrying; the client stops sending.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/venues/showcase:
    get:
      tags: [date]
      operationId: getVenueShowcase
      summary: Curated places for the standby canvas
      description: >
        What the canvas shows while nothing is scheduled (IDLE_EXPLORING): the
        city's curated places, drawn as photo pins on the map and as a card
        carousel under it, in one call. Takes either rail, like the rest of
        the canvas.


        **One entry per REAL place.** The catalog holds a row per university
        domain, so one café can be three rows; the list is deduplicated by
        Google place id before it is ranked, otherwise one café would be three
        pins stacked on one spot. Categories the product never offers
        (`museum`) and operator-blocked names are left out, as everywhere else.


        **The city's top, capped at 64 and already in display order**
        (founder, 2026-09-22). A city with a hand-picked list (Kyiv: 62
        places — the premium catalog, fashionable places, the most popular
        cafés, five parks) gets exactly that list; any other city gets the
        rule: premium first, then operator priority, a photo and Google
        rating, one card per brand, never the board-only `alternative` tier
        or the Georgian / Crimean-Tatar / Uzbek / plov / shawarma kitchens.
        A row outside the city's radius is left out as a geocoding mistake.
        The order is a walk from the first place — always the nearest one
        not yet shown — so a swipe of the carousel moves the map a street or
        two rather than across the city.
      parameters:
        - name: cityKey
          in: query
          required: false
          description: >
            City to show, e.g. `ua:kyiv`. Omitted — the caller's own home city
            (`Profile.homeCityKey`). A caller with no city at all gets an empty
            list and `cityKey: null`, not an error.
          schema: { type: string }
      responses:
        "200":
          description: The places, in display order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueShowcase" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/venue-change/state:
    get:
      tags: [date]
      operationId: getVenueBoardState
      summary: Venue-change board snapshot
      description: >
        Everything the board draws for the caller: what the pair was given,
        what each side has hearted, whether they have agreed, and what the
        caller may do about paying. Polled while the board is open (~4 s in the
        Mini App), so it is small and cheap by design.


        **This endpoint answers for the CALLER.** `myLikes` is theirs and
        `peerLikes` is the partner's, and neither side is ever told anything
        about the other beyond which venue keys they marked — the board is a
        coordination surface, not a window into someone's taste.


        A board that cannot be opened answers `open: false` with
        `closedReason`, rather than an error: "the venue is settled" and "we
        are past the cutoff" are states of a real board, not failures.
      parameters:
        - name: match
          in: query
          required: true
          description: The scheduled match whose venue is up for change.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The board as the caller sees it
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueBoardState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant of this match
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/venue-change/catalog:
    get:
      tags: [date]
      operationId: getVenueChangeCatalog
      summary: Alternatives the pair may move to
      description: >
        Up to 21 places within 3 km of the venue the pair was given (5 km for
        premium-tier venues), curated first and filled out from Google Places,
        each open at the agreed time. The assigned venue itself is NOT in this
        list — it is the board's pinned card, hearted under the reserved key
        `__keep__`.


        **The SET is the pair's; the ORDER is the caller's.** Both participants
        are served exactly the same venues — a change happens when their hearts
        intersect, so a card one side could not see would make agreement
        unreachable — but each sees them ordered by what is known about where
        they actually go (the opt-in frequent-places block and the places a
        Date Bump has verified them at). With nothing known, the order is the
        server's ordinary ranking, which is also what a caller who has opted
        out or never granted location gets.


        Premium-tier venues are included whenever the Premium feature is on,
        and are shown LOCKED unless `pairPremiumActive` on the board state is
        true. Selecting one without that is refused server-side with 402 — the
        tier is re-resolved from the catalog and never taken from the client.


        **Every card carries the place sheet it opens** (`profile`, since
        2026-09-22): the city guide's `ShowcaseVenue` for the same place, read
        for the whole board in one catalog query, or null where the catalog has
        no row for it. No request of its own when a card is tapped.
      parameters:
        - name: match
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The alternatives, in this caller's display order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueChangeCatalog" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant, or the feature is off
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: >
            The board is closed for this date — already changed as often as it
            may be, or past the T−5h cutoff.

  /v1/venue-change/like:
    post:
      tags: [date]
      operationId: submitVenueLikes
      summary: Submit the caller's whole set of hearted venues
      description: >
        Full-set submission, like the calendar's slot picking: send every key
        the caller currently has hearted, not a delta. Un-hearting is the same
        call with that key absent, which makes a lost request unable to leave
        the two sides disagreeing about what was marked.


        When this submission intersects the partner's marks, the pair has
        agreed: `agreed` is true and the board moves to the paying step. An
        intersection of MORE than one venue is not resolved here — the keys
        come back in `overlapCandidates` and the caller picks one with
        `/confirm`. Hearting the reserved `__keep__` key proposes keeping the
        original venue; agreeing on it settles nothing and costs nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, keys]
              properties:
                matchId: { type: string, format: uuid }
                keys:
                  type: array
                  maxItems: 30
                  description: >
                    Every venue key currently hearted. A key is the venue's
                    Google place id, or `name|address` for a row without one,
                    or the reserved `__keep__`.
                  items: { type: string }
      responses:
        "200":
          description: Accepted; says whether this closed an agreement
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueLikeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: >
            A premium-tier venue was hearted while neither participant has an
            active subscription. The client opens the paywall.
        "403":
          description: Not a participant, or the feature is off
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/venue-change/confirm:
    post:
      tags: [date]
      operationId: confirmVenueAgreement
      summary: Resolve an agreement when more than one venue overlapped
      description: >
        Both sides hearted several of the same places; this picks which one the
        change is for. Only a key from `overlapCandidates` is accepted — the
        server re-derives the overlap rather than trusting the client to have
        sent a venue both sides actually marked.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, key]
              properties:
                matchId: { type: string, format: uuid }
                key: { type: string }
      responses:
        "200":
          description: >
            Done. Since 2026-09-14 the body also carries `kept` (boolean, as in
            `VenueLikeResult`): true when the venue picked was `__keep__`, so
            the original venue stays and nothing is paid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: The chosen venue is premium and the pair is not.
        "403":
          description: Not a participant, or the feature is off
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Those two did not both mark this venue, or the board moved on.

  /v1/venue-change/keep-original:
    post:
      tags: [date]
      operationId: keepOriginalVenue
      summary: "\"Actually, let's keep the place we were given\""
      description: >
        The explicit way back, at any point before a change is paid for. It is
        deliberately not a veto: what it does depends on where the board is.
        After an agreement it calls that agreement off. While the partner is
        still suggesting places it withdraws the caller's own marks and tells
        the partner, once, that the caller would rather keep the venue — their
        suggestions stay live, because this is voicing a preference, not
        overruling one (`toldPartner` is then true). With nobody suggesting
        anything it quietly closes the session.


        The original venue is never mutated by a change that has not settled,
        so dropping the change IS the restore.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId]
              properties:
                matchId: { type: string, format: uuid }
      responses:
        "200":
          description: Done; says whether the partner was told
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueKeepResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not a participant, or the feature is off
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/venue-change/offer-pay:
    post:
      tags: [date]
      operationId: offerPartnerPay
      summary: Ask the partner to lock in the agreed venue
      description: >
        Available only when the board state says `canOfferPartner`. Sends the
        partner a single card asking them to settle the change, and hands them
        the decision — the caller is then waiting on someone else, which is
        what `offerSent` on the board state reflects. One shot per agreement:
        a second call answers 409 rather than sending a second card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId]
              properties:
                matchId: { type: string, format: uuid }
      responses:
        "200":
          description: Done
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not the caller's to offer, or the feature is off
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already offered, or the board is no longer agreed.
        "502":
          description: >
            The card never reached the partner. The one-shot stamp is released,
            so the client may honestly say "not sent — try again" rather than
            claiming it landed.

  /v1/venue-change/appstore/transaction:
    post:
      tags: [date]
      operationId: reportVenueChangePurchase
      summary: Settle an agreed change from a StoreKit purchase
      description: >
        The native app's till. The Telegram product pays for a change in Stars;
        an iOS app may not offer that rail for a digital good (App Store
        guideline 3.1.1), so the same change is sold as a StoreKit consumable
        and reported here. The product id to buy is `venueChangeProduct` from
        `GET /v1/app/config` — never hard-code it, or the app can take money
        for a product this server will refuse.


        Send `transaction.jwsRepresentation`; the server verifies it against
        the App Store Server API and settles the match's agreed change. Call
        `transaction.finish()` only after a 2xx, so a purchase that was never
        reported is re-sent on the next launch — reporting is idempotent, so
        that costs nothing.


        **409 means the money was taken and the change could not be applied** —
        the partner settled or the session lapsed in the moment between. Finish
        the transaction anyway (retrying returns the same 409 forever) and say
        plainly that it could not be applied and will be refunded. It is parked
        for a manual refund and the founder is alerted; never present it as a
        refund that has already happened.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jws, matchId]
              properties:
                jws:
                  type: string
                  maxLength: 20000
                  description: StoreKit 2 `Transaction.jwsRepresentation`.
                matchId: { type: string, format: uuid }
      responses:
        "200":
          description: Settled, or already settled by an earlier report of the same purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VenueChangePurchaseAck" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The venue-change feature is off on this server.
        "409":
          description: >
            Verified and charged, but the change was no longer there to claim.
            Parked for a manual refund.
        "422":
          description: >
            Apple rejected the transaction — unknown, revoked, another
            account's, or not the venue-change product.
        "503":
          description: App Store verification is unavailable or unconfigured; retry later.

  /v1/prime-time/appstore/transaction:
    post:
      tags: [date]
      operationId: reportPrimeTimePurchase
      summary: Open the evening band for one date from a StoreKit purchase
      description: >
        The native app's till for the Prime Time pass. The Telegram product
        sells it in Stars; an iOS app may not offer that rail for a digital good
        (App Store guideline 3.1.1), so the same pass is sold as a StoreKit
        consumable and reported here. The product id to buy is
        `primeTimeProduct` from `GET /v1/app/config` — never hard-code it — and
        the purchase exists only while `features.primeTimePass` is true.


        Before buying, re-read `GET /v1/matches/{id}/calendar` and buy only
        while `primeTime.locked` is still true: the partner may have opened the
        band in the meantime, and a purchase that finds it open is money taken
        for nothing (see 409). The unlock is per MATCH — one pass opens the band
        for both people.


        Send `transaction.jwsRepresentation`; the server verifies it against the
        App Store Server API and opens the band exactly once. Reporting is
        idempotent: a re-report of the same transaction gets the same answer the
        first report got. Call `transaction.finish()` on 200, 409, and a 400/422
        other than `unknown_product`; leave it unfinished on everything else so
        it is re-sent on the next launch.


        **409 means the money was taken and the pass was not applied** — the
        partner opened the band, the pair locked a date, or the caller is not in
        this match, in the moment between. The client MUST finish the
        transaction and promise a manual refund, never claim the band was
        bought. It is parked for a manual refund and the founder is alerted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jws, matchId]
              properties:
                jws:
                  type: string
                  maxLength: 20000
                  description: StoreKit 2 `Transaction.jwsRepresentation`.
                matchId: { type: string, format: uuid }
      responses:
        "200":
          description: The band is open for the pair — now, or by an earlier report of the same purchase.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrimeTimePurchaseAck" }
        "400":
          description: >
            `Missing jws`, `Invalid transaction payload` or `Missing matchId` —
            a malformed request; retrying it cannot help.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: The pass rail is off on this server (or Prime Time itself is).
        "409":
          description: >
            Money taken, pass not applied — client MUST finish the transaction
            and promise a manual refund, never claim the band was bought.
            `code`: `already_unlocked` (Premium on either side, the partner's
            pass, or an evening already held), `match_closed` (the pair locked a
            date or the match ended), `not_participant`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStoreRefusal" }
        "422":
          description: >
            Apple rejected the transaction. `code`: `unknown_transaction`,
            `wrong_bundle`, `unknown_product`, `revoked`, `wrong_owner`.
            `unknown_product` means this server does not know the product id
            (a configuration mismatch, not the buyer's fault) — keep the
            transaction unfinished; every other code is final.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AppStoreRefusal" }
        "503":
          description: >
            `App Store verification not configured`, or Apple (or an earlier
            report of the same purchase) is still in flight — retry later.

  /v1/radar/state:
    get:
      tags: [radar]
      operationId: getRadarState
      summary: Whether the caller can take Type Radar, and whether they have
      description: >
        Read this before offering the radar. `available: false` carries the
        same reason the deck would refuse with, so the client can hide the
        entry instead of opening a screen that cannot be filled.


        `completedAt` is stamped by a submit AND by the Telegram onboarding
        skip button, so it means "the step is behind them". Whether a
        preference vector actually exists is `calibrated`.
      responses:
        "200":
          description: The caller's radar state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarState" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            `type-radar-disabled` — the feature is off on this server; hide the
            entry. `user-not-found` — no account behind the token.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/radar/deck:
    get:
      tags: [radar]
      operationId: getRadarDeck
      summary: The portraits this caller rates
      description: >
        The deck is derived, never asked: the age band from the caller's OWN
        age, the set(s) from their gender preference — `men` → the male set,
        `women` → the female set, `both` → both sets. Twelve cards per set.


        The order is a stable shuffle keyed on the account, so reopening the
        radar — in the app or in the Mini App — shows the same order.


        Cards carry photo ids and reason-chip ids only. The attributes behind a
        photo are resolved server-side and never sent to a client, and chips
        carry no copy: each client owns the localized label per chip id.
      responses:
        "200":
          description: The deck
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarDeckResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            `type-radar-disabled` (feature off) or `user-not-found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: >
            `profile-not-ready` — age or gender preference not collected yet;
            `band-not-live` — no portrait set is deployed for the caller's age
            band (only band `a`, age ≤ 28, is live).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /v1/radar/submit:
    post:
      tags: [radar]
      operationId: submitRadar
      summary: Save the caller's verdicts for the whole deck
      description: >
        **Once, at the end, with every answer.** The client owns the deck —
        taking a card back is a local edit, which is only possible because
        nothing is written per tap. A partial array is accepted (any non-empty
        valid subset), but a client that closes the deck early should send
        nothing rather than a fragment.


        The server compiles one preference vector per rated set and MERGES it
        over what is stored (a retake that rates only one set of a `both` deck
        keeps the other set's vector); the verdict log itself is replaced.
        Photos outside the caller's set(s) and unknown ids are skipped silently;
        for a repeated photo the first answer wins.


        Always allowed again — a retake re-stamps `completedAt`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarSubmitPayload" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarSubmitResult" }
        "400":
          description: >
            `no-answers`, `too-many-answers` (over 40), `invalid-answer`,
            `invalid-verdict`, or `no-valid-answers` (nothing survived the
            set filter).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: >
            `type-radar-disabled` (feature off) or `user-not-found`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: "`profile-not-ready` — age or gender preference not collected yet."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 access token from /v1/auth/otp/verify or /v1/auth/refresh

  parameters:
    MatchId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Invalid payload
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing/invalid access token
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Current match state does not allow the operation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RateLimited:
      description: Rate limit exceeded
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    RhythmActivity:
      type: string
      enum: [calm, moderate, active]
      description: >-
        Median daily steps over the covered days: calm < 5 000, moderate
        5 000–9 999, active ≥ 10 000 (wheelchair pushes count as steps).
    RhythmUpload:
      type: object
      additionalProperties: false
      required: [algoVersion, windowDays, coverageDays, activity, chronotype, source, consentVersion]
      properties:
        algoVersion: { type: integer, const: 1 }
        windowDays: { type: integer, const: 28 }
        coverageDays:
          type: integer
          minimum: 10
          maximum: 28
          description: Days in the window that carried step data.
        activity: { $ref: "#/components/schemas/RhythmActivity" }
        chronotype:
          type: [string, "null"]
          description: >-
            `early` | `intermediate` | `late`, or null when fewer than six days
            could place a midpoint. The midpoint of the day's movement (10 %–90 %
            of cumulative steps), median over weekend days when there are ≥ 4,
            else all days: early < 13:30, intermediate 13:30–15:59, late ≥ 16:00.
        source: { type: string, enum: [healthkit] }
        consentVersion:
          type: string
          enum: ["2026-09-25"]
          description: The consent sheet version the person accepted.
    AfterDatePlace:
      type: object
      required: [name, lat, lng, walkMinutes]
      properties:
        name: { type: string }
        lat: { type: number }
        lng: { type: number }
        walkMinutes: { type: integer, minimum: 1 }
    OwnRhythm:
      type: object
      required: [activity, chronotype, coverageDays, syncedAt, consentedAt]
      properties:
        activity: { $ref: "#/components/schemas/RhythmActivity" }
        chronotype:
          type: [string, "null"]
          description: "`early` | `intermediate` | `late`, or null."
        coverageDays: { type: integer }
        syncedAt: { type: string, format: date-time }
        consentedAt: { type: string, format: date-time }
    Ok:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
      additionalProperties: true

    RadarState:
      type: object
      required: [ok, available, calibrated]
      properties:
        ok: { type: boolean, const: true }
        available:
          type: boolean
          description: The caller can take the radar now (`GET /v1/radar/deck` would serve a deck).
        unavailableReason:
          type: string
          description: >
            Present only when `available` is false: `profile-not-ready` or
            `band-not-live`. A documented string rather than an enum, so a
            reason added later does not break decoding.
        completedAt:
          type: string
          format: date-time
          description: >
            When the step was last put behind the caller — by a submit or by
            the Telegram skip button. Absent if never.
        calibrated:
          type: boolean
          description: A preference vector exists — the radar was submitted at least once, not only skipped.

    RadarDeckResponse:
      type: object
      required: [ok, band, cards]
      properties:
        ok: { type: boolean, const: true }
        band:
          type: string
          description: The caller's age band — `a` (≤ 28), `b` (29–37) or `c` (≥ 38).
        cards:
          type: array
          description: In display order.
          items: { $ref: "#/components/schemas/RadarPortrait" }

    RadarPortrait:
      type: object
      required: [photoId, set, image, imageUrl, chips]
      properties:
        photoId:
          type: string
          description: Stable portrait id (e.g. `fp1`). The only thing a client sends back.
        set:
          type: string
          description: "`female` or `male` — which set the portrait belongs to."
        image:
          type: string
          description: Path relative to the Mini App origin (`radar/<band>/<photoId>.jpg`).
        imageUrl:
          type: string
          format: uri
          description: >
            The same file as an absolute URL. Portraits are static files served
            with the Mini App bundle, not by this API host, and need no
            authorization.
        chips: { $ref: "#/components/schemas/RadarReasonChips" }

    RadarReasonChips:
      type: object
      description: >
        Reason chips offered for THIS portrait after each verdict. Scoped per
        photo: `beard` only on a bearded man, `tattoo` only on a tattooed
        person. Ids today — like: `face`, `hair`, `style`, `tattoo`, `beard`,
        `wholeVibe`; dislike: `face`, `hair`, `style`, `tattoo`, `beard`,
        `tooFlashy`, `badPhoto`. Show an unknown id's raw value rather than
        dropping it.
      required: [like, dislike]
      properties:
        like:
          type: array
          items: { $ref: "#/components/schemas/RadarChip" }
        dislike:
          type: array
          items: { $ref: "#/components/schemas/RadarChip" }

    RadarChip:
      type: object
      required: [id]
      properties:
        id: { type: string }

    RadarSubmitPayload:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          minItems: 1
          maxItems: 40
          items: { $ref: "#/components/schemas/RadarFeedbackItem" }

    RadarFeedbackItem:
      type: object
      required: [photoId, verdict]
      properties:
        photoId: { type: string }
        verdict:
          type: string
          description: "`like` (\"my type\") or `dislike` (\"not my type\")."
        chipId:
          type: string
          maxLength: 40
          description: >
            At most ONE reason, from that portrait's chips for this verdict.
            Omit (or null) for no reason.

    RadarSubmitResult:
      type: object
      required: [ok, counted, completedAt]
      properties:
        ok: { type: boolean, const: true }
        counted:
          type: integer
          description: Answers kept after filtering.
        completedAt: { type: string, format: date-time }

    ScratchMap:
      type: object
      required: [optIn, exploredTiles, exploredPercent, discoveredVenues]
      properties:
        optIn:
          type: boolean
          description: Whether this person has authorised collection at all.
        exploredTiles:
          type: array
          description: >
            Geohash precision-6 tiles, sorted and unique. A neighbourhood each,
            and nothing narrower is representable.
          items: { type: string }
        exploredPercent:
          type: number
          description: >
            Share of the caller's own city, in [0..1]. The denominator is a
            constant of the CITY, not of the data — derived from visited tiles
            it would move everyone's number whenever a stranger walked
            somewhere new.
        discoveredVenues:
          type: array
          description: >
            Google Place ids of venues a verified Date Bump recorded. Place
            ids rather than catalog row ids: the catalog holds several rows per
            real venue, so a row id would give two people who sat in the same
            café different histories.
          items: { type: string }

    FrequentPlaces:
      type: object
      required: [optIn, places]
      properties:
        optIn:
          type: boolean
          description: Whether collection and the block are on. On by default.
        places:
          type: array
          description: >
            Shown places first (best first, at most three, at most two of one
            category), then the ones the caller hid. Empty while opted out.
          items: { $ref: "#/components/schemas/FrequentPlace" }

    FrequentPlace:
      type: object
      required: [placeId, name, category, visits, hidden]
      properties:
        placeId:
          type: string
          description: >
            Google Place id — the catalog's identity for a real place. Never a
            catalog row id: the catalog holds several rows per place.
        name: { type: string }
        category:
          type: string
          description: >
            `cafe` | `coffee_shop` | `restaurant` | `lounge` | `museum`. A string
            rather than an enum so a category added later does not break
            decoding in a shipped build.
        visits:
          type: integer
          description: Distinct days with a visit in the last 180 days. The owner's alone.
        hidden:
          type: boolean
          description: >
            Hidden by the caller. Kept in this list so it can be brought back;
            never shown to the match.

    PartnerFrequentPlace:
      type: object
      required: [placeId, name, category]
      description: >
        One of the partner's frequently visited places — a name, a category, the
        venue's catalog coordinates and, when the catalog has one, a thumbnail
        of the venue; nothing else: no visit count, no day, no position of the
        partner.
      properties:
        placeId: { type: string }
        name: { type: string }
        category:
          type: string
          description: Same vocabulary as `FrequentPlace.category`.
        latitude:
          type: number
          format: double
          description: >
            Latitude of the VENUE's catalog point, WGS84 degrees (founder
            decision 2026-09-14): the public place that `name` and `placeId`
            already identify, taken from the same catalog row as `name` — never
            the partner's position, a fix or any other coordinate. Present
            together with `longitude` or not at all: both are ABSENT (never
            null) when that catalog row has no usable point. Not in `required`,
            so a build that reads it keeps decoding a server that predates it.
        longitude:
          type: number
          format: double
          description: >
            Longitude of the VENUE's catalog point, WGS84 degrees (founder
            decision 2026-09-14); the pair of `latitude`, with the same source
            and the same rule — both present or both ABSENT (never null), never
            the partner's position.
        thumbnailUrl:
          type: string
          format: uri
          description: >
            The place's catalog photo at 240 px (founder decision 2026-09-13):
            an absolute signed link to `/v1/venues/{id}/photo`, the same device
            and width as `ShowcaseVenue.thumbnailUrl` — valid for at least a
            day, identical for every response served that UTC day, the venue id
            in the PATH so a cache keyed by host + path keeps one entry per
            place. Needs no Authorization header. ABSENT (never null) when the
            catalog has no photo for the place; not in `required`, so a build
            that reads it keeps decoding a server that predates it.

    FrequentPlaceFences:
      type: object
      required: [optIn, cityKey, policy, fences]
      properties:
        optIn: { type: boolean }
        cityKey:
          type: [string, "null"]
          description: The city the fences are for.
        policy: { $ref: "#/components/schemas/FrequentPlacePolicy" }
        fences:
          type: array
          items: { $ref: "#/components/schemas/FrequentPlaceFence" }

    FrequentPlacePolicy:
      type: object
      required: [maxAccuracyM, fixMaxAgeSeconds, probeIntervalSeconds]
      properties:
        maxAccuracyM:
          type: number
          description: Drop a fix whose horizontal accuracy is worse than this, in metres.
        fixMaxAgeSeconds:
          type: integer
          description: Drop a fix older than this by the device's clock.
        probeIntervalSeconds:
          type: integer
          description: Take one more fix this often while the app stays open.

    FrequentPlaceFence:
      type: object
      required: [lat, lng, radiusM]
      properties:
        lat: { type: number }
        lng: { type: number }
        radiusM:
          type: number
          description: The server's own radius for the place's category, in metres.

    VenueBoardState:
      type: object
      required:
        - ok
        - status
        - open
        - closedReason
        - original
        - partnerName
        - myLikes
        - peerLikes
        - myAction
        - priceStars
        - canOfferPartner
        - offerSent
        - express
        - expressAvailable
        - restartable
        - changesUsed
        - changesMax
        - pairPremiumActive
        - premiumWouldWaive
        - referralEnabled
      properties:
        ok: { type: boolean }
        status:
          type: string
          description: >
            `none` | `liking` | `agreed` | `settled` | `lapsed`. A documented
            string rather than an `enum`, for the same reason as the canvas
            state: a value added on the server must not fail decoding in an App
            Store build that cannot be rolled back.
        open:
          type: boolean
          description: Whether hearting and confirming are allowed right now.
        closedReason:
          type: [string, "null"]
          description: >
            Why the board is shut, when it is: `feature-disabled`,
            `not-participant`, `wrong-state`, `past-cutoff`, `already-changed`,
            `no-venue`. Each deserves its own sentence on screen — "past the
            cutoff" and "you have used both changes" are different news.
        original: { $ref: "#/components/schemas/VenueBoardOriginal" }
        partnerName:
          type: string
          description: The partner's first name; the board captions who marked what.
        myLikes:
          type: array
          description: Venue keys the caller has hearted.
          items: { type: string }
        peerLikes:
          type: array
          description: >
            Venue keys the partner has hearted — the only thing either side
            learns about the other here.
          items: { type: string }
        agreed:
          # OPTIONAL rather than a nullable union, and that is load-bearing:
          # `oneOf: [$ref, "null"]` is the shape swift-openapi-generator drops
          # in silence (same trap as `pending` on /v1/me/feedback/pending). The
          # server still sends an explicit `null` while nothing is agreed; an
          # optional property decodes that to absent, so the wire is unchanged
          # and the property actually exists in the generated client.
          $ref: "#/components/schemas/VenueBoardAgreed"
        myAction:
          type: [string, "null"]
          description: >
            What the caller may do about payment: `pay`, `pay_or_decline`,
            `pay_or_offer`, `wait`, or null when there is nothing to do. This
            is the payer matrix resolved server-side — never re-derive it from
            gender on the client.
        priceStars:
          type: [integer, "null"]
          description: >
            Stars price, set ONLY when the caller has a paying action. The
            native client does not charge Stars and shows StoreKit's price
            instead; this stays useful as "is this step a paid one".
        canOfferPartner: { type: boolean }
        offerSent: { type: boolean }
        express: { type: boolean }
        expressAvailable: { type: boolean }
        settled:
          # Optional for the same reason as `agreed` above.
          $ref: "#/components/schemas/VenueBoardSettled"
        restartable:
          type: boolean
          description: >
            A finished session can be started over, so the client offers
            "change again" instead of a dead end. Deliberately not the same as
            `open`: the board must not reappear underneath a success screen the
            person is still reading, so a restart takes an explicit tap.
        changesUsed: { type: integer }
        changesMax: { type: integer }
        pairPremiumActive:
          type: boolean
          description: >
            Either participant has an active subscription, which unlocks
            premium-tier venues for the pair.
        premiumWouldWaive:
          type: boolean
          description: >
            The caller is at a paying step and is not premium — the moment to
            show "with Premium this change is free".
        referralEnabled:
          type: boolean
          deprecated: true
          description: >-
            Always false. It drove an "invite a friend instead" link on this
            Premium funnel, where referral may never appear (decision
            2026-09-22). Kept because shipped clients require the field.

    VenueBoardOriginal:
      type: object
      required: [name, address, mapsUri, photoRefs, photoUrl, thumbnailUrl]
      properties:
        name: { type: [string, "null"] }
        address: { type: [string, "null"] }
        mapsUri: { type: [string, "null"] }
        photoRefs:
          type: array
          description: >
            Google Places photo resource names. The Mini App resolves these
            itself; a native client should use the signed links below instead.
          items: { type: string }
        photoUrl:
          type: [string, "null"]
          description: >
            Card photo, 1200 px: an absolute signed link, valid for at least a
            day and byte-identical for every poll within that UTC day, so the
            board's four-second polling cannot defeat an image cache. The photo
            reference is in the PATH, so a cache keyed by host + path keeps one
            entry per venue across re-signing.
        thumbnailUrl:
          type: [string, "null"]
          description: Map-pin photo, 240 px; same signing as `photoUrl`.
        photoUrls:
          type: array
          description: >
            Every photo in `photoRefs` order, 1200 px, signed like `photoUrl`
            (whose link is the first entry). The Mini App's gallery reads this
            rather than putting its initData into an image URL. Optional — added
            2026-09-14.
          items: { type: string }
        profile:
          $ref: "#/components/schemas/ShowcaseVenue"
          description: >-
            The pinned card's place sheet — the same object as
            `VenueChangeVenue.profile`, for the venue the pair was given (found
            by its place id, else by name + address). Null (sent explicitly)
            when the catalog holds no active row for it. Served from a
            minutes-long server cache, so the four-second poll does not re-read
            the catalog, and its links are day-stable like `photoUrl`. OPTIONAL
            rather than `oneOf: [$ref, "null"]` for the reason given on
            `VenueChangeVenue.profile`: that shape never reaches the generated
            Swift client. Added 2026-09-22.

    VenueBoardAgreed:
      type: object
      required: [key, name, address, mapsUri, expiresAt]
      properties:
        key: { type: string }
        name: { type: string }
        address: { type: string }
        mapsUri: { type: [string, "null"] }
        expiresAt:
          type: [string, "null"]
          format: date-time
          description: When the unpaid agreement lapses back to the original venue.

    VenueBoardSettled:
      type: object
      required: [name, address, mapsUri, peerPaid]
      properties:
        name: { type: string }
        address: { type: string }
        mapsUri: { type: [string, "null"] }
        peerPaid:
          type: boolean
          description: The partner covered it — the "he/she got this ❤️" reveal.

    VenueChangeCatalog:
      type: object
      required: [ok, venues]
      properties:
        ok: { type: boolean }
        venues:
          type: array
          items: { $ref: "#/components/schemas/VenueChangeVenue" }

    VenueChangeVenue:
      type: object
      required:
        - key
        - source
        - placeId
        - name
        - address
        - lat
        - lng
        - mapsUri
        - category
        - tier
        - distanceKm
        - photoRefs
        - photoUrl
        - thumbnailUrl
        - rating
        - userRatingCount
        - editorialSummary
      properties:
        key:
          type: string
          description: >
            What `/like` and `/confirm` take for this venue. The server derives
            it (`placeId`, or `name|address` for a row without one) precisely so
            no client has to: a board whose keys disagree with the server's
            cannot record a single mark. Treat it as opaque.
        source:
          type: string
          description: >
            `curated` (our own catalog) or `places` (the Google fallback, used
            when the curated pool in range is thin). Decides which display
            fields can be present at all.
        placeId: { type: [string, "null"] }
        name: { type: string }
        address: { type: string }
        lat: { type: number }
        lng: { type: number }
        mapsUri: { type: [string, "null"] }
        category:
          type: string
          description: >
            A catalog category — `cafe`, `coffee_shop`, `restaurant`, `park`,
            `lounge` today. A documented string, not an `enum`: a category
            added on the server must not fail decoding in a shipped build.
        tier:
          type: string
          description: >
            `base` or `premium`. A premium venue is shown to everyone and
            selectable only while `pairPremiumActive` — the lock is what the
            subscription sells, so hiding it would remove the reason to buy.
            Enforced server-side regardless of what the client renders.
        distanceKm:
          type: number
          description: Great-circle distance from the venue the pair was given, to 0.1 km.
        photoRefs:
          type: array
          description: Places photo resource names; the Mini App's route to imagery.
          items: { type: string }
        photoUrl:
          type: [string, "null"]
          description: Card photo, 1200 px, signed — see `VenueBoardOriginal.photoUrl`.
        thumbnailUrl:
          type: [string, "null"]
          description: Map-pin photo, 240 px, signed.
        photoUrls:
          type: array
          description: >
            Every photo in `photoRefs` order, 1200 px, signed — see
            `VenueBoardOriginal.photoUrls`. Optional — added 2026-09-14.
          items: { type: string }
        rating: { type: [number, "null"] }
        userRatingCount: { type: [integer, "null"] }
        editorialSummary:
          type: [string, "null"]
          description: Google's short blurb, when the row has one.
        profile:
          $ref: "#/components/schemas/ShowcaseVenue"
          description: >-
            The place sheet this card opens: the city guide's profile of the
            same place — the very object `GET /v1/venues/showcase` serves
            (`ShowcaseVenue`, same server serializer): opening hours +
            `utcOffsetMinutes`, the gallery (`photoUrls`, at most 10),
            `priceLevel`, `vibeTags`, `editorialSummary`, `rating` /
            `userRatingCount`, `mapsUri`. Found by this card's `key` among the
            ACTIVE catalog rows of any tier, so the board-only `alternative`
            places that the guide's list leaves out get one too. Null (sent
            explicitly) when the catalog holds no such row — a Places-fallback
            venue nobody catalogued, or a hand-entered pick. Added 2026-09-22.


            Its photo links are the guide's (`/v1/venues/{id}/photo[/slot]`),
            not this card's `/v1/venue-change/photo/{token}`: signed the same
            way (an HMAC over the subject, the width and the shared
            day-rounded expiry; the subject in the PATH) and, like the card's,
            needing no Authorization header — so a client on either rail loads
            them as they are. `profile.photoUrls[0]` is therefore a different
            URL for the same picture as `photoUrl`. A profile with no photos
            (`photoUrls: []`) means the catalog's nightly scan has not reached
            the row yet; draw the card's own `photoUrls` then.


            OPTIONAL rather than a nullable union, and that is load-bearing:
            `oneOf: [$ref, "null"]` is the shape swift-openapi-generator SKIPS
            in silence (same trap as `VenueBoardState.agreed` and
            `/v1/me/feedback/pending`). An optional property decodes the
            explicit JSON `null` to nil, so the wire keeps saying null and the
            property actually exists in the generated client — and a client
            built from this spec still reads a server that predates it.

    VenueLikeResult:
      type: object
      required: [ok, agreed, overlapCandidates]
      properties:
        ok: { type: boolean }
        agreed:
          type: boolean
          description: This submission closed an agreement — the board moves to paying.
        kept:
          type: boolean
          description: >
            The agreement is to KEEP the original venue (both sides hearted
            `__keep__`): nothing to pay, and the board closes. False for an
            agreement to change, and whenever `agreed` is false. Optional —
            added 2026-09-14.
        overlapCandidates:
          type: array
          description: >
            Both sides marked more than one of the same venues, so nothing is
            agreed yet: the caller picks one of these with `/confirm`. Empty in
            every other case.
          items: { type: string }

    VenueKeepResult:
      type: object
      required: [ok, toldPartner]
      properties:
        ok: { type: boolean }
        toldPartner:
          type: boolean
          description: >
            The partner was actively suggesting places and has been told, once,
            that the caller would rather keep the venue. False when there was
            nobody to tell.

    VenueChangePurchaseAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    PrimeTimePurchaseAck:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }

    AppStoreRefusal:
      type: object
      required: [error, code]
      description: >
        A StoreKit report the server refused. `code` is machine-readable and
        its values are listed on each response; unknown values must be handled
        as the response status says, not by string.
      properties:
        error: { type: string }
        code: { type: string }

    VenueShowcase:
      type: object
      required: [cityKey, venues]
      properties:
        cityKey:
          type: [string, "null"]
          description: The city the list is for; null when the caller has none.
        venues:
          type: array
          items: { $ref: "#/components/schemas/ShowcaseVenue" }

    ShowcaseVenue:
      type: object
      required:
        - id
        - placeId
        - name
        - address
        - category
        - lat
        - lng
        - editorialSummary
        - vibeTags
        - facetTags
        - utcOffsetMinutes
        - openingHours
        - photoUrl
        - thumbnailUrl
      properties:
        id:
          type: string
          description: Catalog row id of the copy that speaks for this place.
        placeId: { type: [string, "null"] }
        name: { type: string }
        address: { type: string }
        category:
          type: string
          description: >
            A catalog category — `cafe`, `coffee_shop`, `restaurant`, `park`,
            `lounge` today. A documented string rather than an `enum` for the
            same reason as the canvas `state`: a category added on the server
            must not fail decoding in an App Store build that cannot be rolled
            back.
        lat: { type: number }
        lng: { type: number }
        editorialSummary:
          type: [string, "null"]
          description: >
            Google's short description, when the catalog carries one. Usually
            null today — the catalog stopped requesting it to save Places cost —
            so a client must have something else to say (the address).
        vibeTags:
          type: array
          description: Operator vibe tags (`cozy`, `books`, `vinyl`, `view`, …).
          items: { type: string }
        facetTags:
          type: array
          description: Canonical V2 facets (`quiet`, `romantic_public`, …).
          items: { type: string }
        utcOffsetMinutes:
          type: [integer, "null"]
          description: >
            The venue's offset from UTC. Opening hours are its local wall
            clock; without the offset a client cannot say open or closed.
        openingHours:
          type: array
          description: >
            Weekly periods in the venue's local time (day 0 = Sunday), as
            Google reports them. Empty means UNKNOWN — never "closed". A period
            without `close` means open around the clock. The client works out
            "open until …" live from these instead of receiving a verdict,
            because the canvas stays open past the moment a verdict would flip.
          items: { $ref: "#/components/schemas/ShowcaseOpeningPeriod" }
        photoUrl:
          type: [string, "null"]
          description: >
            Card photo, 1200 px wide: an absolute signed link, valid for at
            least a day and identical for every list served that UTC day. The
            venue id is in the PATH (`/v1/venues/{id}/photo`), so a cache keyed
            by host + path keeps one entry per place across re-signing. Needs
            no Authorization header. Null while the catalog has no photo for
            the place.
        thumbnailUrl:
          type: [string, "null"]
          description: The same photo at 240 px, for the map pin. Null exactly when `photoUrl` is.
        photoUrls:
          type: array
          maxItems: 10
          description: >
            The venue profile's gallery: at most 10 photos at 1200 px, signed
            the same way as `photoUrl`, cover first. `photoUrls[0]` is
            byte-for-byte `photoUrl`, so the cover is not downloaded twice; the
            rest carry their slot in the PATH (`/v1/venues/{id}/photo/{slot}`,
            slot 1…9). Every photo fetched is a billed Places request, so a
            client loads the gallery when the profile opens, not with the list.
            Empty exactly when `photoUrl` is null.


            Not in `required`, like the four fields below (added 2026-09-15):
            a client built from this spec must still read a server that
            predates them. The server always sends them.
          items: { type: string }
        priceLevel:
          type: [string, "null"]
          description: >
            Google's price level in the product's words — `free`,
            `inexpensive`, `moderate`, `expensive`, `very_expensive`. A
            documented string rather than an enum, like `category`. Null when
            unknown; there is no price amount (average check) in the catalog.
        rating:
          type: [number, "null"]
          description: Google rating, 1.0–5.0. Null when unknown.
        userRatingCount:
          type: [integer, "null"]
          description: How many Google ratings `rating` is made of. Null when unknown.
        mapsUri:
          type: [string, "null"]
          description: >
            The place's Google Maps page (always `https:`), for the profile's
            secondary "open in Google Maps". Null when the catalog has none.

    ShowcaseOpeningPeriod:
      type: object
      required: [open]
      properties:
        open: { $ref: "#/components/schemas/ShowcaseOpeningPoint" }
        close: { $ref: "#/components/schemas/ShowcaseOpeningPoint" }

    ShowcaseOpeningPoint:
      type: object
      required: [day, hour, minute]
      properties:
        day:
          type: integer
          description: 0 = Sunday … 6 = Saturday.
        hour: { type: integer }
        minute: { type: integer }

    DateStateVenue:
      type: object
      required: [name]
      properties:
        name: { type: string }
        address: { type: [string, "null"] }
        lat: { type: [number, "null"] }
        lng: { type: [number, "null"] }
        mapsUri: { type: [string, "null"] }
        photoUrl:
          type: [string, "null"]
          description: >
            The venue's cover, 1200 px: an absolute signed link an image loader
            takes as-is (no Authorization header), valid for at least a day and
            byte-identical for every poll within that UTC day. Same signing and
            route as `VenueBoardOriginal.photoUrl`. Null when the venue has no
            photo. Optional — added 2026-09-22, so a client still decodes an
            older server's answer.
        thumbnailUrl:
          type: [string, "null"]
          description: >
            The same cover at 240 px; same signing as `photoUrl`. Null when the
            venue has no photo. Optional — added 2026-09-22.

    DateStateBump:
      type: object
      required: [mine, verified]
      properties:
        mine:
          type: boolean
          description: Whether THIS side has already shaken.
        verified:
          type: boolean
          description: >
            Whether the pair is confirmed at the table. The partner's individual
            shake is deliberately not reported — before verification it is the
            only field here that could be read as "they are there and you are
            not", which is the class of claim the radar's masking exists to
            prevent.

    BumpDeck:
      type: object
      required: [topicsForA, topicsForB]
      description: >
        The at-the-table deck, per side, each in that side's own language — the
        same per-side rule the pitch follows. A client renders only its own.
      properties:
        topicsForA:
          type: array
          items: { type: string }
        topicsForB:
          type: array
          items: { type: string }

    DateStateMatch:
      type: object
      required: [id, bump, deck]
      properties:
        id: { type: string, format: uuid }
        agreedTime: { type: [string, "null"], format: date-time }
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: >
            The 24h reply deadline, on a `proposed` match and nowhere else.


            `agreedTime` is null while a pitch is undecided — a time is agreed
            only after both sides say yes — so this is the ONLY clock the
            canvas can count down in the one state whose clock is running.
            Derived by the same function as
            `SerializedMatch.proposalDeadlineAt`.
        venue:
          $ref: "#/components/schemas/DateStateVenue"
        deck:
          type: array
          description: >
            The at-the-table topics for THIS caller, in their own language.
            Empty until the pair's Date Bump verifies.


            It lives here and not only on the bump response because that
            response answers the one call that COMPLETED the pair — the side
            that shook first gets a 200 with no deck, and would otherwise have
            the topics only as notification text.
          items: { type: string }
        bump:
          $ref: "#/components/schemas/DateStateBump"

    AppConfig:
      type: object
      required: [minSupportedIosVersion, supportedCities, features, serverNow]
      properties:
        minSupportedIosVersion:
          type: [string, "null"]
          description: Semver floor; a lower client build must block behind an update screen
        supportedCities:
          type: array
          description: |
            Cities Gennety has launched in. The dating-city step MUST offer only
            these: matching is strictly same-city, so any other city is a pool of
            one. `POST /v1/me/home-location` rejects anything else with
            `city-not-supported`.
          items:
            type: object
            required: [cityKey, city, countryCode, latitude, longitude]
            properties:
              cityKey:
                type: string
                description: Canonical `cc:slug`; the value stored in `homeCityKey`
              city: { type: string }
              countryCode: { type: string }
              latitude: { type: number }
              longitude: { type: number }
        cityCatalog:
          type: array
          description: |
            Every city the first-party catalog knows, launched markets first,
            then the expansion list, grouped by country in display order. Read
            `status`: `active` is a dating city and behaves exactly as
            `supportedCities` does; `waitlist` is a city we have NOT opened —
            it records demand and is never a home location, so
            `POST /v1/me/home-location` keeps rejecting it with
            `city-not-supported`. A client that only implements
            `supportedCities` is still correct, just without a waitlist screen;
            there is currently no `/v1/*` write for joining the waitlist (the
            Telegram Mini App owns that flow).
          items:
            type: object
            required: [cityKey, city, countryCode, latitude, longitude, status]
            properties:
              cityKey:
                type: string
                description: Canonical `cc:slug`
              city: { type: string }
              countryCode: { type: string }
              latitude: { type: number }
              longitude: { type: number }
              status:
                type: string
                enum: [active, waitlist]
        features:
          type: object
          required: [phoneAuth, tickets, coordination]
          properties:
            phoneAuth: { type: boolean }
            telegramAuth:
              type: boolean
              description: >-
                `POST /v1/auth/telegram` is configured. False → hide "Continue
                with Telegram" rather than render a button that can only 503.
            tickets: { type: boolean }
            coordination: { type: boolean }
            premium: { type: boolean }
            referral: { type: boolean }
            promo: { type: boolean }
            profileMusic:
              type: boolean
              description: >-
                Music on the profile. False → hide the section entirely;
                `/v1/me/music` and `/v1/music/search` answer 404.
            spotifyTopTracks:
              type: boolean
              description: >-
                The one-time Spotify top-tracks import is available. False →
                hide "Connect Spotify" and offer search only. Expected to stay
                false: a development-mode Spotify app admits five allow-listed
                accounts.
            venueChange:
              type: boolean
              description: >-
                The venue-change board. False → show no "change the place"
                entry at all: every `/v1/venue-change/*` route answers
                `feature-disabled`, and a button whose only outcome is a
                refusal is not a button.
            primeTimePass:
              type: boolean
              description: >-
                The Prime Time pass can be bought in the app
                (`POST /v1/prime-time/appstore/transaction`). False → the
                locked-slot sheet offers Premium only; the report route answers
                404. Absent on an older server — treat as false.
            tempoSync:
              type: boolean
              description: >-
                Tempo Sync (Apple Health life rhythm). False → show no "Connect
                Apple Health" row and no "Твой темп" card, and never ask
                HealthKit for anything; `/v1/me/rhythm` answers 404. Absent on an
                older server — treat as false.
        venueChangeProduct:
          type: [string, "null"]
          description: >-
            The StoreKit consumable that buys one venue change, for the same
            reason the ticket ladder above is served: the app must never offer
            a product id this server will refuse to credit. Matches the full
            App Store id or its last dot-segment. Null while the board is off.
        primeTimeProduct:
          type: [string, "null"]
          description: >-
            The StoreKit consumable that opens the evening band for one date,
            served for the same reason as `venueChangeProduct`. Matches the full
            App Store id or its last dot-segment. Null whenever
            `features.primeTimePass` is false.
        ticketProducts:
          type: array
          description: |
            The StoreKit consumable ladder, in ladder order. Served from here
            rather than hard-coded in the app because the server decides how
            many tickets a product credits; a product id the app knows and the
            server does not is a purchase that takes money and then 422s on
            report. Empty while tickets are off.
          items:
            type: object
            required: [productId, tickets]
            properties:
              productId:
                type: string
                description: Matches the full App Store id or its last dot-segment.
              tickets: { type: integer, minimum: 1 }
        serverNow: { type: string, format: date-time }

    ReferralState:
      type: object
      description: >-
        Tickets only since 2026-09-22 — the ladder of tickets + Premium months
        and every dollar value were removed.
      required:
        - inviteLink
        - verifiedCount
        - earnedTickets
        - pendingTickets
        - ticketsPerFriend
        - inviteeTickets
        - rewardCap
        - rewardsLeft
      properties:
        inviteLink: { type: string }
        verifiedCount:
          type: integer
          description: Invited friends who cleared verification through this link
        earnedTickets:
          type: integer
          description: Tickets already credited to this user by the program
        pendingTickets:
          type: integer
          description: >-
            Tickets earned but held by the daily velocity cap; credited
            automatically once it allows (no action needed)
        ticketsPerFriend:
          type: integer
          description: Tickets this user earns per friend who clears verification
        inviteeTickets:
          type: integer
          description: >-
            Tickets the invited friend gets when they clear verification (0 when
            the invitee side is off)
        rewardCap:
          type: integer
          minimum: 1
          description: Lifetime number of friends that can earn this user a reward
        rewardsLeft:
          type: integer
          minimum: 0
          description: How many more friends can still earn this user a reward

    AgentAction:
      description: >-
        What the client must put on screen after the agent's text. The agent
        never runs a sensitive flow itself — it hands over the same control the
        menu would have shown, so the guarded handler, its confirmation copy and
        its nonces stay the single implementation.
      oneOf:
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [premium_cancel_confirm] }
        - type: object
          required: [kind]
          properties:
            kind: { type: string, enum: [premium_cancel_appstore] }
        - type: object
          required: [kind, entry]
          properties:
            kind: { type: string, enum: [entry_point] }
            entry:
              type: object
              required: [label]
              properties:
                label:
                  type: string
                  description: Already localised server-side; never model-authored
                callbackData:
                  type: string
                  description: An EXISTING product callback; the agent cannot invent one
                url:
                  type: string
                  description: >-
                    Mini App address, for boards that have no callback at all
                    (venue change). Exactly one of `callbackData` and `url` is
                    present, and the server builds both — the model names a
                    screen, never an address.

    Language:
      type: string
      enum: [en, ru, uk, de, pl]

    UserStatus:
      type: string
      enum: [onboarding, active, paused, frozen, suspended, pending_investigation, banned]

    OnboardingStep:
      type: string
      enum: [consent, language, conversational, completed]

    MatchRadius:
      type: string
      enum: [campus_only, citywide]

    Theme:
      type: string
      enum: [light, dark]
      description: |
        EFFECTIVE colour theme — what the app paints and what the server bakes
        into the Telegram match / date PNG cards. Two-valued on purpose: a
        rendered PNG has no "follow the device" to follow.

        On `SerializedUser` this is what the app should be painting RIGHT NOW,
        and what the cards are already painted in. The client reconciles: if
        what it renders differs, it PATCHes the difference up. That is the only
        reason a card matches an app set to follow the phone.

    ThemeMode:
      type: string
      enum: [system, light, dark]
      description: |
        How the effective theme was CHOSEN. The native client offers the
        platform-standard third state; `system` never reaches a renderer,
        because the client resolves it and reports the result in `theme`.

        On `SerializedUser` this is which option the Settings picker checks.
        `theme` alone could not tell "follow the phone, which happens to be
        dark" from "dark", and those diverge the moment the phone flips.

    VerificationStatus:
      type: string
      enum: [unverified, pending, pending_review, verified, rejected]

    LivenessCredentials:
      type: object
      description: |
        Short-lived AWS credentials for the on-device Face Liveness detector,
        minted per session behind this API's own auth. Server-clamped to
        `rekognition:StartFaceLivenessSession`; hand them straight to the
        detector's credentials provider and never persist them.
      required: [accessKeyId, secretAccessKey, sessionToken, expiration]
      properties:
        accessKeyId: { type: string }
        secretAccessKey: { type: string }
        sessionToken: { type: string }
        expiration: { type: string, format: date-time }

    MatchStatus:
      type: string
      enum: [proposed, negotiating, negotiating_venue, scheduled, cancelled, completed, expired]

    SerializedUser:
      type: object
      description: Mirrors `serializeUser` in `public/routes/serializers.ts`
      required:
        [id, email, universityDomain, firstName, surname, age, gender, preference,
         major, language, theme, themeMode, status, onboardingStep, termsAccepted,
         researchOptIn, ticketBalance]
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, "null"] }
        universityDomain: { type: [string, "null"] }
        firstName: { type: [string, "null"] }
        surname: { type: [string, "null"] }
        age: { type: [integer, "null"] }
        gender:
          type: [string, "null"]
          description: |
            `male` | `female`. Null until onboarding collects it.

            Nullable SCALAR, not `oneOf: [$ref Gender, "null"]` — see
            `SerializedMatch.partnerGender` for the reasoning. These three
            properties ARE the case that comment names: they were declared in
            the unsupported shape, the generator dropped all three silently,
            and iOS shipped without ever being able to read its own user's
            gender, preference or language. Fixed at the source 2026-08-10.

            The wire format does not change — the server sends the same value
            or an explicit `null`, and the Mini App reads it unchanged.
        preference:
          type: [string, "null"]
          description: "`men` | `women` | `both`. Null until onboarding collects it."
        major: { type: [string, "null"] }
        language:
          type: [string, "null"]
          description: |
            `en` | `ru` | `uk` | `de` | `pl`. The client renders from the
            system locale, but needs this to know what the SERVER will write
            in — a push, a DM, a rendered card.
        # Plain `$ref`, like `status` above and unlike `gender`: these are
        # non-nullable, so the shape the generator silently drops does not
        # arise. Their prose lives on the schemas themselves.
        theme: { $ref: "#/components/schemas/Theme" }
        themeMode: { $ref: "#/components/schemas/ThemeMode" }
        status: { $ref: "#/components/schemas/UserStatus" }
        onboardingStep: { $ref: "#/components/schemas/OnboardingStep" }
        termsAccepted: { type: boolean }
        researchOptIn: { type: boolean }
        ticketBalance:
          type: integer
          description: |
            Date Ticket wallet balance (§3.5b). On the user rather than behind a
            wallet route: the store screen and the gate both need it and the app
            already refetches `/v1/me`. Simply 0 while tickets are off.

    CalendarState:
      type: object
      description: Mirrors `nativeState` in `public/routes/calendar-native.ts`
      required:
        [proposedTimes, mySlots, peerSlots, agreedTime, overlapCandidates,
         timeZone, serverNow]
      properties:
        proposedTimes:
          type: array
          items: { type: string, format: date-time }
          description: |
            Every offerable instant, ascending. Server-owned and identical for
            both sides; a submission outside this set is refused.
        mySlots:
          type: array
          items: { type: string, format: date-time }
        peerSlots:
          type: array
          items: { type: string, format: date-time }
          description: |
            The partner's marks. Not a blind-decision leak: this step is after
            mutual accept, and seeing when they are free is the entire point —
            tapping a slot they already marked agrees the date in one round
            trip.
        agreedTime:
          type: [string, "null"]
          format: date-time
          description: Set the moment exactly one slot is shared.
        overlapCandidates:
          type: array
          items: { type: string, format: date-time }
          description: |
            Non-empty only on a submission that produced MORE than one shared
            slot. Nothing is locked; the actor re-submits one of these alone.
            Always empty on a read.
        timeZone:
          type: [string, "null"]
          description: |
            IANA zone of the pair's dating city. Render the grid in THIS zone,
            not the device's: the slots are instants, and a traveller shown
            them on their own wall clock would agree to a time neither side
            meant. Null for a profile with no city resolved yet — fall back to
            the device zone.
        serverNow:
          type: string
          format: date-time
        primeTime:
          $ref: "#/components/schemas/PrimeTimeState"

    PrimeTimeState:
      type: object
      description: |
        The paid evening band (PRIME_TIME_PRODUCT_SPEC §7/§12). Additive and
        optional: a client that ignores it behaves exactly as before, because
        the server refuses a locked slot regardless of what the client drew.

        Deliberately a resolved ANSWER rather than the inputs behind it. The
        server has already weighed a subscription on either side, a paid pass,
        and a pair the rail cannot reach; a client re-deriving any of that would
        be a second implementation of the gate that can disagree with the first.
      required: [locked, slots, stars]
      properties:
        locked:
          type: boolean
          description: |
            The whole gate. False for a premium pair, a pair that already paid,
            and a pair with no purchase path — draw the grid as you always have.
            An app-only pair has a purchase path only while the App Store pass
            rail is live (`features.primeTimePass`); until then it is never
            locked.
        slots:
          type: array
          items: { type: string, format: date-time }
          description: |
            Which of `proposedTimes` are behind the band — the whole band, sent
            whether or not it is locked. Empty only when the feature itself is
            off.

            **`locked` is the gate; this is just the band.** A pair that HAS
            opened it still receives its slots, so `slots` non-empty with
            `locked: false` is the ordinary shape for a premium pair, not a
            contradiction. Draw the padlock from `locked` and read this list
            only while it is true — the Mini App discards the list outright when
            unlocked, and a client that instead inferred "these are locked" from
            a non-empty list would lock the band for exactly the people who paid
            to open it.

            (Until 2026-08-29 this said "empty whenever `locked` is false",
            which the server has never done — `getCalendarState` fills the band
            from the feature flag alone.)
        stars:
          type: integer
          description: |
            The Telegram Stars price of opening the band for this date. Quoted
            in Stars and never in currency: it is env-tunable, so a figure baked
            into a client goes stale silently on the one screen that asks for
            money. **The Telegram price only — iOS must not show it.** The app
            sells the same pass as a StoreKit consumable (`primeTimeProduct`),
            priced by Apple and shown from `Product.displayPrice`; or the band
            is opened by a subscription, or by the other side of the pair (the
            unlock is per MATCH, so either side opening it opens it for both).

    ProxyChatMessage:
      type: object
      required: [id, mine, body, sentAt]
      properties:
        id:
          type: string
          description: |
            Opaque. Pass the newest one back as `since` to poll for the delta.
        mine:
          type: boolean
          description: |
            Who sent it, and deliberately the ONLY thing said about the sender.
            The client renders two bubble styles and needs nothing more; a
            user id here would be identity the screen has no use for.
        body: { type: string }
        sentAt: { type: string, format: date-time }
        status:
          type: string
          enum: [sent, delivered, read]
          description: |
            How far one's OWN message got. **Present only when `mine` is true** —
            these states are what a sender is told about their own reply, and
            putting one on the partner's message would be telling them about
            themselves.

            Server-computed rather than derived from raw timestamps, because two
            surfaces deriving "read" independently would eventually derive it
            differently, and this is a claim about another person:

            - `sent` — logged to `proxy_messages`, and nowhere else yet.
            - `delivered` — a rail the partner actually has ACCEPTED it: the
              bot's `sendMessage` resolved, or APNs took the push. For a `both`
              partner one accepted rail is enough.
            - `read` — the partner's read cursor is at or past this message.
              The cursor moves only in `readProxyChat`, which only the app calls,
              and only while its chat screen is open.

            **A partner on the Telegram rail never reaches `read`,** and this is
            not a gap: the Bot API gives bots no read receipts, so the honest
            ceiling for that rail is `delivered`. Clients must render the absence
            of `read` as "not known to be read", never as "unread".

            There is no `failed`: a send that fails never becomes a row, so the
            client has an error to show and no status to draw.
        reaction:
          type: string
          enum: ["❤", "👍", "🔥", "🤣", "🙏"]
          description: |
            The emoji the RECIPIENT put on this message. Absent when there is
            none — never `null`, the same rule `status` follows: an explicit
            null would invite a client to draw an empty capsule.

            **Present on either side's message,** unlike `status`. The asymmetry
            is deliberate: a delivery state is what a sender is told about their
            own line, while a reaction is a thing the OTHER person did, and both
            of them see it.

            **One per message, last write wins.** This chat holds exactly two
            people, so a reaction is an answer rather than a tally — "2 👍"
            cannot occur, because nobody may react to their own message.

            **The set is closed, and closed to Telegram's list specifically.**
            Telegram accepts reactions only from its own fixed vocabulary, so
            anything else would work app-to-app and then silently do nothing on
            the rail most pairs actually have. That is also why `❤` carries
            **no** variation selector here: U+2764 alone is the exact string
            Telegram's list holds, and appending U+FE0F would break
            `setMessageReaction`. A client wanting the red glyph appends U+FE0F
            for DISPLAY only. (Same reason the set has 🤣 and not 😂 — Telegram
            has no 😂.)

    PendingFeedback:
      type: object
      description: |
        Mirrors `PendingFeedbackView` in `services/post-date-feedback.ts`.
        Everything here exists so the form can name the date it is about — a
        form arriving a day later with no venue and no partner reads as being
        about nothing in particular.
      required: [matchId, partnerFirstName, venueName, agreedTime, submitted, maxTextLength, serverNow]
      properties:
        matchId: { type: string, format: uuid }
        partnerFirstName: { type: [string, "null"] }
        venueName: { type: [string, "null"] }
        agreedTime: { type: string, format: date-time }
        submitted:
          type: boolean
          description: |
            The form is already answered. The endpoint still returns the date
            rather than 404ing, so a client opening a day-old push lands on
            "thank you" instead of an error. A story told to the concierge or a
            Telegram voice note does not set it: the form stays open after
            either.

            It CANNOT show what was said, and no client should try: the
            structured answers are composed into one prose blob for the
            analyst and are not stored as columns (see `composeFeedbackText`),
            so the slider position that produced it no longer exists anywhere.
            An earlier draft of this description promised a read-only form —
            that promise was never implementable.
        maxTextLength:
          type: integer
          description: |
            `FEEDBACK_MAX_TEXT_LEN`. Served rather than bundled for the same
            reason the proxy chat serves its own: a limit the client believes
            and the server does not is a comment the user types and loses.
        serverNow:
          type: string
          format: date-time
          description: Server clock, for the same skew correction the countdowns use.

    ProfilerBatch:
      type: object
      description: The current Profiler question for the native app. Absent `question` = nothing pending right now.
      properties:
        question:
          $ref: '#/components/schemas/ProfilerQuestion'
        remaining:
          type: integer
          description: Questions left in the current batch INCLUDING `question` (1 = this is the last one).

    ProfilerQuestion:
      type: object
      required: [id, text]
      properties:
        id: { type: string, description: 'Bank id, e.g. f_date_spots' }
        text: { type: string, description: 'Question text in the user language' }

    ProfilerAnswerRequest:
      type: object
      required: [questionId]
      properties:
        questionId: { type: string }
        text: { type: string, description: 'Answer text; trimmed and capped at PROFILER_MAX_ANSWER_LEN (1000). Omit when skip=true.' }
        skip: { type: boolean, description: 'true = the Skip button' }

    ProfilerAnswerResult:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [next, done, paused]
          description: 'next = `question` is the next one in this batch; done = batch finished (answered or skipped the last one, bank exhausted, or a blocking match started); paused = the text was a refusal ("later", "не хочу"…): recorded as a skip and the rest of the batch waits for the next window, exactly as in Telegram.'
        question: { $ref: '#/components/schemas/ProfilerQuestion' }
        remaining: { type: integer, description: 'Questions left INCLUDING `question`' }

    ProxyChatState:
      type: object
      description: Mirrors `chatState` in `public/routes/proxy-chat.ts`
      required:
        [open, opensAt, closesAt, messages, maxMessageLength, partnerFirstName,
         serverNow]
      properties:
        open:
          type: boolean
          description: |
            Whether a message can be sent right now. Derived server-side from
            the window, never from the client's clock — the phone's may be off,
            and the two sides must agree about a window that closes on its own.
        opensAt:
          type: [string, "null"]
          format: date-time
          description: |
            T-1h. Non-null before AND after opening, so a client that renders
            "opens at 19:30" and one that renders a live chat read the same
            field. Null only when this pair has no proxy window at all.
        closesAt:
          type: [string, "null"]
          format: date-time
          description: |
            T+2h. Shown so the pair can see the window is finite; the server
            closes it regardless of what the client does with this.
        messages:
          type: array
          items: { $ref: "#/components/schemas/ProxyChatMessage" }
          description: |
            Ascending by time. The full window on a bare read, only what is
            newer when `since` was passed. Capped at the most recent 200 —
            a window that produced more than that is not a coordination chat.
        maxMessageLength:
          type: integer
          description: |
            `PROXY_MAX_MESSAGE_LEN`. Served rather than bundled for the same
            reason `AppConfig.ticketProducts` is: a limit the client believes
            and the server does not is a message the user types and loses.
        partnerFirstName:
          type: [string, "null"]
          description: |
            Whom the other bubbles are from. The Telegram relay already
            attributes each line by first name, and by this point the pair has
            seen each other's photo, name and age — withholding it here would
            be anonymity theatre, not privacy. "Anonymous" in this feature
            means no contact details are exchanged, not that the partner is
            unnamed.
        serverNow:
          type: string
          format: date-time
          description: |
            Server clock, for the same skew correction the countdowns use: the
            window's edges are the product, so a device clock several minutes
            out must not decide when the composer unlocks.

    TicketHistoryEntry:
      type: object
      description: |
        One movement of the ticket wallet. `delta` is signed: positive rows are
        credits, negative rows are spends. Mirrors `TicketLedger` rows as
        served by `public/routes/tickets-history.ts`.
      required: [id, delta, reason, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: Also the `before` cursor for the page after this row
        delta:
          type: integer
          description: Signed change to the balance; never 0
        reason:
          type: string
          description: |
            Why the balance moved. Today one of `photo_bonus`, `video_bonus`,
            `verification_bonus` (legacy, no new rows), `student_bonus`,
            `welcome_gift`, `referral_reward` (both sides of a referral, since
            2026-09-22), `referral_milestone` (legacy, no new rows), `promo`,
            `bump_bonus`, `store_purchase`, `spend_match`, `refund`.

            Deliberately a plain string and NOT an `enum`: reasons are added
            server-side whenever a product mechanic grants or spends a ticket,
            and swift-openapi-generator turns an `enum` into a closed Swift
            type that THROWS on an unknown value — one additive server change
            would then fail decoding for the whole page. Clients label an
            unrecognised reason neutrally and still show the delta and the
            date, which is the part that has to be right.
          example: store_purchase
        bundleSize:
          type: integer
          description: Bundle bought, for `store_purchase` rows (1 / 3 / 6)
        createdAt: { type: string, format: date-time }

    TicketGateState:
      type: object
      description: Mirrors `nativeState` in `public/routes/ticket-gate.ts`
      required:
        [status, iPaid, partnerPaid, bothPaid, partnerPaidForMe, iCoveredPartner,
         canCoverPartner, partnerFirstName, partnerPhotoUrl, balance, priceCents,
         expiresAt, myPremiumActive, serverNow]
      properties:
        status:
          type: string
          enum: [pending, partial, completed, expired, refunded]
          description: |
            `partial` = exactly one slot settled. `expired`/`refunded` mean the
            window lapsed and the Calendar opened for free — anything paid came
            back.

            These five are the whole public vocabulary. The server's own
            `ticketStatus` column is a wider free-form sub-state machine and is
            projected onto this set at the boundary (`wireTicketStatus`) — its
            transient `refund_pending` is reported as `refunded`, which is what
            it converges to. Clients may treat this enum as closed; widening it
            is a breaking change for any already-shipped build whose generated
            enum is frozen.
        iPaid: { type: boolean }
        partnerPaid: { type: boolean }
        bothPaid: { type: boolean }
        partnerPaidForMe:
          type: boolean
          description: The partner covered THIS caller's ticket — the surprise reveal.
        iCoveredPartner:
          type: boolean
          description: THIS caller covered the partner's ticket.
        myPremiumActive:
          type: boolean
          description: |
            An active Gennety Premium subscription covers this caller's OWN
            slot, so it costs them nothing — the server has already settled it.
            Render the "covered by Premium" plate from this.

            It states the subscription, not the slot: nothing on the row records
            HOW a slot was settled. That is what keeps it honest when a
            subscription lapses after the fact — the flag goes false, the slot
            stays settled (a paid slot is never revoked), and the plate simply
            stops being drawn. Covering the PARTNER is never free; that is still
            one ticket's price, and `canCoverPartner` governs it.
        canCoverPartner:
          type: boolean
          description: |
            Whether `partner`/`both` are offered. Computed server-side on
            purpose: deriving it client-side means hard-coding "men may cover"
            into the app, and the rule is re-validated on `/use` regardless.
        partnerFirstName: { type: [string, "null"] }
        partnerPhotoUrl:
          type: [string, "null"]
          format: uri
          description: Signed, short-lived; same proxy as the pitch photos.
        balance:
          type: integer
          description: The caller's wallet balance — the only rail the gate spends from.
        priceCents:
          type: integer
          description: |
            Per-ticket value anchor for the copy ("your match paid $6.99 for
            you"). NOT a price to charge — iOS charges App Store prices, which
            only StoreKit knows.
        expiresAt: { type: [string, "null"], format: date-time }
        serverNow:
          type: string
          format: date-time
          description: For the same clock-skew correction as `SerializedMatch.serverTimeAt`.

    SerializedProfile:
      type: object
      description: Mirrors `serializeProfile` in `public/routes/serializers.ts`
      required:
        [hobbies, partnerPreferences, psychologicalSummary, ageRangeMin, ageRangeMax,
         photos, matchRadius, standbyCount, latitude, longitude, locationUpdatedAt,
         homeCity, homeCountryCode, homeCityKey, homePlaceId]
      properties:
        hobbies:
          type: array
          items: { type: string }
        partnerPreferences: { type: [string, "null"] }
        psychologicalSummary: { type: [string, "null"] }
        ageRangeMin: { type: [integer, "null"] }
        ageRangeMax: { type: [integer, "null"] }
        photos:
          type: array
          maxItems: 10
          items: { type: string }
          description: Up to 10 opaque storage paths — render via signed URLs from /v1/me/photos
        matchRadius: { $ref: "#/components/schemas/MatchRadius" }
        standbyCount: { type: integer }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        locationUpdatedAt: { type: [string, "null"], format: date-time }
        homeCity: { type: [string, "null"] }
        homeCountryCode: { type: [string, "null"] }
        homeCityKey: { type: [string, "null"] }
        homePlaceId: { type: [string, "null"] }

    MeResponse:
      type: object
      required: [user]
      properties:
        user: { $ref: "#/components/schemas/SerializedUser" }
        profile:
          $ref: "#/components/schemas/SerializedProfile"
          description: Null/absent until the profile row exists

    AuthTokens:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, description: Access TTL in seconds }
        user: { $ref: "#/components/schemas/SerializedUser" }

    UiHint:
      type: object
      description: |
        Hybrid-chat hint: which native inline control best captures the
        answer to the current question. Derived deterministically from the
        server-owned collector state — never from LLM output. A hint is a
        suggestion, not a gate (free text is always accepted); the client
        MUST fall back to a plain text field for null or an unknown
        `control` value.
      required: [control]
      properties:
        control:
          type: string
          enum:
            [name_age, choice_chips, height_wheel, text, multiline_text,
             magic_prompt, photo_upload, voice_record]
          description: |
            `voice_record` — the voice-prompt step: record a 3–30 s clip, commit
            it through `/v1/me/voice-prompt`, then leave the step with
            `POST /v1/onboarding/interview/voice-prompt` (also the Skip path).
        options:
          type: array
          items: { type: string }
          description: choice_chips only — canonical values accepted verbatim
        min:
          type: integer
          description: Inclusive lower bound — a count for wheels/photos, SECONDS for `voice_record`.
        max:
          type: integer
          description: Inclusive upper bound — a count for wheels/photos, SECONDS for `voice_record`.
        skippable: { type: boolean }

    InterviewState:
      type: object
      description: Mirrors `InterviewStateDto` in `public/routes/onboarding-state.ts`
      required: [stepIndex, totalSteps, question, completed, messages, expectingPhoto, photoCount, minPhotos]
      properties:
        stepIndex: { type: integer }
        totalSteps: { type: integer }
        question: { type: [string, "null"] }
        completed: { type: boolean }
        acknowledgement:
          type: [string, "null"]
          description: Voice answers only — the Whisper transcript
        messages:
          type: array
          items:
            type: object
            required: [role, content]
            properties:
              role:
                type: string
                enum: [user, assistant]
              content: { type: string }
        expectingPhoto: { type: boolean }
        photoCount: { type: integer }
        minPhotos: { type: integer }
        uiHint:
          $ref: "#/components/schemas/UiHint"
          description: Null/absent → plain text field
        reaction:
          type: string
          enum: [like, heart]
          description: >-
            The bot's reaction to the user message this state answers — the
            native twin of the Telegram message reaction (`like` 👍 on the
            hobbies answer, `heart` ❤ on the closing vibe answer). Present
            only when there is one; absent otherwise and always absent from
            `GET` state. Deliberately not nullable: `enum: [..., null]` makes
            swift-openapi-generator emit a phantom `_empty_` case (see
            `PendingFeedback.venueFit` history) — absence expresses "none".

    ChatMessage:
      type: object
      required: [id, role, content, imageUrl, createdAt]
      properties:
        id: { type: string }
        role:
          type: string
          enum: [user, assistant, system]
        content: { type: [string, "null"] }
        imageUrl:
          type: [string, "null"]
          description: First photo of the turn; `imageUrls` holds all of them.
        imageUrls:
          type: array
          items: { type: string }
          description: >-
            Photos of the turn, in the order they were sent. Empty on a message
            without photos. Rows written before 2026-09-21 have only `imageUrl`,
            and the server answers with it as a single-item list.
        createdAt: { type: string, format: date-time }
        context:
          $ref: "#/components/schemas/ChatContextSummary"
          description: >-
            The chip this user message was sent with. Absent (never null) on a
            message without one.

    ChatContextRef:
      type: object
      required: [kind, id]
      properties:
        kind:
          type: string
          description: "`inbox_item` — the only kind today; a string so a new one breaks no build"
        id: { type: string, format: uuid }

    ChatContextSummary:
      type: object
      required: [kind, id, title]
      properties:
        kind: { type: string }
        id: { type: string, format: uuid }
        title:
          type: string
          description: Frozen when the message was sent; survives the inbox row ageing out

    InboxItem:
      type: object
      required: [id, type, title, body, createdAt, readAt, matchId, announcementId]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          description: "`announcement` or a push type such as `match.proposed`"
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, "null"], format: date-time }
        matchId: { type: [string, "null"], format: uuid }
        announcementId: { type: [string, "null"], format: uuid }

    InboxItemDetail:
      type: object
      required: [item]
      properties:
        item: { $ref: "#/components/schemas/InboxItem" }
        announcement:
          $ref: "#/components/schemas/InboxAnnouncement"
          description: Present only when the row is an announcement

    InboxAnnouncement:
      type: object
      required: [body, suggestedQuestions]
      properties:
        body: { type: string }
        suggestedQuestions:
          type: array
          maxItems: 3
          items: { type: string }
          description: Tappable questions under the chat chip
        media: { $ref: "#/components/schemas/InboxMedia" }
        event: { $ref: "#/components/schemas/InboxEvent" }

    InboxMedia:
      type: object
      required: [kind, url]
      properties:
        kind:
          type: string
          description: "`image` or `video` (≤ 10 s, silent, played once)"
        url:
          type: string
          description: Signed, valid for 24 hours
        posterUrl:
          type: string
          description: Video only — shown before playback and under Reduce Motion

    InboxEvent:
      type: object
      required: [id, title, status, venueName, venueAddress, startsAt, endsAt, timeZone]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status: { type: string }
        venueName: { type: string }
        venueAddress: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        timeZone:
          type: string
          description: The event's own zone — draw times on its clock, not the device's

    PulseRow:
      type: object
      required: [id, kind, state, title, subtitle, status, at, deadlineAt, target]
      properties:
        id:
          type: string
          description: Stable across polls
        kind:
          type: string
          description: drop_batch | venue_search | event_application | announcement | date_past | chat_topic
        state:
          type: string
          description: processing | active | past
        title:
          type: [string, "null"]
          description: Server-owned content (an announcement or event title); null when the client writes the copy
        subtitle: { type: [string, "null"] }
        status:
          type: [string, "null"]
          description: "`event_application`: approved | pending | waitlisted"
        at: { type: [string, "null"], format: date-time }
        deadlineAt:
          type: [string, "null"]
          format: date-time
          description: "`processing` only — when the job settles at the latest"
        target: { $ref: "#/components/schemas/PulseTarget" }

    PulseTarget:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          description: today | map | inbox_item | chat | chat_topic
        id:
          type: string
          description: Inbox item id for `inbox_item`, topic anchor id for `chat_topic`

    ChatHistoryMessage:
      allOf:
        - $ref: "#/components/schemas/ChatMessage"
        - type: object
          required: [signedImageUrl]
          properties:
            signedImageUrl:
              type: [string, "null"]
              description: 5-min TTL render URL; empty string when signing failed
            signedImageUrls:
              type: array
              items: { type: string }
              description: >-
                5-min TTL render URLs for `imageUrls`, same order. An entry is
                an empty string when that one could not be signed.

    ChatTopic:
      type: object
      required: [anchorId, title, snippet, startedAt, updatedAt, messageCount, depth]
      properties:
        anchorId:
          type: string
          description: |
            First message of the topic. The topic has no row of its own
            anywhere — the client pages `/v1/chat/history?before=` back until
            this id is loaded, then scrolls the transcript to it.
        title:
          type: string
          description: The user's first line after the silence, condensed
        snippet:
          type: string
          description: The last message of the topic, condensed
        startedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        messageCount:
          type: integer
          description: Messages inside this topic
        depth:
          type: integer
          description: |
            Messages from the anchor to the newest message, inclusive of both.
            The client turns this into an exact number of history pages
            instead of guessing and re-requesting.

    PhotosResponse:
      type: object
      required: [photos, signedUrls]
      properties:
        photos:
          type: array
          maxItems: 10
          items: { type: string }
          description: Ordered profile photos, capped at 10
        signedUrls:
          type: array
          items: { type: string }
          description: 1:1 with `photos`; empty string when signing unavailable
        videoEnabled:
          type: boolean
          description: |
            `GET /v1/me/photos` only. True while the server accepts
            `POST /v1/me/video`. Absent on servers that predate the endpoint —
            the client hides the video section rather than offering a save
            that would 404. False is the server's kill switch.
        video:
          $ref: "#/components/schemas/ProfileVideo"
          description: |
            `GET /v1/me/photos` only. The profile video; absent when there is
            none. Upload and delete responses do not carry it — re-read.

    ProfileVideo:
      type: object
      description: |
        One profile video per profile, whichever surface recorded it.
        `url: null` means a video exists but cannot be played in the app — it
        was recorded in Telegram, which keeps it as a `file_id`. The owner can
        still replace or delete it. Signed URLs live 10 minutes and serve
        HTTP Range requests (AVPlayer streams them).
      required: [url, thumbUrl, duration]
      properties:
        url: { type: [string, "null"] }
        thumbUrl:
          type: [string, "null"]
          description: First-frame poster to show before the video buffers
        duration:
          type: [number, "null"]
          description: Seconds, one decimal

    ProfileVideoUploadResponse:
      type: object
      required: [videoUrl, thumbUrl, duration, bonusGranted]
      properties:
        videoUrl:
          type: [string, "null"]
          description: Signed, 10 minutes. Null only when storage signing is unavailable
        thumbUrl: { type: [string, "null"] }
        duration: { type: number, description: "Measured server-side, seconds" }
        bonusGranted:
          type: boolean
          description: |
            True when this upload earned the one-time profile-video ticket
            (ledger reason `video_bonus`). Never reversed by a later delete.

    PhotoConsensus:
      type: object
      required: [status, acceptedCount, pendingCount, rejectedCount, message]
      properties:
        status:
          type: string
          enum: [accepted, pending, capped, confirmed]
        acceptedCount: { type: integer }
        pendingCount: { type: integer }
        rejectedCount: { type: integer }
        message: { type: string, description: Localized user-facing line }

    PhotoUploadResponse:
      allOf:
        - $ref: "#/components/schemas/PhotosResponse"
        - type: object
          required: [photoConsensus]
          properties:
            photoConsensus: { $ref: "#/components/schemas/PhotoConsensus" }
            interviewState:
              $ref: "#/components/schemas/InterviewState"
              description: Present only during onboarding (agent advanced after the upload)

    PhotoRejection:
      type: object
      required: [error, code, retryable]
      properties:
        error: { type: string }
        code:
          type: string
          description: Machine-readable rejection reason
          examples: [no_face, face_obscured, duplicate_near, unsafe_content, identity_mismatch]
        retryable: { type: boolean }

    VenueOrigin:
      type: object
      required: [lat, lng, address]
      properties:
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        address: { type: [string, "null"], maxLength: 256 }

    VenueHardConstraints:
      type: object
      required: [dietary, alcoholFree, stepFree, setting, maxPrice, maxCommuteKm]
      properties:
        dietary:
          type: array
          uniqueItems: true
          items: { type: string, enum: [vegan, vegetarian, halal, kosher, gluten_free] }
          deprecated: true
          description: >-
            Compatibility field, retired 2026-07-30 and normalized to [] server-side.
            It was a hard filter requiring positive evidence on the venue, and the
            curated catalog carries that evidence for no venue at all, so any value
            here guaranteed "no place found". Clients should stop offering it.
        alcoholFree:
          type: boolean
          deprecated: true
          description: Compatibility field, retired 2026-07-30 and normalized to false server-side. See `dietary`.
        stepFree:
          type: boolean
          deprecated: true
          description: Compatibility field, retired 2026-07-30 and normalized to false server-side. See `dietary`.
        setting: { type: [string, "null"], enum: [indoor, outdoor, null] }
        maxPrice:
          type: [string, "null"]
          enum: [free, inexpensive, moderate, null]
          deprecated: true
          description: Compatibility field. Initial assignment uses the server-owned base price policy and normalizes this value to null; price/exclusivity is selected only in Venue Change.
        maxCommuteKm: { type: integer, enum: [8, 12] }

    VenueIntentConfirmation:
      type: object
      required: [experiences, ambiences, formats, hardConstraints, origin]
      properties:
        experiences:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [conversation, coffee_treats, meal_discovery, walk_view, art_culture, drinks_evening, playful_activity, surprise_me] }
        ambiences:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [quiet, cozy_public, lively, design_forward, scenic, romantic_public] }
        formats:
          type: array
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: [seated, walking, interactive, indoor, outdoor] }
        hardConstraints: { $ref: "#/components/schemas/VenueHardConstraints" }
        origin: { $ref: "#/components/schemas/VenueOrigin" }

    VenueIntentV2:
      allOf:
        - $ref: "#/components/schemas/VenueIntentConfirmation"
        - type: object
          required: [rawText, parserConfidence, parserVersion, state, interpretedAt, confirmedAt, manualConfirmationRequired]
          properties:
            rawText: { type: string, maxLength: 500 }
            parserConfidence: { type: number, minimum: 0, maximum: 1 }
            parserVersion: { type: string, enum: [venue-intent-v2] }
            state: { type: string, enum: [draft, confirmed] }
            interpretedAt: { type: string, format: date-time }
            confirmedAt: { type: [string, "null"], format: date-time }
            manualConfirmationRequired: { type: boolean }

    VenueIntentState:
      type: object
      required: [status, partnerSubmitted, suggestions, selectionError]
      properties:
        intent: { $ref: "#/components/schemas/VenueIntentV2" }
        status: { type: string, enum: [none, draft, confirmed] }
        partnerSubmitted: { type: boolean }
        suggestions:
          type: array
          maxItems: 3
          items:
            type: object
            required: [experiences, ambiences, formats]
            properties:
              experiences: { type: array, items: { type: string } }
              ambiences: { type: array, items: { type: string } }
              formats: { type: array, items: { type: string } }
        selectionError: { type: [string, "null"] }
        market:
          $ref: "#/components/schemas/Market"
          description: >-
            The user's launched market (PRODUCT_SPEC 3.7). Centre the departure
            map on it and refuse a pin outside its radius BEFORE the user can
            confirm — the server refuses it either way, but a refusal that only
            arrives after Confirm is a dead end.


            Absent (the server sends `null`) means do not gate. Deliberately a
            bare `$ref` and NOT `oneOf: [$ref, "null"]`: swift-openapi-generator
            SKIPS that shape silently, which is how this very field never
            reached iOS between 2026-08-05 and 2026-08-06 — the client had no
            way to see the market and the gate existed on one surface only. An
            optional property decodes an explicit JSON `null` to nil, so the
            wire format is unchanged and the Mini App is unaffected.

    Market:
      type: object
      description: A launched city. Served, not bundled, so a new market needs no client release.
      required: [cityKey, city, latitude, longitude, radiusKm]
      properties:
        cityKey: { type: string, example: "ua:kyiv" }
        city: { type: string, example: "Kyiv" }
        latitude: { type: number }
        longitude: { type: number }
        radiusKm:
          type: number
          description: Kilometres from the centroid still treated as inside the city.

    VenueOriginOutsideMarket:
      type: object
      description: >-
        The departure pin sits outside the caller's launched market, so no venue
        can satisfy both sides (PRODUCT_SPEC 3.7). Name the city and send the
        user back to the map — do not retry the same coordinates.
      required: [error, market]
      properties:
        error: { type: string, enum: [origin-outside-market] }
        market: { $ref: "#/components/schemas/Market" }

    MusicTrack:
      type: object
      description: |
        A Spotify track as Gennety shows it (decision 2026-09-11). Every field
        is Spotify's own answer for `spotifyTrackId`, re-read at least weekly.
        Spotify's branding rules apply wherever it is drawn: the full Spotify
        logo, the cover neither cropped nor overlaid, and a link to
        `spotifyUrl`.
      required:
        [spotifyTrackId, title, artists, albumName, coverUrl, spotifyUrl, previewUrl, explicit]
      properties:
        spotifyTrackId: { type: string }
        title: { type: string }
        artists:
          type: string
          description: Artist names joined with ", " in Spotify's order
        albumName: { type: [string, "null"] }
        coverUrl:
          type: [string, "null"]
          description: Spotify CDN image, about 300 px — render as is, never cropped
        spotifyUrl:
          type: string
          description: "`https://open.spotify.com/track/<id>` — opens the Spotify app when installed"
        previewUrl:
          type: [string, "null"]
          description: Null for every app Spotify registered after 2024-11-27 — expect null
        explicit: { type: boolean }

    MusicTracksResponse:
      type: object
      required: [tracks]
      properties:
        tracks:
          type: array
          items: { $ref: "#/components/schemas/MusicTrack" }

    MyVoicePrompt:
      type: object
      description: |
        The caller's own recording. Absent (not null-in-a-union) when there is
        none — declaring it `oneOf: [$ref, "null"]` is the shape
        swift-openapi-generator SKIPS in silence, and this repo has paid for
        that three times (`SerializedUser.gender`, `VenueIntentState.market`,
        `PendingFeedback`).
      required: [durationSec, waveform]
      properties:
        durationSec: { type: integer }
        waveform:
          type: array
          items: { type: integer }
          description: |
            Normalized 0..100 peaks. Precomputed server-side at ingest so the
            player can draw bars before fetching any audio — which is the whole
            reason they exist.
        audioUrl:
          type: [string, "null"]
          description: Short-TTL signed URL. Null for a Telegram-recorded prompt, whose bytes live at Telegram.
        createdAt: { type: string, format: date-time }

    PartnerVoicePrompt:
      type: object
      description: |
        The partner's recording, as shown on the match card. Deliberately
        carries no transcript: the product ships a person's voice, not a
        machine's reading of it.
      required: [durationSec, waveform]
      properties:
        durationSec: { type: integer }
        waveform:
          type: array
          items: { type: integer }
        audioUrl:
          type: [string, "null"]

    SerializedMatch:
      type: object
      description: Mirrors `SerializedMatch` in `public/matches-service.ts`
      required:
        [id, status, pitchForMe, iceBreakers, wingmanHint, synergyScore, synergyReason,
         agreedTime, venueName, venueAddress, venueLat, venueLng, venueCategory,
         venueGoogleMapsUri, venueSelectionReason, myVenueIntentStatus,
         partnerVenueIntentSubmitted, venueIntentMode,
         mapPreviewUrl, transitHint, partnerFirstName, partnerAge,
         partnerGender, myDecision, ticketGate, partnerUniversityDomain,
         myVibeSubmitted, partnerVibeSubmitted,
         safetyBriefAck, proxyChatOpensAt, proxyChatClosesAt,
         proposalDeadlineAt, timeZone, serverTimeAt]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/MatchStatus" }
        pitchForMe: { type: [string, "null"] }
        iceBreakers:
          type: array
          items: { type: string }
          description: empty until the T-5h tick writes them, and again from T+2h after agreedTime (server-gated close)
        wingmanHint:
          type: [string, "null"]
          description: null until T-1.5h before agreedTime (server-gated reveal) and again from T+2h (server-gated close)
        synergyScore:
          type: [integer, "null"]
          minimum: 70
          maximum: 99
        synergyReason: { type: [string, "null"] }
        agreedTime: { type: [string, "null"], format: date-time }
        venueName: { type: [string, "null"] }
        venueAddress: { type: [string, "null"] }
        venueLat: { type: [number, "null"] }
        venueLng: { type: [number, "null"] }
        venueGoogleMapsUri: { type: [string, "null"], format: uri }
        venueSelectionReason: { type: [string, "null"] }
        afterDatePlace:
          description: >-
            Tempo Sync post-date scenario: a place a few minutes' walk from the
            venue, open when the date ends. Null (or absent) for almost every
            pair — it exists only when one side has a life rhythm on file. Show
            it with the SAME neutral wording for every place ("if you feel like
            keeping going…"); never say why it was chosen — the partner sees it too.
          $ref: "#/components/schemas/AfterDatePlace"
        myVenueIntentStatus: { type: string, enum: [none, draft, confirmed] }
        partnerVenueIntentSubmitted: { type: boolean }
        venueIntentMode: { type: string, enum: [off, shadow, live] }
        venueCategory: { type: [string, "null"] }
        mapPreviewUrl: { type: [string, "null"] }
        transitHint: { type: [string, "null"] }
        partnerFirstName: { type: [string, "null"] }
        partnerAge: { type: [integer, "null"] }
        myDecision:
          type: [string, "null"]
          description: |
            `accept` | `decline` — THIS caller's own answer to the pitch, null
            while it is still owed.

            Blind-decision safe by construction: it is never the partner's
            choice. It exists because a first decider leaves the row
            `proposed` (§3.4), so without it a client cannot tell "you still
            owe an answer" from "you answered, we're waiting on them" — and
            would re-open the pitch over a decision already made.
        partnerGender:
          type: [string, "null"]
          description: |
            `male` | `female`. The native pitch's decision question is gendered
            in four of the five supported languages. Reveals nothing the
            pairing did not — the photo, name and age are already on screen at
            that moment.

            Deliberately NOT `oneOf: [$ref Gender, "null"]`: swift-openapi-
            generator does not support that shape and SKIPS the property
            silently, which is how `SerializedUser.language` ended up missing
            from the generated client. A nullable scalar is the shape that
            actually reaches iOS.
        ticketGate:
          type: string
          enum: [none, open, reveal]
          description: |
            Which §3.5b Date Ticket screen this side owes.

            - `open`   — the gate is blocking the pair's Calendar. Route to the
                         ticket gate, not to planning.
            - `reveal` — settled, and the partner covered THIS side's ticket
                         without them having seen it. The server is deliberately
                         holding this side's Calendar back until they open the
                         reveal, so routing straight to planning strands them on
                         an empty screen.
            - `none`   — feature off, never armed, or already done.

            `Match.ticketStatus` is NOT exposed and must not be inferred: it
            defaults to `pending` on every row ever created, so a match from
            before the feature existed is indistinguishable from an open gate.
        partnerUniversityDomain: { type: [string, "null"] }
        myVibeSubmitted: { type: boolean }
        partnerVibeSubmitted: { type: boolean }
        safetyBriefAck: { type: boolean }
        proxyChatOpensAt:
          type: [string, "null"]
          format: date-time
          description: |
            T-1h — when the §Phase 4 anonymous chat opens for this pair, or
            null when it has no window (feature off, or the pair coordinates
            another way). This is what tells the date hub whether to offer the
            entry at all, without a second request on every open.

            Two nullable SCALARS rather than one nullable object, deliberately:
            a `oneOf: [$ref, "null"]` is the shape swift-openapi-generator drops
            in silence (see `partnerGender` below), and this field's whole job
            is to be read by the client.
        proxyChatClosesAt:
          type: [string, "null"]
          format: date-time
          description: |
            T+2h. Sent rather than derived so the client never re-implements a
            product constant; the server closes the window regardless.
        proposalDeadlineAt:
          type: [string, "null"]
          format: date-time
          description: 24h decision deadline; only for dispatched `proposed` matches
        partnerVoicePrompt:
          $ref: "#/components/schemas/PartnerVoicePrompt"
        partnerMusicTracks:
          type: array
          description: |
            The partner's pinned tracks, in their order (decision 2026-09-11).
            Absent while `PROFILE_MUSIC_ENABLED` is off; `[]` when they pinned
            nothing. A property of the PERSON, so it belongs on the pitch and
            never on a lock-screen surface.
          items: { $ref: "#/components/schemas/MusicTrack" }
        partnerFrequentPlaces:
          type: array
          description: |
            The partner's frequently visited places (founder decision
            2026-09-11): at most three active catalog places, each a name, a
            category, the venue's catalog `latitude`/`longitude` — both or
            neither (decision 2026-09-14) — and, when the catalog has a photo,
            a `thumbnailUrl` (decision 2026-09-13); nothing else — no visit
            count, no day, no position of the partner. Empty when the partner
            switched the feature off, hid them, or has none that qualify.

            Not in `required` on purpose: a build that reads it has to keep
            decoding a server that predates it.
          items: { $ref: "#/components/schemas/PartnerFrequentPlace" }
        timeZone:
          type: [string, "null"]
          description: |
            IANA zone of the caller's city (§3.8). `agreedTime` is an instant,
            and a date card has to draw it on a wall clock — the device's is
            the wrong one, because the date happens in the pair's city and a
            traveller would otherwise read a time neither side meant. Same
            reason `CalendarState.timeZone` exists, and the same choice the
            server-rendered Telegram card already makes.

            `null` only for a profile with no city yet, which cannot reach a
            scheduled match; fall back to the device zone rather than hiding
            the time.
        serverTimeAt:
          type: string
          format: date-time
          description: Server clock at response time for countdown skew correction
