name: CI

# Docs-only commits (the deploy journal, decisions) cannot break the build:
# nothing under apps/ or packages/ reads a .md file.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: gennety
          POSTGRES_PASSWORD: gennety
          POSTGRES_DB: gennety_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gennety -d gennety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      CI: true
      NODE_ENV: test
      DATABASE_URL: postgresql://gennety:gennety@localhost:5433/gennety_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Same major as the droplet (docs/operations/environments.md).
          node-version: 20

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @gennety/db db:generate

      - name: Check tracked secrets
        run: pnpm security:secrets

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build Mini App
        run: pnpm --filter @gennety/webapp build

      - name: Apply test database schema
        run: pnpm test:db:push

      - name: Run PostgreSQL integration tests
        run: pnpm test:integration

  # A new advisory turns this red with no change in the repo (72 of the 139
  # failed runs between 2026-08-24 and 2026-09-22), so it reports without
  # failing the run. pnpm audit reads the lockfile alone — no install needed.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.0 --activate

      - name: Audit dependencies
        run: pnpm security:audit
