<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Gennety Verification</title>
    <script>(function(){try{var q=new URLSearchParams(location.search).get("theme");if(q==="light"||q==="dark"){try{localStorage.setItem("gennety-theme",q);}catch(e){}}var t=(q==="light"||q==="dark")?q:localStorage.getItem("gennety-theme");document.documentElement.dataset.theme=(t==="light"||t==="dark")?t:"dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!--
      No third-party verification SDK script any more. AWS Face Liveness runs
      through @aws-amplify/ui-react-liveness, bundled by Vite and mounted from
      verification.ts once /init returns a session + short-lived credentials.
      Camera permissions inside the Mini App still require the host domain
      (dating-calendar.gennety.com) to be registered via BotFather /setdomain.
    -->
    <!--
      Inline CSS — same pattern as location.html. The earlier external
      stylesheet variant (`<link rel="stylesheet" href="/src/verification.css">`)
      served the Vite HMR wrapper, not raw CSS, and produced a black-screen
      Mini App in dev. Inlining sidesteps all dev-mode quirks; prod is
      unaffected because Vite ships the same HTML literally.
    -->
    <style>
      /* Self-contained theme tokens (mirrors theme.css). Inlined on purpose:
         this file avoids a JS-imported stylesheet because that produced a
         black-screen Mini App in dev (see the note above), and inline tokens
         also dodge a first-paint flash while the module loads. Values track the
         shared Liquid Glass kit + burgundy brand. */
      :root,
      :root[data-theme="dark"] {
        /* Native controls (the detector's camera <select>, scrollbars) follow
           this, so it has to be stated before the island's stylesheet lands. */
        color-scheme: dark;
        --bg: #030303;
        --text: #e9e6e5;
        --text-muted: #8e8895;
        --accent: #8b253b;
        --accent-bright: #b6304f;
        --glass-bg: rgba(255, 255, 255, 0.055);
        --glass-border: rgba(255, 255, 255, 0.12);
        --glass-highlight: rgba(255, 255, 255, 0.16);
        --glass-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
        --glass-blur: 22px;
        --success: #28c76f;
        --error: #e0566e;
        /* Telegram fullscreen chrome inset (close ×, menu ⋯). `env()` does NOT
           include those floating controls; `contentSafeAreaInset` does, and
           telegram-insets.ts writes the real value over these fallbacks. 56px
           covers every current client if the event never fires. */
        --tg-content-top: 56px;
        --tg-content-bottom: 0px;
      }
      :root[data-theme="light"] {
        color-scheme: light;
        --bg: #f5f5f5;
        --text: #1d1d1d;
        --text-muted: #6b6670;
        --glass-bg: rgba(255, 255, 255, 0.55);
        --glass-border: rgba(0, 0, 0, 0.06);
        --glass-highlight: rgba(255, 255, 255, 0.9);
        --glass-shadow: 0 18px 40px rgba(0, 0, 0, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
        overflow: hidden;
      }
      /* Soft burgundy ambience so the frosted glass has something to refract. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(120% 55% at 85% -10%, rgba(139, 37, 59, 0.3), transparent 60%),
          radial-gradient(95% 45% at -5% 108%, rgba(139, 37, 59, 0.16), transparent 55%);
      }
      :root[data-theme="light"] body::before {
        background:
          radial-gradient(120% 55% at 85% -10%, rgba(139, 37, 59, 0.16), transparent 60%),
          radial-gradient(95% 45% at -5% 108%, rgba(139, 37, 59, 0.08), transparent 55%);
      }
      #root {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .screen {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 96px 24px 32px;
        gap: 16px;
        text-align: center;
      }
      /* The consent screen is the one view that can overflow a short phone —
         it carries real disclosure text, so it stays scrollable. `margin-block:
         auto` on the text block centres it while there is room and gives up the
         centring (rather than clipping the top) once there isn't. Top padding
         clears Telegram's floating close ×/menu ⋯; bottom padding clears the
         floating CTA below, which is out of flow. */
      .screen--consent {
        justify-content: flex-start;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        padding-top: calc(
          env(safe-area-inset-top, 0px) + var(--tg-content-top) + 24px
        );
        padding-bottom: calc(
          max(env(safe-area-inset-bottom, 0px), var(--tg-content-bottom)) + 116px
        );
      }
      /* Borderless by design: no card, no rim, no frosted plate — the
         disclosure is the screen, so it sits directly on the page and the only
         object with a shape is the button. */
      .consent {
        display: flex;
        flex-direction: column;
        gap: 14px;
        width: 100%;
        max-width: 380px;
        margin-block: auto;
        text-align: left;
      }
      .consent-title {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .consent-text {
        margin: 0;
        font-size: 14px;
        line-height: 1.5;
        opacity: 0.85;
      }
      .consent-link {
        font-size: 14px;
        font-weight: 600;
        color: var(--accent, #8b253b);
        text-decoration: underline;
      }
      .consent-error {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
        color: #d2394b;
      }
      .consent-error[hidden] {
        display: none;
      }

      /* The one action on the screen. Deliberately NOT Telegram's MainButton:
         that renders as a full-width bar welded to the bottom edge, which is
         exactly the block this screen doesn't want. This is an independent
         floating pill instead, inset from all three edges and riding above the
         disclosure text.

         Its light is the house treatment (`.ref-share`, referral.css): burgundy
         fill carrying an inner-perimeter sheen — light sprayed from each of the
         four edges INWARD. Mechanically four `inset` shadows with a negative
         spread, which pulls each shadow's body back past its edge so only the
         soft falloff survives just inside the border; the edge lights the
         button's interior rather than drawing a stroke. No outward bloom and no
         drop shadow — keeping the light inside the shape is what makes it read
         as soft rather than neon. */
      .consent-cta {
        position: fixed;
        z-index: 2;
        left: 20px;
        right: 20px;
        bottom: calc(
          max(env(safe-area-inset-bottom, 0px), var(--tg-content-bottom)) + 22px
        );
        margin: 0 auto;
        width: auto;
        max-width: 380px;
        border: 0;
        cursor: pointer;
        border-radius: 24px;
        padding: 17px 20px;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.005em;
        color: #fff;
        background:
          linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.26),
            rgba(255, 255, 255, 0) 16%,
            rgba(255, 255, 255, 0) 84%,
            rgba(255, 255, 255, 0.2)
          ),
          linear-gradient(160deg, #a23350 0%, #8b253b 55%, #6f1c2f 100%);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.5),
          inset 0 10px 20px -14px rgba(255, 255, 255, 0.62),
          inset 0 -10px 20px -14px rgba(255, 255, 255, 0.48),
          inset 9px 0 20px -13px rgba(255, 255, 255, 0.55),
          inset -9px 0 20px -13px rgba(255, 255, 255, 0.55),
          inset 0 -2px 6px rgba(74, 16, 31, 0.18);
        transition:
          transform 140ms ease,
          box-shadow 180ms ease,
          opacity 160ms ease;
      }
      /* Press lifts the sheen rather than dimming the button — the light
         answers the touch, which is the point of putting it inside the shape. */
      .consent-cta:active {
        transform: scale(0.98);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.55),
          inset 0 10px 20px -14px rgba(255, 255, 255, 0.7),
          inset 0 -10px 20px -14px rgba(255, 255, 255, 0.54),
          inset 9px 0 20px -13px rgba(255, 255, 255, 0.62),
          inset -9px 0 20px -13px rgba(255, 255, 255, 0.62),
          inset 0 -2px 6px rgba(74, 16, 31, 0.18);
      }
      .consent-cta:disabled {
        opacity: 0.62;
        cursor: default;
        transform: none;
      }

      /* Liquid Glass status panel wrapping the spinner / check / message. */
      .screen__panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        width: 100%;
        max-width: 340px;
        padding: 36px 28px;
        border-radius: 28px;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        box-shadow: var(--glass-shadow), inset 0 1px 0 var(--glass-highlight);
        backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
        -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(1.5);
      }
      .screen-text {
        font-size: 15px;
        color: var(--text-muted);
        margin: 0;
        line-height: 1.45;
        max-width: 300px;
      }
      .screen-title {
        font-size: 18px;
        font-weight: 600;
        color: var(--text);
        margin: 0;
        line-height: 1.3;
        letter-spacing: -0.01em;
      }
      /* Host for the Amplify Face Liveness detector. It renders its own
         camera surface, so we only give it the full remaining height. */
      .liveness-mount {
        flex: 1 1 auto;
        position: relative;
        width: 100%;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid var(--glass-border);
        border-top-color: var(--accent-bright);
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .error-glyph {
        font-size: 48px;
        line-height: 1;
      }
      /* Animated success checkmark — the "all done" beat after the check passes.
         Pure inline SVG + CSS (no Lottie runtime / CDN) so it can't fail to
         load inside the Telegram WebView and adds nothing to the bundle. */
      .check-anim {
        position: relative;
        width: 96px;
        height: 96px;
        display: grid;
        place-items: center;
      }
      .check-anim__halo {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 50%;
        background: var(--success);
        opacity: 0;
        transform: scale(0.4);
        animation: check-halo 0.9s ease-out 0.12s both;
      }
      .check-anim__svg {
        position: relative;
        width: 84px;
        height: 84px;
        overflow: visible;
      }
      .check-anim__disc {
        fill: var(--success);
        transform-origin: 50% 50%;
        transform: scale(0);
        animation: check-pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      }
      .check-anim__tick {
        fill: none;
        stroke: #fff;
        stroke-width: 4.5;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 33;
        stroke-dashoffset: 33;
        animation: check-draw 0.34s cubic-bezier(0.65, 0, 0.45, 1) 0.34s
          forwards;
      }
      .check-caption {
        opacity: 0;
        animation: check-caption-in 0.4s ease-out 0.5s forwards;
      }
      @keyframes check-pop {
        0% {
          transform: scale(0);
        }
        60% {
          transform: scale(1.06);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes check-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes check-halo {
        0% {
          opacity: 0.28;
          transform: scale(0.4);
        }
        100% {
          opacity: 0;
          transform: scale(1.3);
        }
      }
      @keyframes check-caption-in {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .check-anim__halo {
          animation: none;
          opacity: 0;
        }
        .check-anim__disc {
          animation: none;
          transform: scale(1);
        }
        .check-anim__tick {
          animation: none;
          stroke-dashoffset: 0;
        }
        .check-caption {
          animation: none;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!--
        Initial loading shell — JS swaps this for the liveness detector, an
        error card, or the success screen depending on the flow. Inline so the
        user never sees a blank flash while verification.ts boots.
      -->
      <div class="screen" id="loading-screen">
        <div class="spinner" aria-hidden="true"></div>
        <p class="screen-text" id="loading-text"></p>
      </div>
    </div>
    <script type="module" src="/src/verification.ts"></script>
  </body>
</html>
