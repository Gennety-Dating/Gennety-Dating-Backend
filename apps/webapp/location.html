<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Gennety Location</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
    <!-- Critical first-paint CSS — the loading screen.

         Unlike every other Mini App (an empty `#root` that JS fills), this page
         ships a REAL screen in its markup, while `location.css` is imported from
         the deferred `location.ts` module. So between the first frame and the
         bundle landing, this block is the only stylesheet the page has, and the
         markup below paints raw: the pin SVG dropped in normal flow, a naked
         <input>, and two default pill buttons. Telegram opens a Mini App at
         roughly half the screen height and expands it only once loading
         finishes, so that unstyled frame is exactly what the user stares at for
         the whole opening sheet.

         `#boot` is an opaque, theme-correct cover over that window carrying the
         "locating" mark; `location.ts` fades it out as soon as the map paints
         (see `dismissBoot`). The backdrop colors are the shared theme tokens
         (theme.css --bg) rather than the old hardcoded `#120e1c`, which belonged
         to no theme and flashed dark before a light-theme app. -->
    <style>
      :root {
        --boot-bg: #030303;
        --boot-ring: rgba(182, 48, 79, 0.34);
        --boot-pin-shadow: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
      }
      :root[data-theme="light"] {
        --boot-bg: #f5f5f5;
        --boot-ring: rgba(139, 37, 59, 0.22);
        --boot-pin-shadow: drop-shadow(0 3px 6px rgba(109, 28, 46, 0.22));
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--boot-bg);
        overflow: hidden;
      }

      #boot {
        position: fixed;
        inset: 0;
        /* Above every app layer — .vibe-stage tops the stack at 10000. */
        z-index: 99999;
        background: var(--boot-bg);
        transition: opacity 0.32s ease;
        /* Dead-man's switch: if the bundle never executes at all (a dropped
           connection mid-open), nothing would ever call dismissBoot and the
           cover would sit there forever. This fires far past the JS cap, so a
           merely slow boot never reaches it. */
        animation: bootFailsafe 0s linear 8s forwards;
      }
      #boot.done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes bootFailsafe {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      /* A faint accent bloom so a near-black page with one small mark on it
         reads as composed rather than empty. */
      #boot::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(40% 26% at 50% 50%, var(--boot-ring), transparent 72%);
        opacity: 0.5;
      }

      /* The mark sits at the viewport centre — exactly where the real map pin
         lands — so the reveal reads as the map arriving underneath a pin that
         never moved, not as one screen swapping for another. */
      #boot-mark {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 136px;
        height: 136px;
        transform: translate(-50%, -50%);
      }
      .boot-ping {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 20px;
        height: 20px;
        margin: -10px 0 0 -10px;
        border: 1.5px solid var(--boot-ring);
        border-radius: 50%;
        opacity: 0;
        animation: bootPing 2.6s cubic-bezier(0.22, 1, 0.36, 1) infinite;
      }
      .boot-ping.d2 {
        animation-delay: 0.87s;
      }
      .boot-ping.d3 {
        animation-delay: 1.74s;
      }
      @keyframes bootPing {
        0% {
          transform: scale(0.55);
          opacity: 0;
        }
        12% {
          opacity: 1;
        }
        100% {
          transform: scale(6);
          opacity: 0;
        }
      }
      /* Same glyph, colors and shadow as the live `#pin` (location.css), so the
         handover is invisible. */
      #boot-pin {
        position: absolute;
        left: 50%;
        top: 50%;
        filter: var(--boot-pin-shadow);
        animation: bootFloat 2.6s ease-in-out infinite;
      }
      @keyframes bootFloat {
        0%,
        100% {
          transform: translate(-50%, calc(-100% + 4px));
        }
        50% {
          transform: translate(-50%, calc(-100% - 3px));
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .boot-ping {
          animation: none;
          transform: scale(3.2);
          opacity: 0.5;
        }
        .boot-ping.d2,
        .boot-ping.d3 {
          display: none;
        }
        #boot-pin {
          animation: none;
          transform: translate(-50%, calc(-100% + 4px));
        }
      }
    </style>
    <script>(function(){try{var q=new URLSearchParams(location.search).get("theme");if(q==="light"||q==="dark"){try{localStorage.setItem("gennety-theme",q);}catch(e){}}var t=(q==="light"||q==="dark")?q:localStorage.getItem("gennety-theme");document.documentElement.dataset.theme=(t==="light"||t==="dark")?t:"dark";}catch(e){document.documentElement.dataset.theme="dark";}})();</script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin="anonymous"
    />
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <!-- Loading cover. Styled entirely by the critical CSS above (it can never
         itself be unstyled), removed by location.ts once the map has painted. -->
    <div id="boot" aria-hidden="true">
      <div id="boot-mark">
        <span class="boot-ping"></span>
        <span class="boot-ping d2"></span>
        <span class="boot-ping d3"></span>
        <svg id="boot-pin" width="34" height="34" viewBox="0 0 24 24" fill="none">
          <path
            d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"
            fill="#8b253b"
            stroke="#b6304f"
            stroke-width="1.2"
          />
          <circle cx="12" cy="9" r="2.6" fill="#ffffff" />
        </svg>
      </div>
    </div>

    <!-- Full-bleed map backdrop -->
    <div id="map"></div>
    <div id="scrim"></div>

    <!-- Center-pin picker: the map moves under a fixed pin -->
    <div id="pin-shadow"></div>
    <svg id="pin" width="34" height="34" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path
        d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"
        fill="#8b253b"
        stroke="#b6304f"
        stroke-width="1.2"
      />
      <circle cx="12" cy="9" r="2.6" fill="#ffffff" />
    </svg>

    <!-- TOP island: search + floating results dropdown -->
    <div class="layer top">
      <div class="island search-wrap">
        <span class="icon" aria-hidden="true">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7" />
            <path d="m20 20-3.5-3.5" />
          </svg>
        </span>
        <input type="text" class="search" id="search" placeholder="" autocomplete="off" />
      </div>
      <div class="island results" id="results"></div>
    </div>

    <!-- BOTTOM island: address readout + "use my location" + confirm CTA -->
    <div class="layer bottom">
      <div class="island confirm-island">
        <div class="addr-row">
          <span class="pin-ico" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11z" />
              <circle cx="12" cy="10" r="2.4" />
            </svg>
          </span>
          <div class="txt">
            <div class="label" id="addr-label"></div>
            <div class="value" id="selected">&nbsp;</div>
          </div>
        </div>
        <!-- Secondary text action: use the device's current position -->
        <button type="button" class="loc-btn" id="share-current">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3.2" />
            <path d="M12 2v3M12 19v3M2 12h3M19 12h3" />
          </svg>
          <span class="loc-btn-text"></span>
        </button>
        <button type="button" class="cta" id="confirm">
          <span class="cta-text"></span>
          <span class="spinner" aria-hidden="true"></span>
          <svg class="arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>
    </div>

    <!-- No-context fallback (opened without a match id) -->
    <div id="no-context" style="display: none"></div>

    <!-- Venue Intent V2 — step 2: describe the vibe, review the plan, confirm.
         The departure origin (step 1, the map) stays in memory while this opens;
         interpret/confirm persist it. Full brand liquid-glass surface (theme.css
         tokens) — every string is set from location.ts i18n. -->
    <section id="vibe-stage" class="vibe-stage" hidden aria-live="polite">
      <div class="vibe-card">
        <div class="vibe-head">
          <button id="vibe-back" class="vibe-back" type="button" aria-label="Back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path d="M15 6l-6 6 6 6" />
            </svg>
          </button>
          <span class="vibe-step" id="vibe-step">Step 2 of 2</span>
        </div>

        <h1 id="vibe-title">What kind of spot?</h1>
        <p id="vibe-help" class="vibe-help">Describe the vibe of the place — I'll find a real venue to match.</p>

        <div class="vibe-input">
          <textarea id="vibe-text" maxlength="500" rows="4" placeholder=""></textarea>
        </div>
        <button id="vibe-interpret" class="cta" type="button">
          <span class="cta-text">Continue</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>

        <div id="vibe-review" hidden>
          <p class="vibe-review-label" id="vibe-review-label">Here's what I picked up — tap to fine-tune:</p>

          <div class="vibe-group">
            <div class="vibe-group-head">
              <span class="vibe-group-label" id="vibe-label-exp">Experience</span>
              <span class="vibe-group-hint" id="vibe-hint-exp"></span>
            </div>
            <div id="vibe-chips-exp" class="vibe-chips"></div>
          </div>
          <div class="vibe-group">
            <div class="vibe-group-head">
              <span class="vibe-group-label" id="vibe-label-amb">Atmosphere</span>
              <span class="vibe-group-hint" id="vibe-hint-amb"></span>
            </div>
            <div id="vibe-chips-amb" class="vibe-chips"></div>
          </div>
          <div class="vibe-group">
            <div class="vibe-group-head">
              <span class="vibe-group-label" id="vibe-label-fmt">Format</span>
              <span class="vibe-group-hint" id="vibe-hint-fmt"></span>
            </div>
            <div id="vibe-chips-fmt" class="vibe-chips"></div>
          </div>
          <div class="vibe-group">
            <div class="vibe-group-head">
              <span class="vibe-group-label" id="vibe-label-must">Must-haves</span>
              <span class="vibe-group-hint" id="vibe-hint-must"></span>
            </div>
            <div class="vibe-constraints" id="vibe-constraints"></div>
          </div>

          <p id="vibe-price-note" class="vibe-price-note"></p>
          <button id="vibe-confirm" class="cta" type="button">
            <span class="cta-text">Looks right — find our spot</span>
            <span class="spinner" aria-hidden="true"></span>
          </button>
        </div>

        <p id="vibe-error" class="vibe-error" role="alert"></p>
      </div>
    </section>

    <script type="module" src="/src/location.ts"></script>
  </body>
</html>
